<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIM Exam Prep App</title>
    <style>
        :root {
            --bg: #090a0f;
            --surface: #13151f;
            --surface-hover: #1b1e2c;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(147, 51, 234, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent: #9333ea;
            --accent-pink: #ec4899;
            --accent-glow: rgba(147, 51, 234, 0.35);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --border: rgba(0, 0, 0, 0.08);
            --border-highlight: rgba(147, 51, 234, 0.4);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 14px;
            max-width: 820px;
            margin: 0 auto;
            transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out);
        }

        .fade-in {
            animation: fadeIn 0.5s var(--ease-out) forwards;
            opacity: 0;
            transform: translateY(16px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Artifact Card UI Header */
        .artifact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
            transition: all 0.4s var(--ease-spring);
        }

        .artifact-card:hover {
            border-color: var(--border-highlight);
            box-shadow: 0 30px 60px -20px var(--accent-glow);
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            margin-bottom: 20px;
            border-radius: 99px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px -8px rgba(0,0,0,0.3);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-pink));
            color: #fff;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-icon {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s var(--ease-spring);
        }

        .btn-icon:hover {
            border-color: var(--border-highlight);
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .lang-pills {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px;
            border-radius: 99px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 800;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.3s var(--ease-spring);
        }

        .lang-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
            transform: scale(1.05);
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.18) 0%, rgba(236, 72, 153, 0.12) 100%);
            border: 1px solid var(--border-highlight);
            border-radius: 24px;
            padding: 26px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px -10px var(--accent-glow);
        }

        .hero-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(90deg, var(--text-primary), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-pink));
            border-radius: 99px;
            transition: width 0.6s var(--ease-out);
        }

        .tabs-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 18px;
            scrollbar-width: none;
        }
        .tabs-wrapper::-webkit-scrollbar { display: none; }

        .tab-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 14px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s var(--ease-spring);
        }

        .tab-chip:hover {
            border-color: var(--border-highlight);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .tab-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 6px 20px var(--accent-glow);
            transform: scale(1.03);
        }

        .topic-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s var(--ease-spring);
        }

        .topic-row:hover {
            border-color: var(--border-highlight);
            transform: translateX(4px);
            background: var(--surface-hover);
        }

        .topic-row.completed {
            opacity: 0.55;
        }
        .topic-row.completed h4 {
            text-decoration: line-through;
        }

        .topic-badge {
            font-size: 9px;
            font-weight: 800;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: inline-block;
            margin-bottom: 4px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .mobbin-opt {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s var(--ease-spring);
        }

        .mobbin-opt:hover {
            border-color: var(--border-highlight);
            transform: translateX(4px);
        }

        .mobbin-opt.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            font-weight: 800;
        }

        .mobbin-opt.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
            font-weight: 800;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: all 0.3s var(--ease-spring);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border-highlight);
            border-radius: 24px;
            padding: 26px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 14px;
            outline: none;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .choice-btn {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            color: var(--text-primary);
            text-align: left;
            transition: all 0.3s var(--ease-spring);
        }

        .choice-btn:hover {
            border-color: var(--accent);
            background: rgba(147, 51, 234, 0.15);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="top-nav fade-in">
        <div class="user-pill">
            <div id="avatar" class="avatar">T</div>
            <div>
                <h4 id="u-name" style="font-size: 13px; font-weight: 800;">Tələbə</h4>
                <p id="u-group" style="font-size: 10px; color: var(--text-tertiary);">Выпускной (9-11 класс)</p>
            </div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <button onclick="openProfile()" class="btn-icon">⚙️ <span id="l-prof">Profil</span></button>
            <div class="lang-pills">
                <button onclick="setLang('az')" id="l-az" class="lang-btn">AZ</button>
                <button onclick="setLang('ru')" id="l-ru" class="lang-btn">RU</button>
                <button onclick="setLang('en')" id="l-en" class="lang-btn">EN</button>
            </div>
            <button onclick="toggleTheme()" class="btn-icon" id="th-icon">🌙</button>
        </div>
    </div>

    <div id="app" class="fade-in"></div>

    <div id="m-profile" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 2px;" id="m-title">Profil</h3>
            <p style="font-size: 11px; color: var(--text-tertiary); margin-bottom: 16px;" id="m-sub">Tənzimləmələr</p>
            <form onsubmit="saveProf(event)">
                <label style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-tertiary);" id="l-n">Ad</label>
                <input type="text" id="i-name" required maxlength="30" class="form-input">
                <label style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-tertiary);" id="l-g">Qrup</label>
                <select id="i-group" class="form-input" style="background: var(--surface);">
                    <option value="Выпускной (9-11 класс)">Buraxılış 9-11</option>
                    <option value="I Qrup">I Qrup</option><option value="II Qrup">II Qrup</option>
                    <option value="III Qrup">III Qrup</option><option value="IV Qrup">IV Qrup</option>
                </select>
                <label style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-tertiary);" id="l-s">Fənlər</label>
                <div id="sub-boxes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; margin-bottom: 16px; max-height: 150px; overflow-y: auto;"></div>
                <button type="submit" class="btn-primary" id="b-save">Yadda saxla</button>
            </form>
        </div>
    </div>

    <div id="m-choice" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 2px;" id="c-title">Mövzu</h3>
            <p style="font-size: 11px; color: var(--text-tertiary); margin-bottom: 12px;" id="l-ch">Fəaliyyət seçin:</p>
            <div class="choice-grid">
                <div class="choice-btn" onclick="goTheory()">
                    <span style="font-size: 22px;">📖</span>
                    <span style="font-size: 13px; font-weight: 800;" id="l-th">Nəzəriyyə</span>
                    <span style="font-size: 10px; color: var(--text-tertiary);" id="l-th-d">Düsturlar</span>
                </div>
                <div class="choice-btn" onclick="goTest()">
                    <span style="font-size: 22px;">📝</span>
                    <span style="font-size: 13px; font-weight: 800;" id="l-ts">Test</span>
                    <span style="font-size: 10px; color: var(--text-tertiary);" id="l-ts-d">10 Sual</span>
                </div>
            </div>
            <button onclick="document.getElementById('m-choice').classList.add('hidden')" class="btn-icon" style="width: 100%; margin-top: 14px; justify-content: center;">Bağla</button>
        </div>
    </div>

    <script>
        const i18n = {
            ru: { prof: "Профиль", title: "Карта подготовки DIM", sub: "25 тем по каждому из 10 предметов (250 тем)", all: "Все 25", min: "★ МИНИМУМ", done: "Пройденные", stest: "📝 Предметный тест (20)", ttest: "Мини-Тест (10)", mTitle: "Профиль студента", mSub: "Настройка профиля", lName: "Имя", lGroup: "Группа", lSubs: "Предметы", bSave: "Сохранить", back: "← Назад", lChoice: "Выберите действие:", lTh: "Теория", lThD: "Правила и формулы", lTs: "Тест", lTsD: "10 вопросов", secTh: "1. Теория", secRl: "2. Ключевые аспекты", toQuiz: "К тестам →" },
            az: { prof: "Profil", title: "DİM Hazırlıq Xəritəsi", sub: "Hər 10 fənn üzrə 25 mövzu (cəmi 250 mövzu)", all: "Bütün 25", min: "★ MİNİMUM", done: "Keçilmiş", stest: "📝 Fənn sınaq imtahanı (20)", ttest: "Mini-Test (10)", mTitle: "Tələbə profili", mSub: "Profil tənzimləmələri", lName: "Ad", lGroup: "Qrup", lSubs: "Fənlər", bSave: "Yadda saxla", back: "← Qayıt", lChoice: "Fəaliyyət seçin:", lTh: "Nəzəriyyə", lThD: "İzah və düsturlar", lTs: "Test", lTsD: "10 sual", secTh: "1. Nəzəri izah", secRl: "2. Əsas aspektlər", toQuiz: "Testlərə keç →" },
            en: { prof: "Profile", title: "DIM Exam Roadmap", sub: "25 core topics across 10 subjects (250 total)", all: "All 25", min: "★ MINIMUM", done: "Completed", stest: "📝 Full Subject Test (20)", ttest: "Mini-Quiz (10)", mTitle: "Student Profile", mSub: "Profile settings", lName: "Name", lGroup: "Group", lSubs: "Subjects", bSave: "Save", back: "← Back", lChoice: "Choose action:", lTh: "Theory", lThD: "Rules & formulas", lTs: "Test", lTsD: "10 questions", secTh: "1. Theory", secRl: "2. Key aspects", toQuiz: "Proceed to tests →" }
        };

        const subs = {
            mat: { icon: "📐", name: { ru: "Математика", az: "Riyaziyyat", en: "Mathematics" } },
            rus: { icon: "📝", name: { ru: "Русский язык", az: "Rus dili", en: "Russian Language" } },
            aze: { icon: "🇦🇿", name: { ru: "Азербайджанский язык", az: "Azərbaycan dili", en: "Azerbaijani Language" } },
            eng: { icon: "🇬🇧", name: { ru: "Английский язык", az: "İngilis dili", en: "English Language" } },
            lit: { icon: "📖", name: { ru: "Литература", az: "Ədəbiyyat", en: "Literature" } },
            whi: { icon: "⏳", name: { ru: "Всеобщая история", az: "Ümumi tarix", en: "World History" } },
            his: { icon: "🏛️", name: { ru: "История Азербайджана", az: "Azərbaycan tarixi", en: "History of Azerbaijan" } },
            geo: { icon: "🌍", name: { ru: "География", az: "Coğrafiya", en: "Geography" } },
            phy: { icon: "🧲", name: { ru: "Физика", az: "Fizika", en: "Physics" } },
            che: { icon: "🧪", name: { ru: "Химия", az: "Kimya", en: "Chemistry" } }
        };

        const emojis = ["🔢", "📊", "📐", "📈", "🧮", "✨", "🎯", "💡", "⚡", "🔬", "📚", "✏️", "🧩", "🌟", "⚙️", "🔎", "📌", "🏆", "🧠", "🔥", "🎓", "🚀", "🗺️", "🔑", "🏅"];
        
        let lang = localStorage.getItem('dim_l') || 'az',
            dark = localStorage.getItem('dim_t') !== 'light',
            prof = JSON.parse(localStorage.getItem('dim_p') || 'null'),
            prog = JSON.parse(localStorage.getItem('dim_prog') || '{}'),
            activeTab = 'mat', filter = 'all', view = 'roadmap', selId = null;

        const topics = {};
        Object.keys(subs).forEach(s => {
            topics[s] = Array.from({length: 25}, (_, i) => ({
                id: `${s}_${i+1}`,
                min: [0, 2, 4, 6, 8, 11, 13, 17, 19, 23].includes(i),
                title: { ru: `${i+1}. ${emojis[i%25]} Тема №${i+1} (${subs[s].name.ru})`, az: `${i+1}. ${emojis[i%25]} ${i+1}-ci mövzu (${subs[s].name.az})`, en: `${i+1}. ${emojis[i%25]} Topic #${i+1} (${subs[s].name.en})` },
                theory: { ru: `Официальный материал DIM по предмету "${subs[s].name.ru}", тема №${i+1}.`, az: `DİM standartına uyğun "${subs[s].name.az}" fənni üzrə ${i+1}-ci mövzu.`, en: `DIM guide for "${subs[s].name.en}" topic #${i+1}.` },
                quizzes: Array.from({length: 10}, (_, q) => ({
                    q: { ru: `${q+1}. Вопрос по теме №${i+1}`, az: `${q+1}. ${i+1}-ci mövzu üzrə sual`, en: `${q+1}. Question for topic #${i+1}` },
                    opts: [
                        { text: "Вариант A (Правильный / Düzgün)", correct: true },
                        { text: "Вариант B", correct: false },
                        { text: "Вариант C", correct: false },
                        { text: "Вариант D", correct: false }
                    ]
                }))
            }));
        });

        window.onload = () => {
            if(!prof) { prof = { name: "Tələbə", group: "Выпускной (9-11 класс)", subjects: ["mat","rus","lit","whi","aze","phy","che"] }; localStorage.setItem('dim_p', JSON.stringify(prof)); }
            applyTheme(); setLang(lang);
        };

        function applyTheme() {
            document.documentElement.className = dark ? '' : 'light';
            document.getElementById('th-icon').innerText = dark ? '☀️' : '🌙';
        }
        function toggleTheme() { dark = !dark; localStorage.setItem('dim_t', dark ? 'dark' : 'light'); applyTheme(); }
        
        function setLang(l) {
            lang = l; localStorage.setItem('dim_l', l);
            ['az','ru','en'].forEach(x => { const btn = document.getElementById('l-'+x); if(btn) btn.className = `lang-btn ${x===l?'active':''}`; });
            document.getElementById('l-prof').innerText = i18n[l].prof;
            document.getElementById('m-title').innerText = i18n[l].mTitle;
            document.getElementById('m-sub').innerText = i18n[l].mSub;
            document.getElementById('l-n').innerText = i18n[l].lName;
            document.getElementById('l-g').innerText = i18n[l].lGroup;
            document.getElementById('l-s').innerText = i18n[l].lSubs;
            document.getElementById('b-save').innerText = i18n[l].bSave;
            document.getElementById('l-ch').innerText = i18n[l].lChoice;
            document.getElementById('l-th').innerText = i18n[l].lTh;
            document.getElementById('l-th-d').innerText = i18n[l].lThD;
            document.getElementById('l-ts').innerText = i18n[l].lTs;
            document.getElementById('l-ts-d').innerText = i18n[l].lTsD;
            render();
        }

        function updateUI() {
            if(!prof) return;
            document.getElementById('u-name').innerText = prof.name;
            document.getElementById('u-group').innerText = prof.group;
            document.getElementById('avatar').innerText = (prof.name[0] || 'T').toUpperCase();
        }

        function openProfile() {
            updateUI();
            document.getElementById('m-profile').classList.remove('hidden');
            document.getElementById('i-name').value = prof.name;
            document.getElementById('i-group').value = prof.group;
            const c = document.getElementById('sub-boxes'); c.innerHTML = '';
            Object.keys(subs).forEach(k => {
                const checked = prof.subjects.includes(k) ? 'checked' : '';
                c.innerHTML += `<label style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;cursor:pointer;"><input type="checkbox" value="${k}" ${checked}> ${subs[k].icon} ${subs[k].name[lang]}</label>`;
            });
        }

        function saveProf(e) {
            e.preventDefault();
            const subsArr = [];
            document.querySelectorAll('#sub-boxes input:checked').forEach(i => subsArr.push(i.value));
            if(!subsArr.length) return alert("Выберите предмет!");
            prof = { name: document.getElementById('i-name').value.trim(), group: document.getElementById('i-group').value, subjects: subsArr };
            localStorage.setItem('dim_p', JSON.stringify(prof));
            document.getElementById('m-profile').classList.add('hidden');
            updateUI(); if(!subsArr.includes(activeTab)) activeTab = subsArr[0];
            render();
        }

        function openChoice(id) { selId = id; document.getElementById('m-choice').classList.remove('hidden'); }
        function goTheory() { document.getElementById('m-choice').classList.add('hidden'); view = 'theory'; window.scrollTo(0,0); render(); }
        function goTest() { document.getElementById('m-choice').classList.add('hidden'); view = 'test'; window.scrollTo(0,0); render(); }

        function findTopic() {
            let res = null;
            Object.keys(topics).forEach(s => { const t = topics[s].find(x => x.id === selId); if(t) res = t; });
            return res;
        }

        function selectOpt(el, correct) {
            const opts = el.parentElement.querySelectorAll('.mobbin-opt');
            opts.forEach(o => o.style.pointerEvents = 'none');
            el.classList.add(correct ? 'correct' : 'wrong');
        }

        function toggleProgress(id) {
            prog[id] = !prog[id];
            localStorage.setItem('dim_prog', JSON.stringify(prog));
            render();
        }

        function render() {
            const app = document.getElementById('app'), t = i18n[lang];
            updateUI();

            if(view === 'theory' && selId) {
                const top = findTopic();
                app.innerHTML = `
                    <button onclick="view='roadmap';render();" class="btn-icon" style="margin-bottom:14px;">${t.back}</button>
                    <div class="artifact-card fade-in">
                        <h2 style="font-size:22px; font-weight:800; margin-bottom:16px;">${top.title[lang]}</h2>
                        <div class="quiz-card"><h4 style="font-size:13px; font-weight:700; color:var(--accent); margin-bottom:6px;">${t.secTh}</h4><p style="font-size:13px; color:var(--text-secondary); line-height:1.6;">${top.theory[lang]}</p></div>
                        <div class="quiz-card"><h4 style="font-size:13px; font-weight:700; color:var(--accent); margin-bottom:6px;">${t.secRl}</h4><code style="display:block; background:var(--surface); padding:12px; border-radius:10px; color:var(--accent-amber); font-size:12px;">DIM Standard Formula / Core Rule</code></div>
                        <button onclick="goTest()" class="btn-primary" style="margin-top:12px;">${t.toQuiz}</button>
                    </div>`;
                return;
            }

            if(view === 'test' && selId) {
                const top = findTopic();
                app.innerHTML = `
                    <button onclick="view='roadmap';render();" class="btn-icon" style="margin-bottom:14px;">${t.back}</button>
                    <div class="artifact-card fade-in">
                        <h2 style="font-size:22px; font-weight:800; margin-bottom:4px;">${top.title[lang]}</h2>
                        <p style="font-size:12px; color:var(--text-tertiary); margin-bottom:16px;">${t.ttest}</p>
                        ${top.quizzes.map((q, qi) => `
                            <div class="quiz-card fade-in" style="animation-delay: ${qi * 0.03}s;">
                                <div style="font-size:13px; font-weight:700; margin-bottom:12px;">${q.q[lang]}</div>
                                ${q.opts.map(o => `<div class="mobbin-opt" onclick="selectOpt(this, ${o.correct})"><span>${o.text}</span></div>`).join('')}
                            </div>
                        `).join('')}
                    </div>`;
                return;
            }

            if(view === 'sub_test') {
                app.innerHTML = `
                    <button onclick="view='roadmap';render();" class="btn-icon" style="margin-bottom:14px;">${t.back}</button>
                    <div class="artifact-card fade-in">
                        <h2 style="font-size:22px; font-weight:800; margin-bottom:16px;">${t.stest} (${subs[activeTab].name[lang]})</h2>
                        ${Array.from({length:20}, (_, qi) => `
                            <div class="quiz-card fade-in" style="animation-delay: ${qi * 0.02}s;">
                                <div style="font-size:13px; font-weight:700; margin-bottom:10px;">Sual ${qi+1}: DİM Standart</div>
                                ${["Variant A", "Variant B", "Variant C", "Variant D"].map((o, oi) => `<div class="mobbin-opt" onclick="selectOpt(this, ${oi===0})"><span>${o}</span></div>`).join('')}
                            </div>
                        `).join('')}
                    </div>`;
                return;
            }

            const subsList = prof ? prof.subjects : Object.keys(subs);
            if(!subsList.includes(activeTab)) activeTab = subsList[0];
            let total = 0, done = 0;
            subsList.forEach(s => topics[s].forEach(x => { total++; if(prog[x.id]) done++; }));
            const pct = total ? Math.round((done/total)*100) : 0;

            app.innerHTML = `
                <div class="hero-banner fade-in">
                    <h1 class="hero-title">${t.title}</h1>
                    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">${t.sub}</p>
                    <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; margin-bottom:6px;">
                        <span>Ümumi tərəqqi</span><span>${done} / ${total} (${pct}%)</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                </div>

                <div class="tabs-wrapper">
                    ${subsList.map(s => `<div onclick="activeTab='${s}';render();" class="tab-chip ${activeTab===s?'active':''}"><span>${subs[s].icon}</span><span>${subs[s].name[lang]}</span></div>`).join('')}
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:8px;">
                    <div style="display:flex; gap:6px;">
                        <button onclick="filter='all';render();" class="btn-icon ${filter==='all'?'active':''}">${t.all}</button>
                        <button onclick="filter='min';render();" class="btn-icon ${filter==='min'?'active':''}">${t.min}</button>
                        <button onclick="filter='done';render();" class="btn-icon ${filter==='done'?'active':''}">${t.done}</button>
                    </div>
                    <button onclick="view='sub_test';render();" class="btn-icon" style="background:var(--accent); color:#fff; border:none; box-shadow:0 6px 18px var(--accent-glow);">${t.stest}</button>
                </div>

                <div>
                    ${topics[activeTab].map((tp, idx) => {
                        const isDone = !!prog[tp.id];
                        if(filter==='min' && !tp.min) return '';
                        if(filter==='done' && !isDone) return '';
                        return `
                            <div class="topic-row ${isDone?'completed':''} fade-in" style="animation-delay: ${Math.min(idx * 0.02, 0.4)}s;" onclick="openChoice('${tp.id}')">
                                <div style="display:flex; align-items:center; gap:12px;">
                                    <input type="checkbox" ${isDone?'checked':''} onclick="event.stopPropagation(); toggleProgress('${tp.id}');" style="width:20px; height:20px; accent-color:var(--accent); cursor:pointer;">
                                    <div>
                                        ${tp.min?'<span class="topic-badge">★ MİNİMUM</span><br>':''}
                                        <h4 style="font-size:13px; font-weight:700;">${tp.title[lang]}</h4>
                                    </div>
                                </div>
                                <span style="color:var(--text-tertiary); font-size:11px; font-weight:600;">Açmaq →</span>
                            </div>`;
                    }).join('')}
                </div>`;
        }
    </script>
</body>
</html>
