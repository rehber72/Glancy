)`,ru:`18. Фразовые глаголы (Phrasal Verbs)`,en:`18. Phrasal Verbs`},{az:`19. Söz yaradıcılığı: prefiks və suffikslər`,ru:`19. Словообразование: приставки и суффиксы`,en:`19. Word Formation: Prefixes and Suffixes`},{az:`20. Əsas bağlayıcılar və bağlayıcı sözlər (Linking Words)`,ru:`20. Соединительные слова (Linking Words)`,en:`20. Conjunctions and Discourse Markers`},{az:`21. Qısa cavablar və təsdiq/inkar uzlaşması (So do I / Neither do I)`,ru:`21. Краткие ответы (So do I / Neither do I)`,en:`21. Agreement: So do I / Neither do I`},{az:`22. Mətni oxuyub-anlama strategiyaları (Reading Comprehension)`,ru:`22. Стратегии чтения текста (Reading Comprehension)`,en:`22. Reading Comprehension Strategies`},{az:`23. Qapalı və açıq tipli test texnikaları`,ru:`23. Техники выполнения тестовых заданий DİM`,en:`23. Test-taking Techniques for DIM`},{az:`24. Yazı qaydaları: Esse və Məktub tərtibatı`,ru:`24. Правила письма: эссе и письмо`,en:`24. Writing Skills: Essay and Letter`},{az:`25. İdiomlar və situativ lüğət ehtiyatı`,ru:`25. Идиомы и тематический вокабуляр`,en:`25. Idioms and Essential Vocabulary`}],theories:[{az:`Present Simple təkrarlanan vərdişlər və həqiqətlər üçün istifadə olunur (He works every day). Üçüncü şəxsdə feilə -s/-es əlavə olunur. Present Continuous isə danışıq anında baş verən prosesləri bildirir (am/is/are + V-ing). Hissiyyat bildirən stativ feillər (love, know, understand, believe) Continuous zamanlarda işlədilmir.`,ru:`Present Simple используется для регулярных действий и фактов (He works every day). В 3-м лице ед. ч. глагол получает -s/-es. Present Continuous выражает действие прямо сейчас (am/is/are + V-ing). Глаголы состояния (know, love, understand) в Continuous не употребляются.`,en:`Present Simple expresses habitual actions and facts (He works every day), adding -s/-es for 3rd person singular. Present Continuous describes ongoing actions at speech time (am/is/are + V-ing). Stative verbs (know, want, remember) do not take continuous aspect.`}],rules:[[`Present Simple: S + V / V-s | Do/Does + S + V?`,`Present Continuous: am/is/are + V-ing`,`Stative verbs do NOT take -ing (know, believe, love)`],[`Past Simple: S + V-ed / V2 | Did + S + V?`,`Past Continuous: was/were + V-ing`,`while + Past Continuous | when + Past Simple`],[`will + V (spontaneous decision/prediction)`,`be going to + V (prior plan/evidence)`,`Present Continuous for fixed arrangements`],[`Present Perfect: have/has + V3`,`since + point in time | for + duration`,`already, yet, just, ever, never`],[`a/an with singular countable nouns first mentioned`,`the with unique or specific nouns`,`No article with plural generalizations & most countries`]]}),he(`his`,ie),he(`whi`,ce),he(`geo`,le),he(`phy`,ae),he(`che`,oe),he(`bio`,x),he(`inf`,se),he(`lit`,ue),he(`rus`,de),he(`fra`,fe),he(`deu`,pe);var ge=[{id:`mat_q1`,subjectId:`mat`,topicId:`mat_1`,question:{az:`350 ədədinin 20%-ni tapın.`,ru:`Найдите 20% от числа 350.`,en:`Find 20% of 350.`},options:[{text:`60`,correct:!1},{text:`70`,correct:!0},{text:`75`,correct:!1},{text:`80`,correct:!1}],explanation:{az:`350 · (20 / 100) = 350 · 0.2 = 70.`,ru:`350 · (20 / 100) = 350 · 0,2 = 70.`,en:`350 · (20 / 100) = 350 · 0.2 = 70.`}},{id:`mat_q2`,subjectId:`mat`,topicId:`mat_1`,question:{az:`Malın qiyməti 80 manatdan 25% artırıldı. Yeni qiymət neçə manat oldu?`,ru:`Цена товара 80 манатов повысилась на 25%. Какова новая цена?`,en:`The price of an 80 AZN item increased by 25%. What is the new price?`},options:[{text:`95`,correct:!1},{text:`100`,correct:!0},{text:`105`,correct:!1},{text:`110`,correct:!1}],explanation:{az:`80 · (1 + 0.25) = 80 · 1.25 = 100 manat.`,ru:`80 · (1 + 0,25) = 80 · 1,25 = 100 манатов.`,en:`80 · (1 + 0.25) = 80 · 1.25 = 100 AZN.`}},{id:`mat_q3`,subjectId:`mat`,topicId:`mat_1`,question:{az:`Ədəd 20% azaldıqdan sonra 64 oldu. Əvvəlki ədədi tapın.`,ru:`После уменьшения на 20% число стало равным 64. Найдите исходное число.`,en:`After a 20% decrease, a number became 64. Find the original number.`},options:[{text:`76.8`,correct:!1},{text:`80`,correct:!0},{text:`84`,correct:!1},{text:`90`,correct:!1}],explanation:{az:`x · 0.8 = 64 ⇒ x = 64 / 0.8 = 80.`,ru:`x · 0,8 = 64 ⇒ x = 64 / 0,8 = 80.`,en:`x · 0.8 = 64 ⇒ x = 64 / 0.8 = 80.`}},{id:`mat_q4`,subjectId:`mat`,topicId:`mat_2`,question:{az:`x² - 5x + 6 = 0 tənliyinin köklərini tapın.`,ru:`Найдите корни уравнения x² - 5x + 6 = 0.`,en:`Find the roots of the equation x² - 5x + 6 = 0.`},options:[{text:`2; 3`,correct:!0},{text:`-2; -3`,correct:!1},{text:`1; 6`,correct:!1},{text:`-1; 6`,correct:!1}],explanation:{az:`Viyet teoreminə görə: x₁ + x₂ = 5, x₁ · x₂ = 6. Köklər: 2 və 3.`,ru:`По теореме Виета x₁ + x₂ = 5, x₁ · x₂ = 6. Корни: 2 и 3.`,en:`By Vieta theorem: x₁ + x₂ = 5, x₁ · x₂ = 6. The roots are 2 and 3.`}},{id:`mat_q5`,subjectId:`mat`,topicId:`mat_2`,question:{az:`2x² + 3x - 2 = 0 tənliyinin diskriminantını tapın.`,ru:`Найдите дискриминант уравнения 2x² + 3x - 2 = 0.`,en:`Find the discriminant of 2x² + 3x - 2 = 0.`},options:[{text:`25`,correct:!0},{text:`1`,correct:!1},{text:`-7`,correct:!1},{text:`17`,correct:!1}],explanation:{az:`D = b² - 4ac = 3² - 4 · 2 · (-2) = 9 + 16 = 25.`,ru:`D = b² - 4ac = 9 - 4 · 2 · (-2) = 9 + 16 = 25.`,en:`D = b² - 4ac = 9 - 4 · 2 · (-2) = 25.`}},{id:`mat_q6`,subjectId:`mat`,topicId:`mat_3`,question:{az:`Arifmetik silsilədə a₁ = 3, d = 4 olarsa, a₅-i tapın.`,ru:`В арифметической прогрессии a₁ = 3, d = 4. Найдите a₅.`,en:`In an arithmetic progression a₁ = 3, d = 4. Find a₅.`},options:[{text:`19`,correct:!0},{text:`17`,correct:!1},{text:`23`,correct:!1},{text:`15`,correct:!1}],explanation:{az:`a₅ = a₁ + 4d = 3 + 4 · 4 = 19.`,ru:`a₅ = a₁ + 4d = 3 + 4 · 4 = 19.`,en:`a₅ = a₁ + 4d = 3 + 16 = 19.`}},{id:`mat_q7`,subjectId:`mat`,topicId:`mat_4`,question:{az:`3x - 7 = 11 tənliyini həll edin.`,ru:`Решите уравнение 3x - 7 = 11.`,en:`Solve the equation 3x - 7 = 11.`},options:[{text:`6`,correct:!0},{text:`4`,correct:!1},{text:`8`,correct:!1},{text:`18`,correct:!1}],explanation:{az:`3x = 11 + 7 = 18 ⇒ x = 6.`,ru:`3x = 18 ⇒ x = 6.`,en:`3x = 18 ⇒ x = 6.`}},{id:`mat_q8`,subjectId:`mat`,topicId:`mat_8`,question:{az:`log₂ 32 ifadəsinin qiymətini hesablayın.`,ru:`Вычислите значение log₂ 32.`,en:`Evaluate log₂ 32.`},options:[{text:`5`,correct:!0},{text:`4`,correct:!1},{text:`6`,correct:!1},{text:`16`,correct:!1}],explanation:{az:`2⁵ = 32 olduğuna görə log₂ 32 = 5.`,ru:`Поскольку 2⁵ = 32, log₂ 32 = 5.`,en:`Since 2⁵ = 32, log₂ 32 = 5.`}},{id:`mat_q9`,subjectId:`mat`,topicId:`mat_16`,question:{az:`Düzbucaqlı üçbucağın katetləri 6 sm və 8 sm-dir. Hipotenuzun uzunluğunu tapın.`,ru:`Катеты прямоугольного треугольника равны 6 см и 8 см. Найдите гипотенузу.`,en:`The legs of a right triangle are 6 cm and 8 cm. Find the hypotenuse.`},options:[{text:`10 cm`,correct:!0},{text:`12 cm`,correct:!1},{text:`14 cm`,correct:!1},{text:`9 cm`,correct:!1}],explanation:{az:`Pifaqor teoremi: c = √(6² + 8²) = √(36 + 64) = √100 = 10 sm.`,ru:`Теорема Пифагора: c = √(36 + 64) = 10 см.`,en:`Pythagorean theorem: c = √(36 + 64) = 10 cm.`}},{id:`mat_q10`,subjectId:`mat`,topicId:`mat_25`,question:{az:`Qutuda 3 ağ və 7 qara kürəcik var. Təsadüfən çıxarılan bir kürəciyin ağ olması ehtimalını tapın.`,ru:`В коробке 3 белых и 7 черных шаров. Найдите вероятность того, что наугад вынутый шар окажется белым.`,en:`A box contains 3 white and 7 black balls. Find the probability of randomly drawing a white ball.`},options:[{text:`0.3`,correct:!0},{text:`0.7`,correct:!1},{text:`0.35`,correct:!1},{text:`0.5`,correct:!1}],explanation:{az:`P = əlverişli hallar / bütün hallar = 3 / (3 + 7) = 3/10 = 0.3.`,ru:`P = m / n = 3 / (3 + 7) = 3/10 = 0,3.`,en:`P = favorable / total = 3 / 10 = 0.3.`}},{id:`dht_q1`,subjectId:`dht`,topicId:`dht_1`,question:{az:`Azərbaycan Respublikası Silahlı Qüvvələrinin Ali Baş Komandanı kimdir?`,ru:`Кто является Верховным Главнокомандующим Вооруженными Силами Азербайджанской Республики?`,en:`Who is the Supreme Commander-in-Chief of the Armed Forces of Azerbaijan?`},options:[{text:`Azərbaycan Respublikasının Prezidenti`,correct:!0},{text:`Müdafiə Naziri`,correct:!1},{text:`Baş Qərargah Rəisi`,correct:!1},{text:`Milli Məclisin Sədri`,correct:!1}],explanation:{az:`Azərbaycan Respublikası Konstitusiyasına əsasən AR Prezidenti Silahlı Qüvvələrin Ali Baş Komandanıdır.`,ru:`Согласно Конституции АР, Президент является Верховным Главнокомандующим Вооруженными Силами.`,en:`According to the Constitution of Azerbaijan, the President is the Supreme Commander-in-Chief.`}},{id:`dht_q2`,subjectId:`dht`,topicId:`dht_5`,question:{az:`Kalaşnikov avtomatının (AK-74) darağının tutumu neçə patrondur?`,ru:`Какова емкость магазина автомата АК-74?`,en:`What is the magazine capacity of the AK-74 assault rifle?`},options:[{text:`30`,correct:!0},{text:`20`,correct:!1},{text:`45`,correct:!1},{text:`25`,correct:!1}],explanation:{az:`AK-74 avtomatının standart darağının tutumu 30 ədəd 5.45×39 mm-lik patrondur.`,ru:`Стандартный секторный магазин АК-74 вмещает 30 патронов калибра 5,45×39 мм.`,en:`Standard magazine capacity for the 5.45x39mm AK-74 is 30 rounds.`}},{id:`dht_q3`,subjectId:`dht`,topicId:`dht_8`,question:{az:`F-1 əl qumbarası hansı növ qumbaradır və qəlpələrinin yayılma radiusu nə qədərdir?`,ru:`К какому типу относится ручная граната Ф-1 и каков радиус разлета ее осколков?`,en:`What type is the F-1 hand grenade and what is its fragment dispersion radius?`},options:[{text:`Müdafiə qumbarası, 200 metrədək`,correct:!0},{text:`Hücum qumbarası, 25 metrədək`,correct:!1},{text:`Tank əleyhinə, 50 metrədək`,correct:!1},{text:`İşıq-səs qumbarası, 15 metrədək`,correct:!1}],explanation:{az:`F-1 müdafiə tipli qumbaradır, çünki qəlpələrinin dağılma radiusu (200 m) atış məsafəsindən çoxdur və sığınacaqdan atılmalıdır.`,ru:`Ф-1 — оборонительная граната с радиусом убойного действия осколков до 200 м.`,en:`F-1 is a defensive grenade with an effective fragment lethal radius of up to 200 meters.`}},{id:`dht_q4`,subjectId:`dht`,topicId:`dht_20`,question:{az:`Arterial qanaxma zamanı rezin turniket (jqut) necə və hara tətbiq edilir?`,ru:`Куда и как накладывается кровоостанавливающий жгут при артериальном кровотечении?`,en:`Where and how is a tourniquet applied during arterial bleeding?`},options:[{text:`Yaranın yuxarı tərəfinə (ürəyə yaxın), vaxt qeyd olunmaqla`,correct:!0},{text:`Birbaşa yaranın üzərinə`,correct:!1},{text:`Yaranın aşağı tərəfinə`,correct:!1},{text:`Bütün bədənə sarğı çəkməklə`,correct:!1}],explanation:{az:`Arterial qanda təzyiq yüksək olduğu üçün jqut yaranın 3-5 sm yuxarısına qoyulur və altına vaxt kağızı yazılır (yayda 1 saatdan, qışda 30 dəqiqədən çox saxlanmaz).`,ru:`Жгут накладывается выше места ранения (ближе к сердцу) с обязательной запиской со временем наложения.`,en:`A tourniquet is placed 3-5 cm above the wound (towards heart) with exact application time recorded.`}},{id:`dht_q5`,subjectId:`dht`,topicId:`dht_14`,question:{az:`Nüvə partlayışının hansı zədələyici amili elektron cihazları və rabitəni sıradan çıxarır?`,ru:`Какой поражающий фактор ядерного взрыва выводит из строя электронику и связь?`,en:`Which damaging factor of a nuclear explosion disables electronics and communication?`},options:[{text:`Elektromaqnit impulsu (EMİ)`,correct:!0},{text:`Zərbə dalğası`,correct:!1},{text:`İşıq şüalanması`,correct:!1},{text:`Nüfuzedici radiasiya`,correct:!1}],explanation:{az:`Elektromaqnit impulsu yüksək gərginlik dalğası yaradaraq elektrik şəbəkələrini və rabitə qurğularını yandırır.`,ru:`Электромагнитный импульс (ЭМИ) генерирует сильные наведенные токи, сжигающие электронику.`,en:`Electromagnetic pulse (EMP) creates high-voltage surges that destroy electrical and radio infrastructure.`}},{id:`dht_q6`,subjectId:`dht`,topicId:`dht_22`,question:{az:`Ürək-ağciyər reanimasiyası zamanı döş qəfəsinin sıxılması ilə süni nəfəs nisbəti neçədir?`,ru:`Каково стандартное соотношение компрессий грудной клетки и искусственных вдохов при СЛР?`,en:`What is the standard ratio of chest compressions to rescue breaths in CPR?`},options:[{text:`30 : 2`,correct:!0},{text:`15 : 1`,correct:!1},{text:`50 : 5`,correct:!1},{text:`10 : 2`,correct:!1}],explanation:{az:`Müasir beynəlxalq və hərbi ilkin yardım standartına görə nisbət 30:2-dir (dəqiqədə 100-120 sıxma tempi ilə).`,ru:`Стандарт сердечно-легочной реанимации для взрослых — 30 нажатий на грудину к 2 вдохам.`,en:`The standard CPR protocol for adults is 30 chest compressions followed by 2 rescue breaths.`}},{id:`aze_q1`,subjectId:`aze`,topicId:`aze_1`,question:{az:`Hansı bənddəki bütün saitlər incə və dodaqlanmayandır?`,ru:`В каком варианте все гласные являются мягкими (переднего ряда) и неогубленными?`,en:`In which option are all vowels front and unrounded?`},options:[{text:`e, ə, i`,correct:!0},{text:`a, ı, o`,correct:!1},{text:`ö, ü, e`,correct:!1},{text:`u, ü, i`,correct:!1}],explanation:{az:`İncə saitlər: e, ə, i, ö, ü. Onlardan dodaqlanmayanlar: e, ə, i.`,ru:`Мягкие неогубленные гласные в азербайджанском языке — это e, ə, i.`,en:`Front unrounded vowels in Azerbaijani are e, ə, i.`}},{id:`aze_q2`,subjectId:`aze`,topicId:`aze_2`,question:{az:`Hansı sözdə ahəng qanunu pozulmuşdur?`,ru:`В каком слове нарушен закон сингармонизма?`,en:`In which word is the vowel harmony broken?`},options:[{text:`kitabxana`,correct:!0},{text:`məktəblilər`,correct:!1},{text:`odunçular`,correct:!1},{text:`gözəllik`,correct:!1}],explanation:{az:`'kitabxana' sözündə həm incə (i), həm qalın (a) saitlər bir yerdə işləndiyi üçün ahəng qanunu pozulub.`,ru:`В слове "kitabxana" соседствуют мягкая "i" и твердая "a", нарушая закон гармонии гласных.`,en:`In "kitabxana", both front (i) and back (a) vowels co-occur, violating vowel harmony.`}},{id:`aze_q3`,subjectId:`aze`,topicId:`aze_9`,question:{az:`'Məktəbə' sözü ismin hansı halındadır və hansı suala cavab verir?`,ru:`В каком падеже стоит слово "Məktəbə" и на какой вопрос отвечает?`,en:`In which case is "Məktəbə" and what question does it answer?`},options:[{text:`Yönlük hal (haraya? nəyə?)`,correct:!0},{text:`Təsirlik hal (haranı? nəyi?)`,correct:!1},{text:`Yerlik hal (harada? nədə?)`,correct:!1},{text:`Çıxışlıq hal (haradan? nədən?)`,correct:!1}],explanation:{az:`-ə yönlük halın şəkilçisidir (haraya? məktəbə).`,ru:`Окончание -ə выражает дательный (направительный) падеж: haraya? (куда?).`,en:`-ə indicates dative case, answering "haraya?" (where to?).`}},{id:`eng_q1`,subjectId:`eng`,topicId:`eng_1`,question:{az:`Cümləni tamamlayın: She usually ___ to the gym on Mondays, but today she ___ at home.`,ru:`Заполните пропуски: She usually ___ to the gym on Mondays, but today she ___ at home.`,en:`Complete the sentence: She usually ___ to the gym on Mondays, but today she ___ at home.`},options:[{text:`goes / is staying`,correct:!0},{text:`is going / stays`,correct:!1},{text:`go / stay`,correct:!1},{text:`went / stayed`,correct:!1}],explanation:{az:`'usually' Present Simple (goes), 'today' isə hal-hazırdakı müvəqqəti vəziyyət olduğu üçün Present Continuous (is staying) tələb edir.`,ru:`'usually' указывает на регулярность (Present Simple: goes), а 'today' — на временное действие (Present Continuous: is staying).`,en:`'usually' signals routine (Present Simple: goes), whereas 'today' indicates a temporary state (Present Continuous: is staying).`}},{id:`eng_q2`,subjectId:`eng`,topicId:`eng_11`,question:{az:`Məchul növə (Passive Voice) çevirin: "Alexander Graham Bell invented the telephone in 1876."`,ru:`Преобразуйте в пассивный залог: "Alexander Graham Bell invented the telephone in 1876."`,en:`Convert to Passive Voice: "Alexander Graham Bell invented the telephone in 1876."`},options:[{text:`The telephone was invented by Alexander Graham Bell in 1876.`,correct:!0},{text:`The telephone is invented in 1876.`,correct:!1},{text:`The telephone had been invented by Bell.`,correct:!1},{text:`The telephone was being invented in 1876.`,correct:!1}],explanation:{az:`Past Simple məchul növü: was/were + V3 (was invented).`,ru:`Past Simple в пассиве образуется с помощью was/were + V3 (was invented).`,en:`Past Simple Passive form is was/were + V3 (was invented).`}},{id:`eng_q3`,subjectId:`eng`,topicId:`eng_12`,question:{az:`Cümləni tamamlayın: If I ___ enough time tomorrow, I ___ you with your project.`,ru:`Вставьте верные формы: If I ___ enough time tomorrow, I ___ you with your project.`,en:`Complete the sentence: If I ___ enough time tomorrow, I ___ you with your project.`},options:[{text:`have / will help`,correct:!0},{text:`will have / help`,correct:!1},{text:`had / would help`,correct:!1},{text:`have / helped`,correct:!1}],explanation:{az:`First Conditional: If + Present Simple, will + V1.`,ru:`Первый тип условных предложений: в придаточном с if ставится Present Simple (have), в главном — will + глагол.`,en:`First Conditional structure: If + Present Simple (have), main clause with will + V1 (will help).`}},{id:`his_q1`,subjectId:`his`,topicId:`his_19`,question:{az:`Azərbaycan Xalq Cümhuriyyəti (AXC) nə vaxt və harada elan edilmişdir?`,ru:`Когда и где была провозглашена Азербайджанская Демократическая Республика (АДР)?`,en:`When and where was the Azerbaijan Democratic Republic (ADR) proclaimed?`},options:[{text:`28 may 1918-ci il, Tiflisdə`,correct:!0},{text:`18 oktyabr 1991-ci il, Bakıda`,correct:!1},{text:`15 sentyabr 1918-ci il, Gəncədə`,correct:!1},{text:`28 aprel 1920-ci il, Bakıda`,correct:!1}],explanation:{az:`AXC 1918-ci il mayın 28-də Tiflisdə Milli Şura tərəfindən "İstiqlal Bəyannaməsi" ilə elan olunmuşdur.`,ru:`АДР была провозглашена 28 мая 1918 года в Тифлисе Национальным советом Азербайджана принятием Декларации независимости.`,en:`The ADR was proclaimed on May 28, 1918, in Tiflis by the National Council through the Declaration of Independence.`}},{id:`his_q2`,subjectId:`his`,topicId:`his_24`,question:{az:`Şuşa şəhəri hansı tarixdə işğaldan azad edildi və həmin gün Zəfər Günü elan olundu?`,ru:`В какую дату город Шуша был освобожден от оккупации, объявленную Днем Победы?`,en:`On which date was the city of Shusha liberated, declared as Victory Day?`},options:[{text:`8 noyabr 2020`,correct:!0},{text:`27 sentyabr 2020`,correct:!1},{text:`10 noyabr 2020`,correct:!1},{text:`20 noyabr 2020`,correct:!1}],explanation:{az:`Müzəffər Azərbaycan Ordusu 2020-ci il 8 noyabrda Şuşa şəhərini azad etdi. Prezidentin sərəncamı ilə 8 Noyabr Zəfər Günü kimi təsis edildi.`,ru:`8 ноября 2020 года город Шуша был освобожден от оккупации. Эта дата установлена как День Победы.`,en:`On November 8, 2020, Shusha was liberated. This date is officially celebrated as Victory Day.`}},{id:`phy_q1`,subjectId:`phy`,topicId:`phy_15`,question:{az:`Dövrə hissəsində gərginlik 24 V, müqavimət 6 Om olarsa, cərəyan şiddətini hesablayın.`,ru:`Напряжение на участке цепи 24 В, сопротивление 6 Ом. Найдите силу тока.`,en:`The voltage across a circuit section is 24 V, resistance is 6 Ω. Calculate the current.`},options:[{text:`4 A`,correct:!0},{text:`144 A`,correct:!1},{text:`0.25 A`,correct:!1},{text:`18 A`,correct:!1}],explanation:{az:`Om qanununa görə: I = U / R = 24 / 6 = 4 A.`,ru:`По закону Ома для участка цепи: I = U / R = 24 / 6 = 4 А.`,en:`According to Ohm's law: I = U / R = 24 / 6 = 4 A.`}},{id:`che_q1`,subjectId:`che`,topicId:`che_8`,question:{az:`Hansı reaksiya zamanı hidrogen qazı (H₂) ayrılır?`,ru:`В какой из следующих реакций выделяется газообразный водород (H₂)?`,en:`In which reaction is hydrogen gas (H₂) released?`},options:[{text:`Zn + 2HCl → ZnCl₂ + H₂↑`,correct:!0},{text:`CuO + 2HCl → CuCl₂ + H₂O`,correct:!1},{text:`NaOH + HCl → NaCl + H₂O`,correct:!1},{text:`CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O`,correct:!1}],explanation:{az:`Aktiv və orta aktiv metallar (Zn) turşularla qarşılıqlı təsirdə olduqda hidrogeni sıxışdırıb çıxarır.`,ru:`Цинк вытесняет водород из соляной кислоты: Zn + 2HCl → ZnCl₂ + H₂↑.`,en:`Zinc displaces hydrogen from hydrochloric acid: Zn + 2HCl → ZnCl₂ + H₂↑.`}},{id:`bio_q1`,subjectId:`bio`,topicId:`bio_5`,question:{az:`Bitki hüceyrəsində fotosintez prosesi hansı orqanoiddə baş verir?`,ru:`В каком органоиде растительной клетки протекает процесс фотосинтеза?`,en:`In which organelle of a plant cell does photosynthesis take place?`},options:[{text:`Xloroplastlarda`,correct:!0},{text:`Mitoxondrilərdə`,correct:!1},{text:`Ribosomlarda`,correct:!1},{text:`Lizosomlarda`,correct:!1}],explanation:{az:`Fotosintez xlorofil piqmentinə malik olan xloroplastlarda işıq enerjisinin kimyəvi rabitə enerjisinə çevrilməsi ilə gedir.`,ru:`Фотосинтез происходит в хлоропластах благодаря наличию хлорофилла.`,en:`Photosynthesis occurs in chloroplasts containing the green pigment chlorophyll.`}},{id:`inf_q1`,subjectId:`inf`,topicId:`inf_1`,question:{az:`İkilik say sistemindəki 1101₂ ədədini onluq say sisteminə çevirin.`,ru:`Переведите двоичное число 1101₂ в десятичную систему счисления.`,en:`Convert the binary number 1101₂ to decimal.`},options:[{text:`13`,correct:!0},{text:`11`,correct:!1},{text:`15`,correct:!1},{text:`9`,correct:!1}],explanation:{az:`1101₂ = 1·2³ + 1·2² + 0·2¹ + 1·2⁰ = 8 + 4 + 0 + 1 = 13.`,ru:`1·8 + 1·4 + 0·2 + 1·1 = 13.`,en:`1·8 + 1·4 + 0·2 + 1·1 = 13.`}},{id:`dht_q7`,subjectId:`dht`,topicId:`dht_5`,question:{az:`5.45 mm-lik Kalaşnikov avtomatının (AK-74) nişangah məsafəsi nə qədərdir?`,ru:`Какова прицельная дальность стрельбы автомата АК-74 калибра 5,45 мм?`,en:`What is the sighting range of the 5.45mm AK-74 assault rifle?`},options:[{text:`1000 m`,correct:!0},{text:`500 m`,correct:!1},{text:`1500 m`,correct:!1},{text:`800 m`,correct:!1}],explanation:{az:`AK-74 avtomatının tənzimlənən sektorlu nişangah cədvəli 1000 metr məsafəyə qədər nişan almağa imkan verir.`,ru:`Прицельная планка автомата АК-74 нарезана на дальность до 1000 метров.`,en:`The sighting range of the AK-74 is graduated up to 1000 meters.`}},{id:`dht_q8`,subjectId:`dht`,topicId:`dht_8`,question:{az:`F-1 əl qumbarasının qəlpələrinin təhlükəli dağılma radiusu neçə metrdir?`,ru:`Каков радиус убойного действия осколков оборонительной гранаты Ф-1?`,en:`What is the lethal fragmentation radius of the F-1 hand grenade?`},options:[{text:`≤ 200 m`,correct:!0},{text:`≤ 25 m`,correct:!1},{text:`≤ 50 m`,correct:!1},{text:`≤ 500 m`,correct:!1}],explanation:{az:`F-1 müdafiə qumbarasıdır, qəlpələri 200 metrə qədər uça bildiyi üçün yalnız səngər və ya sığınacaqdan atılmalıdır.`,ru:`Ф-1 — оборонительная граната, радиус разлета убойных осколков достигает 200 м, поэтому бросать ее разрешено только из укрытия.`,en:`F-1 is a defensive grenade with fragmentation radius up to 200m; it must be thrown strictly from cover.`}},{id:`dht_q9`,subjectId:`dht`,topicId:`dht_20`,question:{az:`Arterial qanaxma zamanı qankəsici jqut yaranın harasına qoyulur və yay aylarında maksimum neçə saat qala bilər?`,ru:`Куда накладывается кровоостанавливающий жгут при артериальном кровотечении и на какое время летом?`,en:`Where is a tourniquet applied during arterial bleeding and for how long in summer?`},options:[{text:`Yaranın yuxarısına (ürəyə tərəf), maksimum 1 saat`,correct:!0},{text:`Yaranın aşağısına, maksimum 2 saat`,correct:!1},{text:`Birbaşa yaranın üstünə, 30 dəqiqə`,correct:!1},{text:`Yaranın yuxarısına, 3 saat`,correct:!1}],explanation:{az:`Arterial qanaxmada qan ürəkdən toxumalara getdiyi üçün jqut yaranın yuxarısına qoyulur, toxuma ölməsin deyə yayda maksimum 1 saat, qışda 30-40 dəqiqə saxlanılır.`,ru:`При артериальном кровотечении жгут накладывается выше раны. Максимальное время наложения летом — не более 1 часа, зимой — 30-40 минут.`,en:`In arterial bleeding, tourniquet is placed proximal (above) the wound for a maximum of 1 hour in summer and 30-40 minutes in winter.`}},{id:`dht_q10`,subjectId:`dht`,topicId:`dht_22`,question:{az:`Böyüklərdə ürək-ağciyər reanimasiyası (ÜAR) apararkən döş qəfəsinin sıxılması ilə süni nəfəs vermə nisbəti necədir?`,ru:`Каково соотношение компрессий грудной клетки и вдохов при сердечно-легочной реанимации (СЛР) у взрослых?`,en:`What is the ratio of chest compressions to rescue breaths during adult CPR?`},options:[{text:`30 : 2`,correct:!0},{text:`15 : 1`,correct:!1},{text:`5 : 1`,correct:!1},{text:`50 : 5`,correct:!1}],explanation:{az:`Müasir beynəlxalq və hərbi ilk yardım standartlarına görə tək və ya cüt xilasedici üçün universal nisbət 30:2-dir.`,ru:`Согласно современному стандарту СЛР, соотношение составляет 30 надавливаний на грудину к 2 искусственным вдохам.`,en:`Standard resuscitation protocol specifies 30 chest compressions followed by 2 breaths.`}},{id:`geo_q1`,subjectId:`geo`,topicId:`geo_18`,question:{az:`Azərbaycan Respublikasının ən yüksək zirvəsi hansıdır və hündürlüyü neçə metrdir?`,ru:`Какая вершина является наивысшей точкой Азербайджанской Республики и какова ее высота?`,en:`What is the highest peak in the Republic of Azerbaijan and what is its elevation?`},options:[{text:`Bazardüzü zirvəsi (4466 m)`,correct:!0},{text:`Şahdağ zirvəsi (4243 m)`,correct:!1},{text:`Tufandağ zirvəsi (4191 m)`,correct:!1},{text:`Qapıcıq zirvəsi (3904 m)`,correct:!1}],explanation:{az:`Azərbaycanın ən yüksək nöqtəsi Baş Qafqaz silsiləsində yerləşən Bazardüzü dağıdır (4466 m).`,ru:`Высочайшей вершиной Азербайджана является гора Базардюзю (4466 м) на Главном Кавказском хребте.`,en:`Mount Bazarduzu (4466 m) on the Greater Caucasus range is the highest peak of Azerbaijan.`}},{id:`geo_q2`,subjectId:`geo`,topicId:`geo_1`,question:{az:`1:200 000 miqyaslı xəritədə iki məntəqə arasındakı məsafə 4 sm-dir. Həqiqi məsafə neçə kilometrdir?`,ru:`На карте масштаба 1:200 000 расстояние между городами 4 см. Каково реальное расстояние на местности?`,en:`On a 1:200,000 scale map, distance between two points is 4 cm. What is the actual distance in km?`},options:[{text:`8 km`,correct:!0},{text:`80 km`,correct:!1},{text:`0.8 km`,correct:!1},{text:`50 km`,correct:!1}],explanation:{az:`1:200 000 miqyasında 1 sm = 2 km deməkdir. 4 sm · 2 km = 8 km.`,ru:`В масштабе 1:200 000 в 1 см содержится 2 км. 4 · 2 = 8 км.`,en:`1:200,000 means 1 cm = 2 km. 4 cm · 2 km = 8 km.`}},{id:`geo_q3`,subjectId:`geo`,topicId:`geo_21`,question:{az:`Azərbaycanın ən böyük su anbarı hansıdır və hansı çay üzərində inşa edilmişdir?`,ru:`Какое водохранилище является крупнейшим в Азербайджане и на какой реке оно построено?`,en:`Which is the largest reservoir in Azerbaijan and on which river is it constructed?`},options:[{text:`Mingəçevir su anbarı, Kür çayı`,correct:!0},{text:`Şəmkir su anbarı, Kür çayı`,correct:!1},{text:`Araz su anbarı, Araz çayı`,correct:!1},{text:`Sərsəng su anbarı, Tərtərçay`,correct:!1}],explanation:{az:`Mingəçevir su anbarı ("Qafqaz dənizi") Kür çayı üzərində yerləşir və sahəsi 605 km²-dir.`,ru:`Мингечевирское водохранилище построено на реке Кура и является крупнейшим в Закавказье.`,en:`Mingachevir reservoir is situated on the Kura River, spanning 605 km².`}},{id:`lit_q1`,subjectId:`lit`,topicId:`lit_4`,question:{az:`Nizami Gəncəvinin "Xəmsə"sinə daxil olan ilk əsər hansıdır?`,ru:`Какое произведение является первой поэмой в "Хамсе" ("Пятерице") Низами Гянджеви?`,en:`Which work is the first poem in Nizami Ganjavi's "Khamsa" (Quintet)?`},options:[{text:`Sirlər xəzinəsi (Məxzənül-əsrar)`,correct:!0},{text:`Xosrov və Şirin`,correct:!1},{text:`Leyli və Məcnun`,correct:!1},{text:`Yeddi gözəl`,correct:!1}],explanation:{az:`Nizami "Xəmsə"sinin ilk əsəri 1174-1175-ci illərdə yazılmış "Sirlər xəzinəsi" fəlsəfi-didaktik poemasıdır.`,ru:`Первой поэмой "Хамсе" является дидактическая поэма "Сокровищница тайн" (ок. 1174 г.).`,en:`The opening poem of the Khamsa is the philosophical and didactic "Treasury of Mysteries" (ca. 1174).`}},{id:`lit_q2`,subjectId:`lit`,topicId:`lit_10`,question:{az:`Azərbaycan və Şərq dramaturgiyasının əsasını qoyan dramaturq kimdir?`,ru:`Кто является основоположником национальной драматургии в Азербайджане и на всем мусульманском Востоке?`,en:`Who founded national dramaturgy in Azerbaijan and the wider Muslim East?`},options:[{text:`Mirzə Fətəli Axundzadə`,correct:!0},{text:`Cəlil Məmmədquluzadə`,correct:!1},{text:`Nəcəf bəy Vəzirov`,correct:!1},{text:`Hüseyn Cavid`,correct:!1}],explanation:{az:`M.F.Axundzadə 1850-1855-ci illərdə yazdığı 6 komediya ilə Şərqdə dramaturgiyanın əsasını qoymuşdur.`,ru:`М.Ф.Ахундов написал 6 бессмертных комедий в 1850-1855 гг., заложив основы театрального искусства Востока.`,en:`M.F. Akhundzade authored six landmark comedies between 1850-1855, establishing dramaturgy across the East.`}},{id:`whi_q1`,subjectId:`whi`,topicId:`whi_10`,question:{az:`Konstantinopol şəhəri neçənci ildə Osmanlı sultanı II Mehmed tərəfindən fəth edilmişdir?`,ru:`В каком году Константинополь был взят османским султаном Мехмедом II Фатихом?`,en:`In which year was Constantinople conquered by Ottoman Sultan Mehmed II?`},options:[{text:`1453-cü il`,correct:!0},{text:`1389-cu il`,correct:!1},{text:`1517-ci il`,correct:!1},{text:`1492-ci il`,correct:!1}],explanation:{az:`29 may 1453-cü ildə Konstantinopol fəth edildi, Bizans imperiyası süqut etdi və şəhər İstanbul adlandırıldı.`,ru:`29 мая 1453 года пал Константинополь, что ознаменовало конец Византийской империи и Средневековья.`,en:`On May 29, 1453, Constantinople fell to Sultan Mehmed II, ending the Byzantine Empire.`}},{id:`whi_q2`,subjectId:`whi`,topicId:`whi_16`,question:{az:`Böyük Fransa burjua inqilabı hansı hadisə ilə başlanmışdır?`,ru:`С какого события началась Великая французская буржуазная революция?`,en:`Which historic event marked the beginning of the French Revolution?`},options:[{text:`14 iyul 1789-cu ildə Bastiliya qalasının alınması ilə`,correct:!0},{text:`Napoleon Bonapartın dövlət çevrilişi ilə`,correct:!1},{text:`Kral XVI Lüdovikin edam edilməsi ilə`,correct:!1},{text:`Vaterloo döyüşü ilə`,correct:!1}],explanation:{az:`1789-cu il iyulun 14-də xalq mütləqiyyət rəmzi olan Bastiliya qalasını ələ keçirdi.`,ru:`14 июля 1789 года восставшие парижане взяли штурмом крепость-тюрьму Бастилию.`,en:`On July 14, 1789, citizens stormed the Bastille fortress, initiating the revolution.`}},{id:`rus_q1`,subjectId:`rus`,topicId:`rus_9`,question:{az:`Hansı cərgədəki bütün feillər II təsriflənməyə (II спряжение) aiddir?`,ru:`В каком ряду все глаголы относятся ко II спряжению?`,en:`In which row do all verbs belong to the 2nd conjugation in Russian?`},options:[{text:`Дышать, видеть, строить`,correct:!0},{text:`Брить, стелить, читать`,correct:!1},{text:`Петь, писать, играть`,correct:!1},{text:`Знать, белеть, гулять`,correct:!1}],explanation:{az:`Строить (-ить), дышать və видеть (istisna olan 11 feildən) II təsrifə aiddir.`,ru:`Глаголы на -ить (строить), а также исключения видеть и дышать относятся ко II спряжению.`,en:`Verbs ending in -ить (строить) and exceptions (дышать, видеть) belong to the second conjugation.`}},{id:`fra_q1`,subjectId:`fra`,topicId:`fra_11`,question:{az:`Hansı cümlədə Passé composé zamanında köməkçi feil kimi "être" düzgün işlədilmişdir?`,ru:`В каком предложении вспомогательный глагол être в Passé composé употреблен верно?`,en:`In which sentence is the auxiliary verb "être" correctly used in Passé composé?`},options:[{text:`Elle est allée à Paris hier.`,correct:!0},{text:`Elle a allée à Paris hier.`,correct:!1},{text:`Elle est mangé une pomme.`,correct:!1},{text:`Elle a venue chez moi.`,correct:!1}],explanation:{az:`"Aller" hərəkət feli olduğu üçün Passé composé-də "être" köməkçi feli ilə işlənir və mübtəda ilə cinsdə/kəmiyyətdə uzlaşır (-e əlavə olunur).`,ru:`Глагол aller выражает движение и спрягается в Passé composé с être с согласованием в роде и числе (est allée).`,en:`The motion verb "aller" forms Passé composé with "être" and agrees with feminine subject (est allée).`}},{id:`deu_q1`,subjectId:`deu`,topicId:`deu_12`,question:{az:`Alman dilində hansı önlük hər zaman yalnız Dativ halını tələb edir?`,ru:`Какой предлог в немецком языке всегда требует после себя исключительно Dativ?`,en:`Which preposition in German always strictly requires the Dative case?`},options:[{text:`mit`,correct:!0},{text:`für`,correct:!1},{text:`durch`,correct:!1},{text:`ohne`,correct:!1}],explanation:{az:`"mit, nach, aus, zu, von, bei, seit" hər zaman yalnız Dativ tələb edir; für, durch, ohne isə Akkusativ tələb edir.`,ru:`Предлоги mit, nach, aus, zu, v   <script src="/_aistudio-iframe.js?v=1f94f900"></script><style>
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.select-text{overflow-wrap:anywhere}
@media (max-width:640px){
 /* header: one compact row, nothing can push icons out of the screen */
 header>div{height:56px!important;gap:6px!important;padding-left:10px!important;padding-right:10px!important}
 header>div>button{flex:0 1 auto;min-width:0;padding:2px!important}
 .dm-brand{font-size:14px!important}
 .dm-hd-r{gap:2px!important;min-width:0;flex:0 0 auto}
 .dm-hd-r>button{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;padding:0!important}
 .dm-hd-r>button>div:first-child{flex:0 0 auto}
 .dm-hd-r .dm-lang{flex:0 0 auto}
 .dm-hd-r .dm-lang button{padding:5px 5px!important;font-size:10px!important;min-width:24px}
 /* topic cards: title on top (full width), buttons underneath */
 .dm-card{flex-direction:column!important;align-items:stretch!important;gap:10px!important;padding:12px!important}
 .dm-card-main{padding-right:0!important;align-items:flex-start!important;gap:8px!important}
 .dm-card-main>button{flex:0 0 auto}
 .dm-card-main>button:nth-child(2){padding:4px!important}
 .dm-card-title{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35}
 .dm-card-main span{white-space:nowrap}
 .dm-card-act{width:100%;gap:8px!important}
 .dm-card-act button{flex:1 1 0;justify-content:center;white-space:nowrap;gap:5px!important;min-height:38px;padding:8px 6px!important;font-size:11.5px!important}
 .dm-card-act button span{display:inline!important}
 /* filter tabs and action buttons */
 .dm-seg{display:grid!important;grid-template-columns:1fr 1fr;width:100%}
 .dm-seg button{justify-content:center;white-space:nowrap;padding:9px 6px!important}
 .dm-acts{width:100%}
 .dm-acts button{flex:1 1 calc(50% - 8px);justify-content:center;text-align:center;min-height:40px}
 /* quiz */
 .dm-qnum{width:36px!important;height:36px!important}
 .max-w-3xl>div.rounded-2xl{padding:16px!important}
 .max-w-3xl button.text-left{padding:12px!important}
 /* theory top bar */
 .dm-tvbar{flex-wrap:wrap;justify-content:flex-end;gap:6px!important}
 .dm-tvbar button{padding:6px 10px!important}
}
@media (max-width:400px){ .dm-acts button{flex:1 1 100%} }
@media (max-width:420px){ .dm-brand{display:none!important} }
</style>
</head>
