tlamamış sursatlarla təhlükəsiz davranış`,ru:`19. Минная безопасность и неразорвавшиеся боеприпасы`,en:`19. Mine Safety and Explosive Ordnance Awareness`},{az:`20. İlk tibbi yardım: Qanaxmaların dayandırılması və jqut qoyulması`,ru:`20. Первая помощь: Остановка кровотечений и наложение жгута`,en:`20. First Aid: Bleeding Control and Tourniquet Application`},{az:`21. Sınıqlar, çıxıqlar və immobilizasiya (şin qoyma)`,ru:`21. Переломы, вывихи и транспортная иммобилизация (шины)`,en:`21. Fractures, Dislocations and Splint Immobilization`},{az:`22. Ürək-ağciyər reanimasiyası (Süni tənəffüs və qapalı ürək masajı)`,ru:`22. Сердечно-легочная реанимация (СЛР и искусственное дыхание)`,en:`22. Cardiopulmonary Resuscitation (CPR and Artificial Respiration)`},{az:`23. Termik, kimyəvi yanıqlar və donvurma zamanı ilk yardım`,ru:`23. Первая помощь при ожогах, обморожениях и тепловом ударе`,en:`23. First Aid for Burns, Frostbite and Heatstroke`},{az:`24. Şəxsi gigiyena, səhra sanitar tədbirləri və infeksiyalar`,ru:`24. Личная гигиена и полевая санитария, профилактика инфекций`,en:`24. Field Hygiene, Sanitation and Infection Prevention`},{az:`25. 44 günlük Vətən müharibəsi və Azərbaycan Ordusunun Zəfər yolu`,ru:`25. 44-дневная Отечественная война и Победоносный путь Армии`,en:`25. 44-Day Patriotic War and the Historic Victory of Azerbaijan`}],theories:[{az:`Azərbaycan Respublikasının Silahlı Qüvvələri Quru Qoşunları, Hərbi Hava Qüvvələri və Hərbi Dəniz Qüvvələrindən ibarətdir. AR Prezidenti Silahlı Qüvvələrin Ali Baş Komandanıdır. Əsas təyinatı dövlətin müstəqilliyini, suverenliyini, ərazi bütövlüyünü və sərhədlərini qorumaqdır.`,ru:`Вооруженные Силы Азербайджана включают Сухопутные войска, ВВС и ВМС. Президент является Верховным Главнокомандующим. Главное предназначение — защита независимости, суверенитета и территориальной целостности государства.`,en:`The Armed Forces of Azerbaijan comprise Land Forces, Air Force, and Navy. The President serves as Supreme Commander-in-Chief. Their mission is safeguarding national independence, sovereignty, and territorial integrity.`},{az:`Hərbi and hər bir əsgərin Vətənə və xalqa sədaqət andıdır. Hərbi hissəyə qəbul edilmiş gənc əsgər ilkin təlim kursunu başa vurduqdan sonra Dövlət Bayrağı önündə təntənəli şəkildə and içir. Andı pozmaq hərbi cinayətdir və qanunvericiliklə ciddi cəzalandırılır.`,ru:`Военная присяга — священный обет верности Родине. Принимается перед Государственным флагом после курса молодого бойца. Нарушение присяги преследуется по закону.`,en:`The Military Oath is a solemn pledge to the Homeland. Administered before the National Flag upon basic training completion. Violating the oath is a criminal offense.`},{az:`Hərbi rütbələr vəzifə səlahiyyətləri və xidmət müddətinə görə verilir. Heyətlər: Əsgər/matros, Çavuş (kiçik çavuş, çavuş, baş çavuş), Gizir/miçman, Kiçik zabitlər (leytenant, b.leytenant, kapitan), Baş zabitlər (mayor, polkovnik-leytenant, polkovnik), Ali zabitlər (generallar).`,ru:`Воинские звания отражают служебное положение и выслугу. Составы: солдаты, сержанты, прапорщики (гизиры), младшие офицеры (лейтенант, капитан), старшие офицеры (майор, подполковник, полковник), высшие офицеры (генералы).`,en:`Military ranks reflect responsibility and service: enlisted soldiers, NCOs (sergeants), warrant officers (gizirs), company-grade officers (lieutenants, captain), field officers (majors, colonels), and general officers.`},{az:`Sıra — hərbi qulluqçuların nizamnamə ilə müəyyən edilmiş qaydada yerləşməsidir. Elementləri: Cəbhə (üz tərəf), Cinahlar (sağ və sol uclar), Arxa tərəf, İnterval (cəbhə boyu məsafə), Distansiya (dərinlik üzrə məsafə). Əsas komandalar: Farağat, Azad, Düzlən.`,ru:`Строй — установленное уставом размещение военнослужащих. Элементы: фронт, фланги (правый/левый), тыл, интервал (по фронту), дистанция (в глубину). Команды: 'Смирно', 'Вольно', 'Равняйсь'.`,en:`Formation is organized military posture. Elements: front, flanks, rear, interval (lateral spacing), distance (depth). Core commands: 'Attention', 'At ease', 'Dress right'.`},{az:`5.45 mm-lik AK-74 fərdi atıcı silahdır. Güllənin başlanğıc sürəti 900 m/san, nişangah məsafəsi 1000 m, daraq tutumu 30 patron, kütləsi patronsuz 3.3 kq-dır. Lülə qutusu, çaxmaq çərçivəsi, çaxmaq, qaytarıcı mexanizm və qaz borucuğundan ibarətdir.`,ru:`5,45-мм АК-74 — индивидуальное автоматическое оружие. Начальная скорость 900 м/с, прицельная дальность 1000 м, емкость магазина 30 патронов, масса 3,3 кг. Состоит из ствола, затворной рамы, затвора, возвратного механизма и газовой трубки.`,en:`5.45mm AK-74 assault rifle: muzzle velocity 900 m/s, sighting range 1000m, 30-round magazine, 3.3 kg unloaded. Main components: receiver, bolt carrier with gas piston, bolt, return spring, and gas tube.`},{az:`AK-74-ün natamam sökülməsi ardıcıllığı: 1. Darağı ayırmaq və lülədə patron olmadığını yoxlamaq (nəzarət tətiyi); 2. Qələm qutusunu və şompulu çıxarmaq; 3. Lülə qutusunun qapağını ayırmaq; 4. Qaytarıcı mexanizmi çıxarmaq; 5. Çaxmaq çərçivəsini çaxmaqla birlikdə ayırmaq və çaxmağı çərçivədən çıxarmaq; 6. Qaz borucuğunu ayırmaq. Yığılma tərs ardıcıllıqla icra edilir.`,ru:`Порядок неполной разборки АК-74: 1. Отделить магазин, проверить патронник (контрольный спуск); 2. Извлечь пенал и шомпол; 3. Отделить крышку ствольной коробки; 4. Извлечь возвратный механизм; 5. Вынуть затворную раму с затвором, отделить затвор; 6. Снять газовую трубку. Сборка в обратном порядке.`,en:`AK-74 field stripping steps: 1. Remove magazine & clear chamber (safety dry fire); 2. Extract cleaning kit & cleaning rod; 3. Detach receiver cover; 4. Remove return mechanism; 5. Extract bolt carrier with bolt & separate bolt; 6. Remove gas tube. Reassembly proceeds in exact reverse.`},{az:`Atış zamanı trayektoriya güllənin havadakı uçuş xəttidir. Əsas nöqtələr: atış nöqtəsi, hədəf, görüş nöqtəsi, ən yüksək nöqtə. Nişan alarkən arpacıq novçanın tam mərkəzində və üst kənarları eyni səviyyədə olmalı, nəfəs yarı-nəfəsvermədə saxlanılaraq tətik aramla basılmalıdır.`,ru:`Траектория — линия полета пули. При прицеливании мушка должна находиться строго по центру прорези целика заподлицо с ее краями. Спуск нажимается плавно на полувыдохе.`,en:`Trajectory is bullet path in air. Aiming requires centering the front post inside the rear notch flush with its edges. Squeeze the trigger smoothly on half-exhale.`},{az:`F-1 müdafiə qumbarasıdır (çəkisi 600 q, qəlpələrin dağılma radiusu 200 m, yalnız səngərdən atılır). RQD-5 hücum qumbarasıdır (radiusu 25 m, hərəkətdə atıla bilər). UZRQM alışdırıcısının partlama ləngiməsi 3.2 – 4.2 saniyədir.`,ru:`Ф-1 — оборонительная граната (осколки до 200 м, бросается из укрытия). РГД-5 — наступательная (радиус 25 м). Время замедления запала УЗРГМ: 3,2 – 4,2 секунды.`,en:`F-1 is defensive (fragmentation radius up to 200m, thrown only from cover). RGD-5 is offensive (radius 25m). UZRGM fuse delay is 3.2 - 4.2 seconds.`},{az:`Döyüş meydanında əsgər plastun sayağı (ən aşağı profil), yarı-diz üstə və yan üstə sürünür. Təbii çökəkliklərdən və maneələrdən istifadə edərək 3-5 saniyəlik qısa tirelərlə irəliləyir. Maskalanma üçün ərazinin rənginə uyğun bitki örtüyündən istifadə olunur.`,ru:`Способы переползания: по-пластунски, на получетвереньках и на боку. Передвижение короткими перебежками по 3-5 секунд с использованием складок местности. Маскировка под окружающий фон.`,en:`Crawling methods: low belly crawl (plastun), hands-and-knees, and side crawl. Advance via 3-5 second short rushes using natural micro-relief. Camouflage blends with natural foliage.`},{az:`Səmtləşmə üfüqün cəhətlərinin təyin edilməsidir. Kompasın qırmızı (və ya qaranlıqda fosforlu) əqrəbi daima Şimalı göstərir. Qütb ulduzu Kiçik Ayı bürcünün quyruğunda olub Şimalı dəqiq təyin edir. Ağacların qabığı və mamır şimalda daha rütubətli və sıxdır.`,ru:`Ориентирование — определение сторон горизонта. Стрелка компаса указывает на Север. Полярная звезда точно указывает на Север. Мох на деревьях гуще с северной стороны.`,en:`Navigation determines cardinal directions. Magnetic compass needle points North. Polaris (North Star) in Ursa Minor points true North. Tree moss grows denser on the shaded northern side.`},{az:`Hərbi topoqrafik xəritələr yer səthinin dəqiq qrafik təsviridir. Miqyas xəritədəki xəttin yer səthindəki həqiqi məsafəyə nisbətidir (1:50 000 — 1 sm-də 500 metr). Relyef qapalı əyri xətlər — horizontallarla (izohipslərlə) təsvir olunur.`,ru:`Топографическая карта — изображение местности. Масштаб 1:50 000 означает 500 м в 1 см. Рельеф изображается горизонталями (изогипсами). Бергштрихи показывают направление ската.`,en:`Topographic maps graphically depict terrain. Scale 1:50,000 equals 500m per 1cm. Relief is shown via elevation contour lines (isohypses). Bergstrichs indicate downhill slope direction.`},{az:`Azimut — şimal istiqaməti ilə müşahidə edilən obyekt arasındakı bucaqdır və saat əqrəbi istiqamətində 0°-dən 360°-dək ölçülür. Düz azimut ilə tərs azimut arasındakı fərq 180°-dir (A_tərs = A_düz ± 180°).`,ru:`Азимут — угол между направлением на север и на объект, измеряемый по ходу часовой стрелки от 0° до 360°. Обратный азимут отличается от прямого ровно на 180°.`,en:`Azimuth is the clockwise angle from North to the target line, ranging 0° to 360°. Back azimuth equals forward azimuth ± 180°.`},{az:`Mülki Müdafiə fövqəladə hallarda əhalinin, təsərrüfat obyektlərinin və ətraf mühitin qorunması sistemidir. Azərbaycan Respublikasında Fövqəladə Hallar Nazirliyi (FHN) tərəfindən idarə olunur. Əsas siqnal: 'Bütün diqqət!' sirenasından sonra radio/TV xəbərdarlıqlarıdır.`,ru:`Гражданская Оборона защищает население в чрезвычайных ситуациях. Управляется МЧС Азербайджана. Единый предупредительный сигнал: 'Внимание всем!' (вой сирен с последующим речевым сообщением).`,en:`Civil Defense protects populations during disasters and wartime. Supervised by the Ministry of Emergency Situations (MES). Universal warning siren is 'Attention to All!'.`},{az:`Nüvə silahının 5 əsas zədələyici amili: 1. Zərbə dalğası (dağıntıların 50%-i); 2. İşıq şüalanması (yanıqlar və yanğınlar, 35%); 3. Nüfuzedici radiasiya (qamma və neytron şüaları, 5%); 4. Radioaktiv çirklənmə (uzunmüddətli zəhərlənmə, 10%); 5. Elektromaqnit impulsu (rabitə və elektronikanın sıradan çıxması).`,ru:`5 поражающих факторов ядерного взрыва: Ударная волна (50%), Световое излучение (35%), Проникающая радиация (5%), Радиоактивное заражение (10%) и Электромагнитный импульс (ЭМИ).`,en:`5 nuclear blast factors: Shockwave (50%), Thermal radiation (35%), Penetrating radiation (5%), Radioactive fallout (10%), and Electromagnetic Pulse (EMP).`},{az:`Kimyəvi silahlar toksik zəhərləyici maddələrlə (ZM) təchiz olunur. Qruplar: Əsəb-iflicedici (zarin, zoman, V-qazlar), Dəri-iltihablandırıcı (iprit, lüizit), Ümumzəhərləyici (sianid turşusu), Boğucu (fosgen). Mühafizə: əleyhqaz və qoruyucu kostyum dərhal geyinilməlidir.`,ru:`Химическое оружие: нервно-паралитические (зарин, заман, V-газы), кожно-нарывные (иприт), общеядовитые (синильная кислота), удушающие (фосген). Защита: немедленное надевание противогаза и ОЗК.`,en:`Chemical agents: nerve (sarin, VX), blister (mustard gas), blood (hydrogen cyanide), and choking (phosgene). Protection mandates immediate donning of gas mask and chemical gear.`},{az:`Bioloji silahlar xəstəliktörədici mikroblar, bakteriyalar, viruslar və toksinlərdən (qarayara, vəba, tulyaremiya, taun) ibarətdir. İnfeksiya ocağında sərt Karantin (tam təcrid və silahlı mühafizə) və ya Observasiya (tibbi nəzarət) rejimi tətbiq edilir.`,ru:`Биологическое оружие использует возбудителей опасных инфекций (сибирская язва, чума, холера, токсины). В очаге поражения вводятся карантин (полная изоляция) или обсервация (медицинское наблюдение).`,en:`Biological weapons deploy deadly pathogens (anthrax, plague, cholera). Responses include strict Quarantine (cordon sanitaire) or Observation (medical monitoring).`},{az:`Fərdi mühafizə vasitələri (FMV): Tənəffüs orqanları üçün süzücü əleyhqazlar (GP-5, GP-7) və respiratorlar; Dəri üçün Ümumqoşun Qoruyucu Komplekti (ÜQK/OZK) və L-1 yüngül kostyumu. Əleyhqaz qutusu aktivləşdirilmiş kömür və aerozol süzgəcindən ibarətdir.`,ru:`Средства индивидуальной защиты: фильтрующие противогазы (ГП-5, ГП-7) защищают дыхание, глаза и лицо; ОЗК (плащ, чулки, перчатки) и костюм Л-1 защищают кожу от капель ОВ и радиоактивной пыли.`,en:`Personal protective equipment (PPE): filtering gas masks (GP-7) shield respiratory tracts and eyes; OZK cloak and L-1 suits shield skin from chemical splashes and radioactive dust.`},{az:`Kollektiv mühafizə qurğuları: Sığınacaqlar (tam hermetik, hava təmizləyici süzgəc-ventilyasiya qurğulu, nüvə zərbəsinə və kimyəvi qazlara dözümlü) və Radiasiya əleyhinə daldalanacaqlar (PXR). Şəhər metropoliteni güclü kütləvi sığınacaq rolunu oynayır.`,ru:`Убежища — герметичные защитные сооружения с фильтровентиляцией, выдерживающие ударную волну ядерного взрыва. Противорадиационные укрытия (ПРУ) защищают от ионизирующего излучения. Метрополитен служит укрытием.`,en:`Bomb shelters provide airtight survival with filtration-ventilation systems shielding from shockwaves and fallout. Radiation shelters attenuate gamma rays. Metro subway stations serve as mass bunkers.`},{az:`Mina təhlükəsizliyi: Piyada əleyhinə minalar (PMN basma tipli, OZM qəlpəli sıçrayan) və Tank əleyhinə minalar (TM-62). Qızıl qayda: Partlamamış sursat və ya mina gördükdə toxunmamaq, ətrafına xəbərdarlıq nişanı qoymaq, geri çəkilmək və dərhal 112 (FHN) və ya polisə məlumat vermək!`,ru:`Минная безопасность: противопехотные (ПМН, ОЗМ-72) и противотанковые (ТМ-62). Правило трех 'НЕ': НЕ подходить, НЕ трогать, НЕ обезвреживать самостоятельно. Обозначить место и звонить 112.`,en:`Mine safety: antipersonnel (PMN pressure, OZM bounding) and antitank mines (TM-62). Golden rule: Never touch or move ordnance; mark the perimeter, retreat via entry tracks, and report to 112.`},{az:`Arterial qanaxmada qan fışqırır və al-qırmızı rəngdə olur; jqut yaranın YUXARISINA (ürəyə yaxın) qoyulur və altına vaxt yazılmış qeyd qoyulur (yayda maks. 1 saat, qışda 30-40 dəqiqə). Venoz qanaxmada qan tünd albalı rəngdə aramla axır; sıxıcı steril sarğı kifayətdir.`,ru:`Артериальное кровотечение: алая кровь бьет пульсирующей струей. Жгут накладывается ВЫШЕ раны с запиской о времени (лето до 1 часа, зима 30-40 мин). Венозное кровотечение: темная кровь течет плавно, накладывается давящая повязка.`,en:`Arterial bleeding: bright red blood spurting pulsatile; tourniquet placed ABOVE wound with timestamp note (max 1h summer, 30-40m winter). Venous bleeding: dark crimson oozing steadily; pressure dressing applied.`},{az:`Sümük sınıqlarında əsas məqsəd daşıma zamanı zədələnmiş nahiyəni hərəkətsizləşdirməkdir (immobilizasiya). Qayda: sınıq nahiyəsinə qonşu olan ƏN AZI İKİ OYNAQ hərəkətsizləşdirilməlidir (bud sınığında 3 oynaq: çanaq-bud, diz, aşıq-baldır). Krammer və ya əlaltı vasitələrdən istifadə olunur.`,ru:`Транспортная иммобилизация при переломах: фиксируются минимум ДВА смежных сустава (при переломе бедра — три сустава: тазобедренный, коленный, голеностопный). Применяются шины Крамера или подручный материал.`,en:`Fracture immobilization mandates immobilizing AT LEAST TWO adjacent joints (femur fracture requires three: hip, knee, ankle) using Cramer wire splints or improvised rigid boards.`},{az:`Ürək-ağciyər reanimasiyası (ÜAR): Zərərçəkən sərt yerə arxası üstə uzadılır, tənəffüs yolları təmizlənir. Nisbət: 30 döş qəfəsi sıxması : 2 süni nəfəs. Sıxma dərinliyi böyüklərdə 5-6 sm, sıxma tezliyi dəqiqədə 100-120 dəfə olmalıdır.`,ru:`Сердечно-легочная реанимация (СЛР): жесткая поверхность, освобождение дыхательных путей. Универсальное соотношение: 30 компрессий грудной клетки к 2 вдохам. Частота 100-120 в минуту, глубина 5-6 см.`,en:`Cardiopulmonary Resuscitation (CPR): firm flat surface, open airway. Standard ratio: 30 chest compressions to 2 rescue breaths. Rate 100-120 per minute, compression depth 5-6 cm.`},{az:`Termik yanıqda dərhal soyuq axar su altında 15 dəqiqə soyudulmalıdır. Qovuqları deşmək, yağ və ya maz sürtmək qəti qadağandır! Quru steril sarğı qoyulur. Kimyəvi yanıqlarda reagent 20 dəqiqə bol axar su ilə yuyulur (yanmamış əhəng istisna olmaqla).`,ru:`При термических ожогах: охлаждать холодной водой 15 минут. Пузыри не вскрывать, мази и масло не наносить! Наложить сухую стерильную повязку. При химических ожогах смывать водой не менее 20 минут.`,en:`Thermal burns: cool under running tap water for 15 minutes. Never pop blisters or apply oil! Dress with dry sterile gauze. Chemical burns: irrigate with running water for 20 minutes.`},{az:`Səhra şəraitində şəxsi gigiyena epidemiyaların qarşısını alır. Su yalnız yoxlanılmış mənbələrdən, qaynadılaraq və ya xlorid həbləri (pantotsid) ilə təmizlənərək içilməlidir. Ayaq baxımı və quru corablar ordu marşlarında döyüş qabiliyyətinin qorunması üçün mütləqdir.`,ru:`Полевая гигиена: воду обеззараживают кипячением или таблетками пантоцида. Ежедневный уход за ногами и сухие портянки/носки предотвращают потерю боеспособности на марше.`,en:`Field sanitation: decontaminate water by boiling or purification tablets (pantocid). Daily foot hygiene and dry socks prevent trench foot and maintain march combat readiness.`},{az:`27 sentyabr 2020-ci ildə başlanan 44 günlük Vətən müharibəsi Azərbaycanın parlaq Qələbəsi ilə başa çatdı. Cəbrayıl, Füzuli, Zəngilan, Qubadlı və 8 noyabrda strateji Şuşa şəhəri azad edildi. 10 noyabr bəyanatı ilə Ermənistan kapitulyasiya etdi və Ağdam, Kəlbəcər, Laçın dinc yolla qaytarıldı.`,ru:`44-дневная Отечественная война (27 сентября – 10 ноября 2020 г.) завершилась исторической Победой Азербайджана. Освобождены Джебраил, Физули, Зангилан, Губадлы и Шуша (8 ноября). Агдам, Кельбаджар и Лачин возвращены мирным путем по заявлению от 10 ноября.`,en:`The 44-Day Patriotic War (Sep 27 – Nov 10, 2020) restored Azerbaijan's territorial integrity. Liberation of Jabrayil, Fuzuli, Zangilan, Gubadli, and Shusha (Nov 8) forced Armenia's capitulation.`}],rules:[[`Ali Baş Komandan: AR Prezidenti`,`3 Qoşun növü: Quru, Hərbi Hava, Hərbi Dəniz`,`Hərbi Doktrina: müdafiə xarakterli`],[`Hərbi and bir dəfə ömürlük qəbul edilir`,`Dövlət Bayrağı önündə təntənəli mərasim`,`Komandirin əmrinə sözsüz tabeçilik`],[`Zabit heyəti: Kiçik, Baş və Ali zabitlər`,`Gizirlər və Çavuşlar`,`Rütbələr poqonlarda ulduz və zolaqlarla əks olunur`],[`Cəbhə: sıranın ön tərəfi`,`Cinah: sağ və sol uclar`,`İnterval: cəbhə boyu məsafə; Distansiya: dərinlik məsafəsi`],[`Kalibr: 5.45 × 39 mm`,`Daraq: 30 patron`,`Nişangah məsafəsi: 1000 m`,`Güllənin başlanğıc sürəti: 900 m/s`],[`1. Darağı ayır, patronun olmadığını yoxla`,`2. Qələm qutusunu və şompulu çıxar`,`3. Qapağı, qaytarıcı mexanizmi, çaxmaq çərçivəsini ayır`],[`Arpacıq kəsiyin mərkəzində`,`Tətiyi nəfəs verərkən aramla sıxmaq`,`Hədəfin alt mərkəz kənarına tuşlama`],[`F-1: müdafiə, 200 m qəlpə radiusu (səngərdən)`,`RQD-5: hücum, 25 m radius (hərəkətdə)`,`Partlama ləngiməsi: 3.2 - 4.2 san`],[`Plastun üsulu ilə sürünmə (ən təhlükəsiz)`,`3-5 saniyəlik qısa tirelər`,`Ərazinin fonuna uyğun maskalanma`],[`Kompasın əqrəbi Şimala istiqamətlənir`,`Qütb ulduzu daima Şimaldadır`,`Ağac mamırı şimal tərəfdə daha sıxdır`],[`Xəritə miqyası: 1:50 000 (1 sm = 500 m)`,`Relyef horizontallarla göstərilir`,`Berqştrix: eniş istiqamətini göstərir`],[`Azimut: Şimaldan saat əqrəbi üzrə 0°-360° bucaq`,`A_tərs = A_düz ± 180°`,`Maneələri keçmə: kompas və addım sayımı`],[`Mülki Müdafiə: FHN-in rəhbərliyi altında`,`Həyəcan siqnalı: 'Bütün diqqət!'`,`Təxliyə planı və sığınacaqlara toplanma`],[`Nüvə partlayışının 5 amili`,`Zərbə dalğası (50%) və İşıq şüalanması (35%)`,`Radiasiya, Çirklənmə və Elektromaqnit impulsu`],[`Zarin, soman, VX (əsəb-iflicedici)`,`İprit, lüizit (dəri-iltihablandırıcı)`,`Əleyhqaz dərhal geyinilməlidir`],[`Bioloji təhlükə: vəba, qarayara, botulizm`,`Karantin: tam təcrid rejimi`,`Observasiya: gücləndirilmiş tibbi müşahidə`],[`GP-7: tənəffüs və gözləri qoruyur`,`OZK: plaş, çəkmə və əlcəklər`,`Qoruyucu süzgəcin hermetikliyi`],[`Sığınacaq: hava süzücü qurğulu hermetik bunker`,`PXR: radiasiya əleyhinə daldalanacaq`,`Metropoliten stansiyaları`],[`Piyada əleyhinə: PMN, OZM-72`,`Tank əleyhinə: TM-62`,`Toxunma, yerini nişanla, 112-yə xəbər ver`],[`Arterial: al-qırmızı fontan → Jqut yuxarıya qoyulur`,`Venoz: tünd qan axır → Sıxıcı sarğı`,`Jqut vaxtı: yayda 1 saat, qışda 30-40 dəqiqə`],[`Sınıqda ən azı 2 qonşu oynaq hərəkətsizləşdirilir`,`Bud sınığında 3 oynaq bağlanır`,`Kramer şini bədən relyefinə uyğun bükülür`],[`ÜAR nisbəti: 30 sıxma : 2 nəfəs`,`Sıxma tezliyi: 100-120 dəqiqədə`,`Dərinlik: böyüklərdə 5-6 sm`],[`Yanıqda: 15 dəqiqə soyuq su axını`,`Qovuqları deşmək qəti qadağandır`,`Quru steril sarğı sarınır`],[`Səhra gigiyenası: su qaynadılır və ya pantotsidlə təmizlənir`,`Ayaqların gündəlik baxımı`,`Dezinfeksiya qaydaları`],[`27 sentyabr - 10 noyabr 2020: 44 günlük Zəfər`,`8 Noyabr: Şuşanın azadlığı və Zəfər Günü`,`Ərazi bütövlüyü tam bərpa edildi`]]},ie={minTopicIndices:[0,2,4,6,8,10,13,16,18,20,23,24],titles:[{az:`1. İbtidai icma quruluşu və qədim insan düşərgələri (Azıx mağarası)`,ru:`1. Первобытнообщинный строй и древнейшие стоянки (Азыхская пещера)`,en:`1. Primitive Communal System and Ancient Camps (Azykh Cave)`},{az:`2. Qədim dövlət qurumları və Manna dövləti (İranzu, Ullusunu)`,ru:`2. Древнейшие государственные образования и государство Манна`,en:`2. Early State Formations and the Kingdom of Manna`},{az:`3. Midiya, Əhəmənilər və Makedoniyalı İsgəndərin yürüşü`,ru:`3. Мидия, держава Ахеменидов и походы Александра Македонского`,en:`3. Media, Achaemenid Empire and Alexander the Great`},{az:`4. Qədim Atropatena dövləti (Atropat, Antoninin yürüşü, Fraaspa)`,ru:`4. Древнее государство Атропатена (Атропат, Антоний, Фрааспа)`,en:`4. Ancient Atropatene State (Atropates, Antony's campaign)`},{az:`5. Qafqaz Albaniyası (Urmayr, Cavanşir və Dərbənd səddi)`,ru:`5. Кавказская Албания (Урнайр, Джаваншир и Дербентская стена)`,en:`5. Caucasian Albania (Urnayr, Javanshir and Derbent wall)`},{az:`6. Ərəb xilafəti dövründə Azərbaycan və Xürrəmilər hərəkatı (Babək)`,ru:`6. Азербайджан в составе Арабского халифата и движение Хуррамитов (Бабек)`,en:`6. Azerbaijan under Arab Caliphate and the Khurramite Movement (Babak)`},{az:`7. Feodal dövlətləri: Şirvanşahlar, Sacilər, Salarilər, Şəddadilər, Rəvvadilər`,ru:`7. Феодальные государства: Государство Ширваншахов, Саджиды, Салариды, Шеддадиды, Раввадиды`,en:`7. Feudal States: Shirvanshahs, Sajids, Salarids, Shaddadids, Rawwadids`},{az:`8. Böyük Səlcuq imperiyası və Eldəgizlər (Atabəylər) dövləti`,ru:`8. Государство Сельджуков и государство Ильдегизидов (Атабеков)`,en:`8. Great Seljuk Empire and the Eldiguzids (Atabegs) State`},{az:`9. Monqol yürüşləri və Hülakülər (Elxanilər) dövrü`,ru:`9. Монгольские нашествия и государство Хулагуидов (Ильханов)`,en:`9. Mongol Invasions and the Hulegu (Ilkhanate) Period`},{az:`10. Qaraqoyunlu və Ağqoyunlu dövlətləri (Uzun Həsən, Qanunnamə)`,ru:`10. Государства Каракоюнлу и Аккоюнлу (Узун Хасан, 'Гануннаме')`,en:`10. Qara Qoyunlu and Aq Qoyunlu States (Uzun Hasan, Code of Laws)`},{az:`11. Səfəvilər dövlətinin yaranması: Şah İsmayıl Xətai`,ru:`11. Образование государства Сефевидов: Шах Исмаил Хатаи`,en:`11. Establishment of the Safavid Empire: Shah Ismail Khatai`},{az:`12. Səfəvilər dövləti XVI-XVII əsrlərdə (Şah I Abbasın islahatları)`,ru:`12. Государство Сефевидов в XVI-XVII веках (Реформы Шаха Аббаса I)`,en:`12. Safavid Empire in the 16th-17th Centuries (Reforms of Shah Abbas I)`},{az:`13. Nadir şah Əfşar və Əfşarlar imperiyası`,ru:`13. Надир-шах Афшар и Афшарская империя`,en:`13. Nader Shah Afshar and the Afsharid Empire`},{az:`14. Azərbaycan xanlıqları dövrü (Qarabağ, Quba, Şəki, Bakı xanlıqları)`,ru:`14. Период азербайджанских ханств (Карабахское, Губинское, Шекинское, Бакинское)`,en:`14. Period of Azerbaijani Khanates (Karabakh, Guba, Shaki, Baku)`},{az:`15. Rusiya-Qacar müharibələri: Gülüstan (1813) və Türkmənçay (1828) müqavilələri`,ru:`15. Русско-иранские войны: Гюлистанский (1813) и Туркманчайск :`24. Restoration of Independence (1991) and 'Contract of the Century' (1994)`},{az:`25. 44 günlük Vətən müharibəsi (2020) və 2023-cü il antiterror tədbirləri`,ru:`25. 44-дневная Отечественная война (2020) и антитеррористические мероприятия 2023 г.`,en:`25. 44-Day Patriotic War (2020) and Complete Territorial Restoration`}],theories:[{az:`Azərbaycan ərazisində ən qədim insan düşərgəsi Füzuli rayonundakı Azıx mağarasıdır (Quruçay mədəniyyəti, 1.2 milyon il əvvəl). 1968-ci ildə arxeoloq Məmmədəli Hüseynov qədim insana ('Azıxantrop') məxsus alt çənə sümüyü aşkar etmişdir. Mezolit dövründə ox və kaman ixtira edilmiş, Qobustan qayaüstü təsvirləri yaranmışdır. Neolitdə istehsal təsərrüfatına keçid baş vermişdir ('neolit inqilabı').`,ru:`Азыхская пещера в Физулинском районе — древнейшая стоянка человека (Куручайская культура, 1,2 млн лет назад). В 1968 г. М.Гусейнов нашел нижнюю челюсть азыхантропа. В мезолите изобретены лук и стрелы (наскальные рисунки Гобустана). В неолите произошел переход к производящему хозяйству ('неолитическая революция').`,en:`Azykh Cave in Fuzuli is one of the earliest human settlements in Eurasia (Guruchay culture, 1.2 million years old). Discovered by M. Huseynov in 1968 with ancient jawbone ('Azykhanthropus'). Mesolithic saw bow and arrow invention and Gobustan petroglyphs; Neolithic brought farming transition.`},{az:`E.ə. IX əsrdə Urmiya gölü hövzəsində Manna dövləti yarandı (paytaxtı İzirtu). Hökmdar İranzunun dövründə mərkəzləşdirilmiş dövlətə çevrildi, canişinlik sistemi yaradıldı. Manna Assuriya ilə müttəfiqlik edərək Urartuya qarşı mübarizə apardı. Hökmdar Ullusununun dövründə Urartu ilə yaxınlaşma cəhdi olsa da, II Sarqonun e.ə. 714-cü il yürüşündən sonra Assuriya ilə ittifaq bərpa edildi.`,ru:`В IX в. до н.э. вокруг озера Урмия возникло государство Манна (столица Изирту). При царе Иранзу Манна стала централизованным государством с наместничествами. Опираясь на союз с Ассирией, боролась против Урарту. После похода Саргона II в 714 г. до н.э. союз с Ассирией укрепился.`,en:`In the 9th century BC, Manna emerged around Lake Urmia (capital Izirtu). King Iranzu centralized authority into provinces. Allied with Assyria to resist Urartu aggression, reaffirmed after Sargon II's campaign in 714 BC.`}],rules:[[`Paleolit: Alt (Quruçay), Orta (Mustye), Üst`,`Azıx mağarası: 1968, alt çənə sümüyü (M.Hüseynov)`,`Mezolit: ox və kaman, Qobustan petroqlifləri`,`Neolit: dulusçuluq, toxuculuq ('neolit inqilabı')`],[`Manna: paytaxt İzirtu (Urmiya hövzəsi)`,`Hökmdar İranzu: canişinlik sistemi, Assuriya ilə ittifaq`,`II Sarqonun e.ə. 714 yürüşü`,`E.ə. 590: Midiya tərəfindən süquta uğradıldı`],[`E.ə. 672: Midiya dövləti yarandı (Kaştariti)`,`E.ə. 550: II Kir Əhəmənilər dövlətini qurdu`,`E.ə. 331: Qavqamela döyüşü, Əhəmənilərin süqutu`],[`E.ə. 328: Atropatena dövlətinin yaranması (Atropat)`,`Paytaxtı: Qazaka`,`E.ə. 36: Fraaspa döyüşü (Antoni məğlub oldu)`],[`E.ə. IV - b.e. VIII əsr: Qafqaz Albaniyası`,`Paytaxtlar: Qəbələ, sonra Bərdə`,`Urmayr: xristianlığı qəbul etdi (313-cü il)`,`Cavanşir: ərəb və xəzərlərə qarşı diplomatiya`],[`642: Nəhavənd döyüşü, Ərəblərin gəlişi`,`705: Albaniya daxili müstəqilliyini itirdi`,`Xürrəmilər: 816-837 (Babək), Bəzz qalası`],[`Şirvanşahlar (861-1538): Məzyədilər, Kəsranilər, Dərbəndilər`,`Sacilər (889-930): Yusif ibn Əbu Sac Azərbaycanı birləşdirdi`,`Salarilər, Şəddadilər (Gəncə), Rəvvadilər (Təbriz)`],[`1066: Səlcuqların Şirvanşahları tabe etməsi`,`1136-1225: Atabəylər (Eldəgizlər) dövləti`,`Şəmsəddin Eldəgiz, Məhəmməd Cahan Pəhləvan, Qızıl Arslan`],[`1220: Monqolların ilk kəşfiyyat yürüşü`,`1256: Hülakülər (Elxanilər) dövləti (Təbriz, Marağa)`,`Qazan xanın islahatları (torpaq, vergi, pul, rabitə)`],[`1410-1468: Qaraqoyunlu (Qara Yusif)`,`1468-1501: Ağqoyunlu (Uzun Həsən, 'Qanunnamə')`,`1473: Malatya və Otluqbeli döyüşləri`],[`1501: Şərur döyüşü, Səfəvilər dövlətinin yaranması`,`Şah İsmayıl Xətai: Təbriz paytaxt elan edildi`,`1514: Çaldıran döyüşü`],[`Şah I Abbas: paytaxt İsfahana köçürüldü ies:[{az:`Hüceyrə həyatın elementar struktur və funksional vahididir. Prokariotlarda (bakteriyalarda) formalaşmış nüvə və membranlı orqanoidlər yoxdur. Eukariotlarda (bitki, heyvan, göbələk) nüvə, mitoxondri, endoplazmatik şəbəkə, Holci kompleksi, lizosom və ribosomlar mövcuddur. Bitki hüceyrəsində sellüloza qılaf, plastidlər və mərkəzi vakuol var.`,ru:`Клетка — основная единица жизни. У прокариот (бактерий) нет оформленного ядра и мембранных органоидов. Эукариоты имеют ядро, митохондрии, ЭПС, аппарат Гольджи, лизосомы и рибосомы. Растительная клетка имеет клеточную стенку из целлюлозы, пластиды и вакуоль.`,en:`Cell is fundamental unit of life. Prokaryotes lack membrane-bound nucleus. Eukaryotes feature nucleus, mitochondria (ATP powerhouses), endoplasmic reticulum, Golgi apparatus, lysosomes, and ribosomes. Plants have cellulose cell walls and chloroplasts.`}],rules:[[`Prokariot: bakteriya (nüvəsiz)`,`Eukariot: bitki, heyvan, göbələk (nüvəli)`,`Mitoxondri: ATF sintezi (tənəffüs)`,`Ribosom: zülal sintezi`],[`DNT: A = T, Q ≡ S (Çarqaff qaydası)`,`RNT: A, U, Q, S`,`Zülalın ilkin quruluşu: peptid rabitəsi`],[`Fotosintez: işıq (ATF, O₂) və qaranlıq (qlükoza C₆H₁₂O₆)`,`Qlükozanın parçalanması: qlikoliz (2 ATF) + oksigenli (36 ATF) = 38 ATF`],[`Mitoz: bədən hüceyrələri (2n → 2n, 4 faza: Profaza, Metafaza, Anafaza, Telofaza)`,`Meyoz: cinsi hüceyrələr (2n → 1n, krossinqover)`],[`I Qanun: Eynilik (100% Aa)`,`II Qanun: Parçalanma (3:1 fenotip, 1:2:1 genotip)`,`III Qanun: Müstəqil paylanma (9:3:3:1)`],[`Modifikasiya: irsi deyil (mühit amili)`,`Mutasiya: gen, xromosom və genom (irsi dəyişmə)`],[`Bakteriya: spor əlverişsiz mühitdə qorunmaq üçündür`,`Virus: qeyri-hüceyrəvi həyat forması (kapsid + nuklein turşusu)`],[`Göbələklər: mitseli və spora ilə çoxalma, qlikogen ehtiyatı, xitin divar`,`Şibyə: göbələk və yosunun simbiozu`],[`Kök zonaları: kök üsküyü, bölünmə, böyümə, sorucu (tüklər), ötürücü`,`İkiqat mayalanma: S.Q.Navaşin (spermilərdən biri yumurtahüceyrəni, digəri mərkəzi h ophy`},{az:`22. Xəlil Rza Ulutürk və Məmməd Araz: milli istiqlal poeziyası`,ru:`22. Халил Рза Улутюрк и Мамед Араз: поэзия независимости`,en:`22. Khalil Rza and Mammad Araz: Independence Poetry`},{az:`23. İsmayıl Şıxlı: 'Dəli Kür' romanı və milli xarakter`,ru:`23. Исмаил Шихлы: роман 'Буйная Кура' (Dəli Kür)`,en:`23. Ismail Shykhly: 'Deli Kur' (Turbulent Kura)`},{az:`24. Anar və Elçin: 60-cılar ədəbi nəsli və müasir hekayə`,ru:`24. Анар и Эльчин: поколение шестидесятников и проза`,en:`24. Anar and Elchin: The 60s Generation in Literature`},{az:`25. Ədəbiyyat nəzəriyyəsi: Vəznlər (Əruz, Heca, Sərbəst), bədii təsvir və ifadə vasitələri`,ru:`25. Теория литературы: стихосложение (Аруз, силлабика), тропы и фигуры`,en:`25. Literary Theory: Metres (Aruz, Syllabic, Free) and Tropes`}],theories:[{az:`Şifahi xalq ədəbiyyatı xalqın əsrlər boyu yaratdığı kollektiv sənətdir. Lirik (bayatı, layla, oxşama, mahnı), epik (nağıl, əfsanə, rəvayət, dastan, lətifə, atalar sözləri) və dramatik (oyunlar, meydan tamaşaları) növlərə bölünür. Bayatı 4 misradan ibarət olur, a-a-b-a qafiyələnir və 7 hecalı olur.`,ru:`Фольклор делится на лирические, эпические и драматические жанры. Баяты состоит из 4 строк по 7 слогов с рифмовкой a-a-b-a. В дастанах стихи чередуются с прозой.`,en:`Oral folklore encompasses lyrical, epic, and dramatic genres. Bayati comprises four 7-syllable lines rhyming a-a-b-a. Epics (dastans) alternate poetic stanzas with spoken prose.`}],rules:[[`Bayatı: 7 heca, 4 misra, aaba qafiyə quruluşu`,`Atalar sözləri hikmətli və nəsihətamiz xarakter daşıyır`],[`Dədə Qorqud: müqəddimə və 12 boydan ibarətdir`,`Drezden və Vatikan nüsxələri`,`Salur Qazan, Basat, Bamsı Beyrək`],[`Koroğlu: 24 qol`,`Ruhiyyə: ədalət, zülmə qarşı mübarizə, Çənlibel`,`Qırat, Dürrat, Misri qılınc`],[`Nizami 'Xəmsə': Sirlər xəzinəsi, Xosrov və Şirin, Leyli və Məcnun, Yeddi gözəl, İsgəndərnamə`,`Məsnəvi şəklində`],[`Nəsimi: Hürufizm təlimi, 'Məndə sığar iki cahan'`,`Fəlsəfi qəzəl janrının zirvəsi`],[`Şah İsmayıl Xətai: 'Dəhnamə' (10 məktub), anadilli divan`,`Heca vəznində gəraylı və qoşmalar`],[`Füzuli: 'Leyli və Məcnun' poeması (1536)`,`Bədii sual (istifham), təzad və mübaliğə ustası`],[`Vaqif: realizmin banisi`,`Qoşma və təcnislər, canlı danışıq dili`,`Qarabağ xanının vəziri`],[`Zakir: təmsil və mənzum hekayələr`,`Satira: rüşvətxor bəy və hakimlərin ifşası`],[`Axundzadə: milli dramaturgiyanın əsası (1850-1855, 6 komediya)`,`'Hacı Qara', 'Müsyö Jordan'`],[`Seyid Əzim: qəzəllər və nəsihətamiz mənzum hekayələr`,`Məktəb dərslikləri müəllifi`],[`Vəzirov: 'Müsibəti-Fəxrəddin' (ilk faciə)`,`Haqverdiyev: 'Dağılan tifaq', 'Bəxtsiz cavan'`],[`C.Məmmədquluzadə: 'Molla Nəsrəddin' jurnalı (1906)`,`'Ölülər', 'Anamın kitabı', 'Poçt qutusu'`],[`Sabir: 'Hophopnamə', ictimai satira`,`Təziyanə və satiralar`],[`Cavid: romantizmin nümayəndəsi, mənzum faciələr`,`'İblis', 'Şeyx Sənan', 'Topal Teymur'`],[`Şəhriyar: 'Heydərbabaya salam' (Təbriz, 1954)`,`Cənub həsrəti və ana dili sevgisi`],[`Əhməd Cavad: Dövlət Himnimizin sözləri, 'Çırpınırdı Qara dəniz'`,`Müşfiq: 'Yenə o bağ olaydı', 'Oxu, tar'`],[`S.Vurğun: 'Vaqif', 'Fərhad və Şirin' dramları`,`'Azərbaycan' şeiri`],[`Mirzə İbrahimov: 'Gələcək gün', 'Pərvanə'`,`Mehdi Hüseyn: 'Komissar', 'Səhər'`],[`İlyas Əfəndiyev: 'Mahnı dağlarda qaldı', 'Büllur sarayda'`,`Psixoloji teatr məktəbi`],[`B.Vahabzadə: 'Gülüstan' poeması (1959, ikiyə bölünmüş vətən)`,`'İstiqlal', 'Ana dili'`],[`Xəlil Rza: 'Davam edir 20 Yanvar', 'Məhbus gündəliyi'`,`M.Araz: 'Ayağa dur, Azərbaycan!'`],[`İsmayıl Şıxlı: 'Dəli Kür' (Cahandar ağa obrazı)`,`Realist nəsrin şah əsəri`],[`Anar: 'Beşmərtəbəli evin altıncı mərtəbəsi', 'Dədə Qorqud dünyası'`,`Elçin: 'Mahmud və Məryəm', 'Ölüm hökmü'`],[`Vəznlər: Heca (heca sayına görə), Əruz (uzun və qısa saitlər), Sərbəst`,`Metafora, epitet, təşbeh, metonimiya`]]},de={minTopicIndices:[0,1,3,5,8,10,13,16,18,20,22,24],titles:[{az:`1. Fonetika və orfoepiya: Samitlərin cingiltili/karlığı və vurğu`,ru:`1. Фонетика и орфоэпия: гласные, согласные и ударение`,en:`1. Phonetics and Orthoepy in Russian`},{az:`2. Morfemika və söz yaradıcılığı: Kök, prefiks, suffiks və sonluq`,ru:`2. Состав слова и словообразование`,en:`2. Morphemics and Word Formation`},{az:`3. Leksika və frazeologiya: Omonimlər, paronimlər və idiomlar`,ru:`3. Лексика и фразеология: паронимы и синонимы`,en:`3. Lexis and Phraseology: Paronyms and Idioms`},{az:`4. İsim (Существительное): Cins, kəmiyyət və 3 hallanma tipi`,ru:`4. Имя существительное: род, число и три склонения`,en:`4. Noun Gender, Number and 3 Declensions`},{az:`5. İsmin halları (Падежи) və hallanma sonluqlarının orfoqrafiyası`,ru:`5. Падежи и падежные окончания существительных`,en:`5. Cases and Case Endings of Nouns`},{az:`6. Sifət (Прилагательное): Keyfiyyət, nisbi və mənsubiyyət sifətləri`,ru:`6. Имя прилагательное: разряды и степени сравнения`,en:`6. Adjectives: Categories and Comparison`},{az:`7. Say (Числительное): Miqdar və sıra saylarının hallanması`,ru:`7. Имя числительное: склонение количественных и порядковых`,en:`7. Numerals and Declension Rules`},{az:`8. Əvəzlik (Местоимение): Məna növləri və yazılışı (-то, -либо, -нибудь)`,ru:`8. Местоимение: разряды и дефисное написание`,en:`8. Pronouns and Hyphenated Spelling`},{az:`9. Feil (Глагол): Növləri (təkmilləşmiş/təkmilləşməmiş) və 2 təsriflənmə qrupu`,ru:`9. Глагол: совершенный и несовершенный вид, спряжения`,en:`9. Verbs: Aspect (CB/HCB) and Conjugations`},{az:`10. Feil formaları: Feli sifət (Причастие) və feli bağlama (Деепричастие)`,ru:`10. Особые формы глагола: причастие и деепричастие`,en:`10. Participles and Verbal Adverbs (Gerunds)`},{az:`11. Zərf (Наречие): Məna növləri, dərəcələri və yazılışı (defis və birgə)`,ru:`11. Наречие: правописание через дефис, слитно и раздельно`,en:`11. Adverbs and Orthography Rules`},{az:`12. Köməkçi nitq hissələri: Önşəkilçilər (Предлоги), bağlayıcılar və ədatlar`,ru:`12. Служебные части речи: предлоги, союзы и частицы`,en:`12. Prepositions, Conjunctions and Particles`},{az:`13. НЕ və НИ əda ,en:`24. Direct and Reported Speech`},{az:`25. Mətn və nitq üslubları (Elmi, rəsmi, publisistik, bədii, danışıq)`,ru:`25. Текст и функциональные стили речи`,en:`25. Functional Styles of Speech and Text Analysis`}],theories:[{az:`Rus dilində 33 hərf, 42 səs var (10 sait hərf, 6 sait səs; 21 samit hərf). Saitlərin yazılışı vurğudan asılı olaraq dəyişir (o/a, e/i). Kar və cingiltili samitlər cütlüklər təşkil edir (б-п, в-ф, г-к, д-т, ж-ш, з-с). Söz sonunda cingiltili samit karlaşır (дуб → [дуп]).`,ru:`В русском алфавите 33 буквы, 42 звука (10 гласных букв, 6 гласных звуков; 21 согласная буква). Гласные буквы е, ё, ю, я обозначают два звука в начале слова, после гласных и после ь/ъ. Звонкие согласные на конце слова оглушаются.`,en:`Russian alphabet has 33 letters and 42 sounds. Vowel letters е, ё, ю, я represent two sounds initially, after vowels, or after soft/hard signs. Voiced consonants devoice word-finally.`}],rules:[[`Гласные после шипящих: жи-ши (и), ча-ща (а), чу-щу (у)`,`Оглушение звонких на конце`],[`Морфемы: приставка, корень, суффикс, окончание`,`Чередование гласных в корнях: лаг-лож, раст-рос, бер-бир`],[`Паронимы: адресат - адресант, одеть - надеть`,`Фразеологизмы не делятся`],[`1-е скл: м. и ж. род на -а/-я (земля, папа)`,`2-е скл: м.род с нул. и ср.род (стол, окно)`,`3-е скл: ж.род на ь (ночь, рожь)`],[`Именительный (кто? что?), Родительный (кого? чего?), Дательный (кому? чему?)`,`Винительный, Творительный, Предложный`],[`Качественные (есть краткая форма и степени)`,`Относительные (материал, место)`,`Притяжательные (чей? мамин)`],[`Количественные (пять, сорок)`,`Порядковые (пятый, сороковой)`,`Склонение: 50-80 и 500-900 склоняются обе части`],[`Суффиксы -то, -либо, -нибудь и приставка кое- пишутся через дефис`],[`I спряжение: -е-, -ут/-ют (брить, стелить)`,`II спряжение: -и-, -ат/-ят (все на -ить, кроме 2 исключений + 11 глаголов)`],[`Причастие: суффиксы -ущ-/-ющ-, -ащ-/-ящ-, -вш-, -нн-`,`Деепричастие: суффиксы -а/-я, -в, -вши, -вшись`],[`Наречия с приставкой по- и суффиксами -ому/-ему/-и пишутся через дефис`],[`Предлоги: в течение, в продолжение (на конце е)`,`Союзы: тоже, также, чтобы (слитно)`],[`НЕ с глаголами раздельно (кроме невзлюбить)`,`НЕ с причастиями раздельно при наличии зависимых слов`],[`Согласование: главное и зависимое в одном роде, числе, падеже`,`Управление: зависимое в определенном падеже`,`Примыкание: неизменяемое зависимое`],[`Тире между подлежащим и сказуемым при нулевой связке, если оба выражены сущ. в им. п.`],[`Определение (какой? чей?)`,`Дополнение (вопросы косвенных падежей)`,`Обстоятельство (где? когда? как?)`],[`Определенно-личное (1, 2 лицо)`,`Неопределенно-личное (3 лицо мн.ч.)`,`Безличное (нет подлежащего)`],[`Запятая между однородными членами при бессоюзии и противительных союзах (а, но)`],[`Обращения и вводные слова (конечно, кажется, во-первых) всегда выделяются запятыми`],[`Причастный оборот ПОСЛЕ определяемого слова выделяется запятыми`],[`ССП: запятая перед и, а, но, однако, да (=но)`],[`СПП: придаточное присоединяется союзами что, чтобы, когда, где, который`],[`БСП: двоеточие (причина, пояснение), тире (противопоставление, время, условие)`],[`Прямая речь: А: 'П'. или 'П', — а.`],[`Стили: научный, официально-деловой, публицистический, художественный, разговорный`]]},fe={minTopicIndices:[0,1,3,5,8,10,13,16,18,20,22,24],titles:[{az:`1. Artikllər: Müəyyən, qeyri-müəyyən və hissə artiklləri (Articles)`,ru:`1. Артикли: определенные, неопределенные и частичные`,en:`1. Articles: Definite, Indefinite, Partitive`},{az:`2. İsimlərin və sifətlərin cinsi və cəmi (Genre et nombre)`,ru:`2. Род и число существительных и прилагательных`,en:`2. Gender and Plural of Nouns and Adjectives`},{az:`3. Saylar və saat bildirilməsi (Les nombres et l'heure)`,ru:`3. Числительные и указание времени`,en:`3. Numbers, Quantities and Telling Time`},{az:`4. Göstərici və mənsubiyyət sifətləri (Adjectifs démonstratifs et possessifs)`,ru:`4. Указательные и притяжательные прилагательные`,en:`4. Demonstrative and Po онение (Conditionnel présent)`,en:`16. Conditional Mood and Si Clauses`},{az:`17. Əmr şəkli (Impératif) və modal feillər (Pouvoir, Devoir, Vouloir)`,ru:`17. Повелительное наклонение и модальные глаголы`,en:`17. Imperative Mood and Modal Verbs`},{az:`18. Sifət və zərflərin müqayisə dərəcələri (Comparatif et superlatif)`,ru:`18. Степени сравнения прилагательных и наречий`,en:`18. Comparative and Superlative Degrees`},{az:`19. Məchul növ (Voix passive)`,ru:`19. Пассивный залог (Voix passive)`,en:`19. Passive Voice in French`},{az:`20. Nisbi əvəzliklər: qui, que, où, dont (Pronoms relatifs)`,ru:`20. Относительные местоимения (qui, que, où, dont)`,en:`20. Relative Pronouns: qui, que, où, dont`},{az:`21. Subjonctif présent: Arzu, şübhə və hissiyyat ifadələri`,ru:`21. Сослагательное наклонение (Subjonctif présent)`,en:`21. Subjunctive Mood (Subjonctif Présent)`},{az:`22. Vasitəli nitq və zamanların uzlaşması (Discours indirect)`,ru:`22. Косвенная речь и согласование времен`,en:`22. Indirect Speech and Tense Sequence`},{az:`23. Qerondi və Feli sifət (Gérondif et Participe présent)`,ru:`23. Деепричастие (Gérondif) и причастие настоящего времени`,en:`23. Gerund and Present Participle`},{az:`24. Əsas bağlayıcılar və mətn əlaqələndiriciləri (Connecteurs logiques)`,ru:`24. Логические связки и союзы (mais, donc, parce que)`,en:`24. Logical Connectors and Discourse Markers`},{az:`25. Oxu və anlama: DİM imtahan mətni və situativ suallar`,ru:`25. Чтение и понимание текста: экзаменационные форматы`,en:`25. Reading Comprehension and Exam Strategies`}],theories:[{az:`Fransız dilində artikllər ismin cinsini (kişi - masculin, qadın - féminin) və kəmiyyətini göstərir. Qeyri-müəyyən: un (kişi), une (qadın), des (cəm). Müəyyən: le, la, l', les. Hissə artikli (du, de la, de l', des) sayılmayan maddə və ərzaqlarla işlədilir (du pain, de l'eau).`,ru:`Артикли выражают род и число существительного. Неопределенные: un, une, des. Определенные: le, la, l', les. Частичный артикль (du, de la, de l') употребляется с неисчисляемыми существительными (du lait, de l'eau).`,en:`Articles indicate noun gender and number. Indefinite: un, une, des. Definite: le, la, l', les. Partitive articles (du, de la, de l') denote uncounted mass nouns or foods.`}],rules:[[`Un / Une / Des (qeyri-müəyyən)`,`Le / La / L' / Les (müəyyən)`,`Du / De la / De l' (hissə artikli)`],[`Qadın cinsi adətən -e sonluğu ilə düzəlir`,`Cəm adətən -s əlavə edilməklə yaranır (-al → -aux)`],[`70 = soixante-dix`,`80 = quatre-vingts`,`90 = quatre-vingt-dix`],[`Ce, cet, cette, ces (göstərici)`,`Mon, ton, son, notre, votre, leur (mənsubiyyət)`],[`1-ci qrup: -er (-e, -es, -e, -ons, -ez, -ent)`,`Parler, habiter, aimer`],[`Être (suis, es, est, sommes, êtes, sont)`,`Avoir (ai, as, a, avons, avez, ont)`,`Aller (vais, vas, va, allons, allez, vont)`],[`Je me lave, tu te laves, il se lave, nous nous lavons, vous vous lavez, ils se lavent`],[`Ne ... pas (inkar)`,`Ne ... jamais (heç vaxt)`,`Ne ... rien (heç nə)`,`Ne ... personne (heç kəs)`],[`Est-ce que tu viens?`,`Inversiya: Viens-tu?`,`Où, quand, comment, pourquoi`],[`À la maison, en France, au Japon, chez le médecin`],[`Passé composé = avoir / être + participe passé`,`14 hərəkət feli être ilə işlənir (aller, venir, partir)`],[`Imparfait: nous formasının kökü + -ais, -ais, -ait, -ions, -iez, -aient`],[`Futur simple: infinitiv + -ai, -as, -a, -ons, -ez, -ont`,`Futur proche: aller + infinitiv`],[`COD: me, te, le, la, nous, vous, les`,`COI: me, te, lui, nous, vous, leur`],[`Y: məkan və à + cansız isim`,`EN: miqdar və de + isim`],[`Conditionnel: futur kökü + imparfait sonluqları (-ais, -ait)`,`Si + imparfait → conditionnel`],[`Impératif: Tu, Nous, Vous formaları (-s düşür: Parle!)`],[`Plus ... que (daha çox)`,`Moins ... que (daha az)`,`Aussi ... que (eyni dərəcədə)`],[`Voix passive: être + participe passé (+ par)`],[`Qui (mübtəda)`,`Que (tamamlıq)`,`Où (yer/vaxt)`,`Dont (de ilə idarə olunan)`],[`Subjonctif: il faut que tu viennes, je veux que...`],[`Présent → Imparfait` sbi əvəzliklər (Relativsätze: der, die, das)`,ru:`22. Относительные придаточные (Relativsätze)`,en:`22. Relative Clauses (Relativsätze)`},{az:`23. İnfinitiv qruplar: um... zu, ohne... zu, statt... zu`,ru:`23. Инфинитивные обороты (um... zu, statt... zu, ohne... zu)`,en:`23. Infinitive Constructions: um... zu, ohne... zu`},{az:`24. Şərt və arzu şəkli: Konjunktiv II (hätte, wäre, würde + Infinitiv)`,ru:`24. Сослагательное наклонение (Konjunktiv II)`,en:`24. Subjunctive II: Wäre, Hätte, Würde`},{az:`25. Mətnin oxunub-anlanması və DİM imtahan lüğəti`,ru:`25. Чтение текста и экзаменационный лексикон`,en:`25. Reading Comprehension and Core Vocabulary`}],theories:[{az:`Alman dilində isimlərin 3 qrammatik cinsi var: kişi (maskulin - der), qadın (feminin - die), orta (neutral - das). Cəmdə artikl hər zaman die olur. 4 hal var: Nominativ (adlıq), Akkusativ (təsirlik), Dativ (yönlük/yerlik), Genitiv (yiyəlik). Məsələn: der Mann → den Mann (Akk) → dem Mann (Dat) → des Mannes (Gen).`,ru:`В немецком три рода: der (мужской), die (женский), das (средний). Во множественном числе всегда die. 4 падежа: Nominativ (кто? что?), Akkusativ (кого? что?), Dativ (кому? где?), Genitiv (чей?).`,en:`German has 3 grammatical genders: der (masculine), die (feminine), das (neuter). Plural always takes 'die'. 4 cases: Nominative, Accusative, Dative, Genitive.`}],rules:[[`der/die/das/die (müəyyən)`,`ein/eine/ein (qeyri-müəyyən)`,`Akk: den/die/das/die`,`Dat: dem/der/dem/den(+n)`],[`Bütün isimlər BÖYÜK hərflə yazılır`,`Çoxluq sonluqları: -e, -er, -en, -s və umlaut`],[`21 = einundzwanzig (təklik əvvəl deyilir)`,`Uhrzeit: Wie spät ist es?`],[`Ich, du, er, sie, es, wir, ihr, sie, Sie`,`Mein, dein, sein, ihr, unser, euer, ihr`],[`Präsens sonluqları: -e, -st, -t, -en, -t, -en`,`Kök saitinin dəyişməsi: a → ä, e → i/ie`],[`sein: bin, bist, ist, sind, seid, sind`,`haben: habe, hast, hat, haben, habt, haben`],[`Ayrılan: ab-, an-, auf-, aus-, ein-, mit-, vor-, zu- (cümlənin sonuna gedir)`,`Ayrılmayan: be-, ge-, al və əyrixətli trapesiyanın sahəsi`,ru:`15. Интеграл и площадь криволинейной трапеции`,en:`15. Integrals and Area under Curves`},{az:`16. Üçbucaqlar: tərəf və bucaq münasibətləri`,ru:`16. Треугольники: соотношения сторон и углов`,en:`16. Triangles: Angle and Side Relations`},{az:`17. Sinuslar və kosinuslar teoremi`,ru:`17. Теоремы синусов и косинусов`,en:`17. Law of Sines and Cosines`},{az:`18. Dördbucaqlılar və paraleloqram növləri`,ru:`18. Четырёхугольники и параллелограммы`,en:`18. Quadrilaterals and Parallelograms`},{az:`19. Trapesiyanın xassələri və orta xətti`,ru:`19. Трапеция и её средняя линия`,en:`19. Trapezoids and Midsegments`},{az:`20. Çevrə, qövs və vətər münasibətləri`,ru:`20. Окружность, хорды и касательные`,en:`20. Circle, Chords and Tangents`},{az:`21. Həndəsi fiqurların sahələri`,ru:`21. Площади плоских фигур`,en:`21. Areas of Geometric Figures`},{az:`22. Müstəvidə və fəzada vektorlar`,ru:`22. Векторы на плоскости и в пространстве`,en:`22. Vectors in 2D and 3D`},{az:`23. Fəza fiqurları: prizma və piramida`,ru:`23. Многогранники: призма и пирамида`,en:`23. Polyhedra: Prisms and Pyramids`},{az:`24. Fırlanma cisimləri: silindr, konus, kürə`,ru:`24. Тела вращения: цилиндр, конус, шар`,en:`24. Solids of Revolution: Cylinder, Cone, Sphere`},{az:`25. Kombinatorika və ehtimal nəzəriyyəsi`,ru:`25. Комбинаторика и теория вероятностей`,en:`25. Combinatorics and Probability`}],theories:[{az:`Faiz ədədin yüzdə bir hissəsidir. Ədədin p faizini tapmaq üçün ədədi p/100-ə vurmaq lazımdır. Ədəd p% artıbsa N·(1 + p/100), azalıbsa N·(1 - p/100) düsturu tətbiq olunur. Nisbət iki kəmiyyətin qismətidir. Tənasübün əsas xassəsi: kənar hədlərin hasili orta hədlərin hasilinə bərabərdir (a/b = c/d ⇒ a·d = b·c).`,ru:`Процент — это одна сотая часть числа. Чтобы найти p% от числа N, умножьте N на p/100. При увеличении на p% число умножается на (1 + p/100), при уменьшении — на (1 - p/100). Основное свойство пропорции: произведение крайних членов равно произведению средних (a/b = c/d ⇒ a·d = b·c).`,en:`A percentage is one-hundredth of a number. To find p% of N, calculate N · (p/100). An increase of p% multiplies by (1 + p/100), while a decrease multiplies by (1 - p/100). In a proportion a/b = c/d, the product of the extremes equals the product of the means: a · d = b · c.`},{az:`Kvadrat tənlik ax² + bx + c = 0 (a ≠ 0) şəklindədir. Diskriminant D = b² - 4ac hesablanır. D > 0 olduqda iki fərqli həqiqi kök var: x = (-b ± √D) / 2a. D = 0 olduqda bir kök (iki bərabər kök): x = -b / 2a. D < 0 olduqda həqiqi kökü yoxdur. Viyet teoreminə görə: x₁ + x₂ = -b/a və x₁ · x₂ = c/a.`,ru:`Квадратное уравнение ax² + bx + c = 0 (a ≠ 0). Дискриминант D = b² - 4ac. При D > 0 два корня x = (-b ± √D)/2a. При D = 0 один корень x = -b/2a. При D < 0 действительных корней нет. По теореме Виета сумма корней x₁ + x₂ = -b/a, произведение x₁ · x₂ = c/a.`,en:`Quadratic equation ax² + bx + c = 0 (a ≠ 0). Discriminant D = b² - 4ac. If D > 0: two real roots x = (-b ± √D)/(2a). If D = 0: one real root x = -b/(2a). If D < 0: no real roots. By Vieta's Theorem: x₁ + x₂ = -b/a and x₁ · x₂ = c/a.`},{az:`Arifmetik silsilədə hər növbəti hədd əvvəlki həddə eyni d (silsilə fərqi) ədədini əlavə etməklə alınır: aₙ = a₁ + (n - 1)d. İstənilən hədd özünə qonşu olan hədlərin ədədi ortasıdır: aₙ = (aₙ₋₁ + aₙ₊₁) / 2. İlk n həddin cəmi: Sₙ = ((a₁ + aₙ) / 2) · n və ya Sₙ = ((2a₁ + (n - 1)d) / 2) · n.`,ru:`Арифметическая прогрессия: каждый член равен предыдущему плюс разность d: aₙ = a₁ + (n - 1)d. Любой член является средним арифметическим соседей: aₙ = (aₙ₋₁ + aₙ₊₁)/2. Сумма первых n членов: Sₙ = ((a₁ + aₙ)/2) · n.`,en:`Arithmetic progression: each term equals previous plus common difference d: aₙ = a₁ + (n - 1)d. Any term is the arithmetic mean of its neighbors. Sum of first n terms: Sₙ = ((a₁ + aₙ)/2) · n.`}],rules:[[`p% · N = N · (p / 100)`,`+p% → N · (1 + p/100)`,`-p% → N · (1 - p/100)`,`a/b = c/d ⇒ a · d = b · c`],[`D = b² - 4ac`,`x = (-b ± √D) / 2a`,`x₁ + x₂ = -b / a`,`x₁ · x₂ = c / a`],[`aₙ = a₁ + (n - 1)d`,`d = (aₙ - aₖ) / (n - k)`,`Sₙ = ((a₁ + aₙ) / 2) · n`,`aₙ = (aₙ₋₁ + aₙ₊₁) / 2`],[`ax + b = 0 ⇒ x = -b/a (a ≠ 0)`,`a₁x + b₁y = c₁ & a₂x + b₂y = c₂`,`a₁/a₂ ≠ b₁/b₂ ⇒ 1 həll`,`a₁/a₂ = b₁/b₂ = c₁/c₂ ⇒ sonsuz sayda`],[`a > b, c < 0 ⇒ ac < bc`,`f(x)·g(x) ≥ 0 intervallar üsulu`,`ax² + bx + c < 0 (a > 0, D > 0) ⇒ x₁ < x < x₂`],[`|x| = a (a ≥ 0) ⇒ x = a və ya x = -a`,`|x| < a ⇒ -a < x < a`,`|x| > a ⇒ x < -a və ya x > a`,`√(x²) = |x|`],[`aᵐ · aⁿ = aᵐ⁺ⁿ`,`(aᵐ)ⁿ = aᵐⁿ`,`a⁻ⁿ = 1 / aⁿ`,`ⁿ√(aᵐ) = a^(m/n)`],[`logₐ(xy) = logₐx + logₐy`,`logₐ(x/y) = logₐx - logₐy`,`logₐ(xᵖ) = p · logₐx`,`a^(logₐb) = b`],[`aᶠ(ˣ) = aᵍ(ˣ) ⇔ f(x) = g(x) (a > 0, a ≠ 1)`,`a > 1: aˣ artandır`,`0 < a < 1: aˣ azalandır`],[`Təyin oblastı: məxrəc ≠ 0, cüt dərəcədən kökaltı ≥ 0`,`Parabolanın təpə nöqtəsi: x₀ = -b / 2a`,`f(-x) = f(x) cüt, f(-x) = -f(x) tək`],[`bₙ = b₁ · qⁿ⁻¹`,`bₙ² = bₙ₋₁ · bₙ₊₁`,`Sₙ = b₁(qⁿ - 1) / (q - 1)`,`S_sonsuz = b₁ / (1 - q) (|q| < 1)`],[`sin²α + cos²α = 1`,`tg α · ctg α = 1`,`sin 2α = 2 sin α cos α`,`cos 2α = cos²α - sin²α = 2cos²α - 1`],[`sin x = a (|a| ≤ 1) ⇒ x = (-1)ⁿ arcsin a + πn`,`cos x = a ⇒ x = ± arccos a + 2πn`,`tg x = a ⇒ x = arctg a + πn`],[`(xⁿ)' = n · xⁿ⁻¹`,`(u · v)' = u'v + uv'`,`(u / v)' = (u'v - uv') / v²`,`Toxunan: y = f(x₀) + f'(x₀)(x - x₀)`],[`∫ xⁿ dx = xⁿ⁺¹/(n+1) + C`,`Nyuton-Leybnis: ∫ₐᵇ f(x)dx = F(b) - F(a)`,`S = ∫ₐᵇ (f(x) - g(x)) dx`],[`Bucaqların cəmi = 180°`,`Xarici bucaq = qonşu olmayan iki daxili bucağın cəmi`,`Üçbucaq bərabərsizliyi: |a-b| < c < a+b`],[`a / sin A = b / sin B = c / sin C = 2R`,`c² = a² + b² - 2ab · cos C`,`S = (1/2) ab · sin C`],[`Paraleloqram: S = a · h_a = ab · sin α`,`Romb: d₁ ⊥ d₂, S = (d₁ · d₂) / 2`,`Düzbucaqlı: d₁ = d₂, S = a · b`],[`Trapesiyanın orta xətti: l = (a + b) / 2`,`Sahəsi: S = ((a + b) / 2) · h = l · h`,`Bərabəryanlı trapesiyada oturacağa çəkilən hündürlük`],[`Daxilə çəkilmiş bucaq = qövs / 2`,`Mərkəzi bucaq = qövs`,`Vətərlər kəsişdikdə: AM · MB = CM · MD`,`Toxunan və kəsən: AK² = AM · AB`],[`Heron düsturu: ə qapalı) və 23 samit hərf vardır. Samitlər cingiltili və kar olmaqla iki qrupa bölünür.`,ru:`В азербайджанском алфавите 32 буквы и 34 звука. 9 гласных (твердые, мягкие, огубленные и неогубленные) и 23 согласных (звонкие и глухие).`,en:`Azerbaijani alphabet has 32 letters and 34 sounds. 9 vowels (back/front, rounded/unrounded) and 23 consonants (voiced/voiceless).`},{az:`Ahəng qanunu sözdə qalın və ya incə saitlərin bir-birini izləməsidir. Türk mənşəli sözlərin əksəriyyəti ahəng qanununa tabedir. Şəkilçilər iki və ya dörd variantlı olur (-lar/-lər, -çı/-çi/-çu/-çü). Vurğu əksər hallarda sözün son hecasına düşür.`,ru:`Закон сингармонизма: гласные в слове гармонируют по ряду (твердые с твердыми, мягкие с мягкими). Аффиксы имеют 2 или 4 варианта. Ударение чаще падает на последний слог.`,en:`Vowel harmony: vowels within a word agree in backness/frontness. Suffixes come in 2 or 4 variants (-lar/-lər, -çı/-çi/-çu/-çü). Stress typically falls on the last syllable.`}],rules:[[`9 sait, 23 samit hərf`,`Qalın: a, ı, o, u | İncə: e, ə, i, ö, ü`,`Kar samitlər: p, f, x, t, ş, k, k', ç, h, s, c`],[`Ahəng qanunu morfoloji dəyişməni idarə edir`,`2 cür şəkilçilər: -a / -ə`,`4 cür şəkilçilər: -ı / -i / -u / -ü`],[`Leksik məna: sözün ifadə etdiyi anlayış`,`Qrammatik məna: aid olduğu nitq hissəsi və forması`],[`Sinonimlər: yaxın mənalı sözlər`,`Antonimlər: əks mənalı sözlər`,`Omonimlər: yazılışı eyni, mənası tam fərqli`],[`Frazeologizmlər bütöv bir cümlə üzvü olur`,`Tərkib hissələrinə ayrılmır, məcazi mənadadır`]]}),he(`eng`,{minTopicIndices:[0,3,4,9,10,11,12,13,17,21],titles:[{az:`1. İndiki Sadə və Davamedici zamanlar (Present Simple & Continuous)`,ru:`1. Present Simple и Present Continuous`,en:`1. Present Simple & Continuous`},{az:`2. Keçmiş Sadə və Davamedici zamanlar (Past Simple & Continuous)`,ru:`2. Past Simple и Past Continuous`,en:`2. Past Simple & Continuous`},{az:`3. Gələcək zamanlar və 'be going to' forması`,ru:`3. Future Simple и конструкция be going to`,en:`3. Future Simple
