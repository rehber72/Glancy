<style>
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.select-text{overflow-wrap:anywhere}
@media (max-width:640px){
 /* header: one compact row, nothing can push icons out of the screen */
 header>div{height:56px!important;gap:6px!important;padding-left:10px!important;padding-right:10px!important}
 header>div>button{flex:0 1 auto;min-width:0;padding:2px!important}
 .dm-brand{font-size:14px!important}
 .dm-hd-r{gap:2px!important;min-width:0;flex:0 0 auto}
 .dm-hd-r>button{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;padding:0!important}
 .dm-hd-r>button>div:first-child{flex:0 0 auto}
 .dm-hd-r .dm-lang{flex:0 0 auto}
 .dm-hd-r .dm-lang button{padding:5px 5px!important;font-size:10px!important;min-width:24px}
 /* topic cards: title on top (full width), buttons underneath */
 .dm-card{flex-direction:column!important;align-items:stretch!important;gap:10px!important;padding:12px!important}
 .dm-card-main{padding-right:0!important;align-items:flex-start!important;gap:8px!important}
 .dm-card-main>button{flex:0 0 auto}
 .dm-card-main>button:nth-child(2){padding:4px!important}
 .dm-card-title{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35}
 .dm-card-main span{white-space:nowrap}
 .dm-card-act{width:100%;gap:8px!important}
 .dm-card-act button{flex:1 1 0;justify-content:center;white-space:nowrap;gap:5px!important;min-height:38px;padding:8px 6px!important;font-size:11.5px!important}
 .dm-card-act button span{display:inline!important}
 /* filter tabs and action buttons */
 .dm-seg{display:grid!important;grid-template-columns:1fr 1fr;width:100%}
 .dm-seg button{justify-content:center;white-space:nowrap;padding:9px 6px!important}
 .dm-acts{width:100%}
 .dm-acts button{flex:1 1 calc(50% - 8px);justify-content:center;text-align:center;min-height:40px}
 /* quiz */
 .dm-qnum{width:36px!important;height:36px!important}
 .max-w-3xl>div.rounded-2xl{padding:16px!important}
 .max-w-3xl button.text-left{padding:12px!important}
 /* theory top bar */
 .dm-tvbar{flex-wrap:wrap;justify-content:flex-end;gap:6px!important}
 .dm-tvbar button{padding:6px 10px!important}
}
@media (max-width:400px){ .dm-acts button{flex:1 1 100%} }
@media (max-width:420px){ .dm-brand{display:none!important} }
</style>
<style>/* ===== DIM v8: smoother motion + render optimisations ===== */
@keyframes dmRise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes dmPop{from{opacity:0;transform:translate3d(0,10px,0) scale(.965)}to{opacity:1;transform:none}}
@keyframes dmFade{from{opacity:0}to{opacity:1}}
@keyframes dmBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dmShimmer{from{background-position:-200% 0}to{background-position:200% 0}}

#root>div{animation:dmFade .7s cubic-bezier(.2,.7,.2,1) both}
header.sticky{animation:dmFade .6s .1s both}
/* every view change mounts a new first child in <main>: animate it in */
main>div,main>section{animation:dmRise .5s cubic-bezier(.2,.7,.2,1) both}
main>div>*{animation:dmRise .55s cubic-bezier(.2,.7,.2,1) both}
main>div>*:nth-child(1){animation-delay:.03s}
main>div>*:nth-child(2){animation-delay:.08s}
main>div>*:nth-child(3){animation-delay:.13s}
main>div>*:nth-child(4){animation-delay:.18s}
main>div>*:nth-child(5){animation-delay:.23s}
main>div>*:nth-child(n+6){animation-delay:.28s}
/* topic cards: staggered entrance + cheap off-screen rendering */
.dm-card{animation:dmRise .5s cubic-bezier(.2,.7,.2,1) both;content-visibility:auto;contain-intrinsic-size:auto 120px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s,background-color .25s}
.dm-card:nth-child(1){animation-delay:.02s}.dm-card:nth-child(2){animation-delay:.05s}.dm-card:nth-child(3){animation-delay:.08s}
.dm-card:nth-child(4){animation-delay:.11s}.dm-card:nth-child(5){animation-delay:.14s}.dm-card:nth-child(6){animation-delay:.17s}
.dm-card:nth-child(7){animation-delay:.20s}.dm-card:nth-child(8){animation-delay:.23s}.dm-card:nth-child(n+9){animation-delay:.26s}
@media (hover:hover){.dm-card:hover{transform:translate3d(0,-2px,0);box-shadow:0 10px 28px -12px rgba(124,58,237,.35)}}
/* modals / dialogs */
.fixed.inset-0.z-50{animation:dmFade .22s ease both}
.fixed.inset-0.z-50>div{animation:dmPop .3s cubic-bezier(.2,.8,.2,1) both}
/* press feedback + transitions on all controls */
button,[role=button],select,input{transition:transform .16s cubic-bezier(.2,.7,.2,1),background-color .2s,border-color .2s,color .2s,box-shadow .2s,opacity .2s}
button:not(:disabled):active{transform:scale(.97)}
/* progress bars grow from the left */
[class*="bg-gradient-to-r"][style*="width"],.h-1\.5>div[style*="width"],.h-2>div[style*="width"]{transform-origin:left center;animation:dmBar .9s .15s cubic-bezier(.2,.7,.2,1) both}
/* quiz options feel tactile */
.max-w-3xl button.text-left{transition:transform .18s cubic-bezier(.2,.7,.2,1),background-color .2s,border-color .2s,box-shadow .2s}
.max-w-3xl button.text-left:not(:disabled):active{transform:scale(.985)}
/* cheaper blur on phones (backdrop-filter is the most expensive effect here) */
@media (max-width:640px){header.sticky{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background-color:rgba(2,6,23,.96)!important}}
@media (max-width:640px) and (prefers-color-scheme:light){html:not(.dark) header.sticky{background-color:rgba(255,255,255,.96)!important}}
html:not(.dark) header.sticky{background-color:rgba(255,255,255,.9)}
/* theme switch fades instead of flashing */
html{color-scheme:dark}html:not(.dark){color-scheme:light}
body{transition:background-color .35s ease,color .35s ease}
img,svg{content-visibility:auto}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>#dimIntro{position:fixed;inset:0;z-index:9999;overflow:hidden;color:#e8f1ff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

@keyframes dimAur1{to{transform:translate3d(8%,6%,0) scale(1.18)}}

 Biosafety Protocols"},{az:"17. Fərdi mühafizə vasitələri: Əleyhqaz və qoruyucu kostyum",ru:"17. Средства индивидуальной защиты: Противогаз и ОЗК",en:"17. Personal Protective Gear: Gas Masks and Protective Suits"},{az:"18. Kollektiv mühafizə qurğuları: Sığınacaqlar və daldalanacaqlar",ru:"18. Коллективные защитные сооружения: Убежища и укрытия",en:"18. Collective Protective Structures: Shelters and Bunkers"},{az:"19. Minalar və partlamamış sursatlarla təhlükəsiz davranış",ru:"19. Минная безопасность и неразорвавшиеся боеприпасы",en:"19. Mine Safety and Explosive Ordnance Awareness"},{az:"20. İlk tibbi yardım: Qanaxmaların dayandırılması və jqut qoyulması",ru:"20. Первая помощь: Остановка кровотечений и наложение жгута",en:"20. First Aid: Bleeding Control and Tourniquet Application"},{az:"21. Sınıqlar, çıxıqlar və immobilizasiya (şin qoyma)",ru:"21. Переломы, вывихи и транспортная иммобилизация (шины)",en:"21. Fractures, Dislocations and Splint Immobilization"},{az:"22. Ürək-ağciyər reanimasiyası (Süni tənəffüs və qapalı ürək masajı)",ru:"22. Сердечно-легочная реанимация (СЛР и искусственное дыхание)",en:"22. Cardiopulmonary Resuscitation (CPR and Artificial Respiration)"},{az:"23. Termik, kimyəvi yanıqlar və donvurma zamanı ilk yardım",ru:"23. Первая помощь при ожогах, обморожениях и тепловом ударе",en:"23. First Aid for Burns, Frostbite and Heatstroke"},{az:"24. Şəxsi gigiyena, səhra sanitar tədbirləri və infeksiyalar",ru:"24. Личная гигиена и полевая санитария, профилактика инфекций",en:"24. Field Hygiene, Sanitation and Infection Prevention"},{az:"25. 44 günlük Vətən müharibəsi və Azərbaycan Ordusunun Zəfər yolu",ru:"25. 44-дневная Отечественная война и Победоносный путь Армии",en:"25. 44-Day Patriotic War and the Historic Victory of Azerbaijan"}],theories:[{az:"Azərbaycan Respublikasının Silahlı Qüvvələri Quru Qoşunları, Hərbi Hava Qüvvələri və Hərbi Dəniz Qüvvələrindən ibarətdir. AR Prezidenti Silahlı Qüvvələrin Ali Baş Komandanıdır. Əsas təyinatı dövlətin müstəqilliyini, suverenliyini, ərazi bütövlüyünü və sərhədlərini qorumaqdır.",ru:"Вооруженные Силы Азербайджана включают Сухопутные войска, ВВС и ВМС. Президент является Верховным Главнокомандующим. Главное предназначение — защита независимости, суверенитета и территориальной целостности государства.",en:"The Armed Forces of Azerbaijan comprise Land Forces, Air Force, and Navy. The President serves as Supreme Commander-in-Chief. Their mission is safeguarding national independence, sovereignty, and territorial integrity."},{az:"Hərbi and hər bir əsgərin Vətənə və xalqa sədaqət andıdır. Hərbi hissəyə qəbul edilmiş gənc əsgər ilkin təlim kursunu başa vurduqdan sonra Dövlət Bayrağı önündə təntənəli şəkildə and içir. Andı pozmaq hərbi cinayətdir və qanunvericiliklə ciddi cəzalandırılır.",ru:"Военная присяга — священный обет верности Родине. Принимается перед Государственным флагом после курса молодого бойца. Нарушение присяги преследуется по закону.",en:"The Military Oath is a solemn pledge to the Homeland. Administered before the National Flag upon basic training completion. Violating the oath is a criminal offense."},{az:"Hərbi rütbələr vəzifə səlahiyyətləri və xidmət müddətinə görə verilir. Heyətlər: Əsgər/matros, Çavuş (kiçik çavuş, çavuş, baş çavuş), Gizir/miçman, Kiçik zabitlər (leytenant, b.leytenant, kapitan), Baş zabitlər (mayor, polkovnik-leytenant, polkovnik), Ali zabitlər (generallar).",ru:"Воинские звания отражают служебное положение и выслугу. Составы: солдаты, сержанты, прапорщики (гизиры), младшие офицеры (лейтенант, капитан), старшие офицеры (майор, подполковник, полковник), высшие офицеры (генералы).",en:"Military ranks reflect responsibility and service: enlisted soldiers, NCOs (sergeants), warrant officers (gizirs), company-grade officers (lieutenants, captain), field officers (majors, colonels), and general officers."},{az:"Sıra — hərbi qulluqçuların nizamnamə ilə müəyyən edilmiş qaydada yerləşməsidir. Elementləri: Cəbhə (üz tərəf), Cinahlar (sağ və sol uclar), Arxa tərəf, İnterval (cəbhə boyu məsafə), Distansiya (dərinlik üzrə məsafə). Əsas komandalar: Farağat, Azad, Düzlən.",ru:"Строй — установленное уставом размещение военнослужащих. Элементы: фронт, фланги (правый/левый), тыл, интервал (по фронту), дистанция (в глубину). Команды: 'Смирно', 'Вольно', 'Равняйсь'.",en:"Formation is organized military posture. Elements: front, flanks, rear, interval (lateral spacing), distance (depth). Core commands: 'Attention', 'At ease', 'Dress right'."},{az:"5.45 mm-lik AK-74 fərdi atıcı silahdır. Güllənin başlanğıc sürəti 900 m/san, nişangah məsafəsi 1000 m, daraq tutumu 30 patron, kütləsi patronsuz 3.3 kq-dır. Lülə qutusu, çaxmaq çərçivəsi, çaxmaq, qaytarıcı mexanizm və qaz borucuğundan ibarətdir.",ru:"5,45-мм АК-74 — индивидуальное автоматическое оружие. Начальная скорость 900 м/с, прицельная дальность 1000 м, емкость магазина 30 патронов, масса 3,3 кг. Состоит из ствола, затворной рамы, затвора, возвратного механизма и газовой трубки.",en:"5.45mm AK-74 assault rifle: muzzle velocity 900 m/s, sighting range 1000m, 30-round magazine, 3.3 kg unloaded. Main components: receiver, bolt carrier with gas piston, bolt, return spring, and gas tube."},{az:"AK-74-ün natamam sökülməsi ardıcıllığı: 1. Darağı ayırmaq və lülədə patron olmadığını yoxlamaq (nəzarət tətiyi); 2. Qələm qutusunu və şompulu çıxarmaq; 3. Lülə qutusunun qapağını ayırmaq; 4. Qaytarıcı mexanizmi çıxarmaq; 5. Çaxmaq çərçivəsini çaxmaqla birlikdə ayırmaq və çaxmağı çərçivədən çıxarmaq; 6. Qaz borucuğunu ayırmaq. Yığılma tərs ardıcıllıqla icra edilir.",ru:"Порядок неполной разборки АК-74: 1. Отделить магазин, проверить патронник (контрольный спуск); 2. Извлечь пенал и шомпол; 3. Отделить крышку ствольной коробки; 4. Извлечь возвратный механизм; 5. Вынуть затворную раму с затвором, отделить затвор; 6. Снять газовую трубку. Сборка в обратном порядке.",en:"AK-74 field stripping steps: 1. Remove magazine & clear chamber (safety dry fire); 2. Extract cleaning kit & cleaning rod; 3. Detach receiver cover; 4. Remove return mechanism; 5. Extract bolt carrier with bolt & separate bolt; 6. Remove gas tube. Reassembly proceeds in exact reverse."},{az:"Atış zamanı trayektoriya güllənin havadakı uçuş xəttidir. Əsas nöqtələr: atış nöqtəsi, hədəf, görüş nöqtəsi, ən yüksək nöqtə. Nişan alarkən arpacıq novçanın tam mərkəzində və üst kənarları eyni səviyyədə olmalı, nəfəs yarı-nəfəsvermədə saxlanılaraq tətik aramla basılmalıdır.",ru:"Траектория — линия полета пули. При прицеливании мушка должна находиться строго по центру прорези целика заподлицо с ее краями. Спуск нажимается плавно на полувыдохе.",en:"Trajectory is bullet path in air. Aiming requires centering the front post inside the rear notch flush with its edges. Squeeze the trigger smoothly on half-exhale."},{az:"F-1 müdafiə qumbarasıdır (çəkisi 600 q, qəlpələrin dağılma radiusu 200 m, yalnız səngərdən atılır). RQD-5 hücum qumbarasıdır (radiusu 25 m, hərəkətdə atıla bilər). UZRQM alışdırıcısının partlama ləngiməsi 3.2 – 4.2 saniyədir.",ru:"Ф-1 — оборонительная граната (осколки до 200 м, бросается из укрытия). РГД-5 — наступательная (радиус 25 м). Время замедления запала УЗРГМ: 3,2 – 4,2 секунды.",en:"F-1 is defensive (fragmentation radius up to 200m, thrown only from cover). RGD-5 is offensive (radius 25m). UZRGM fuse delay is 3.2 - 4.2 seconds."},{az:"Döyüş meydanında əsgər plastun sayağı (ən aşağı profil), yarı-diz üstə və yan üstə sürünür. Təbii çökəkliklərdən və maneələrdən istifadə edərək 3-5 saniyəlik qısa tirelərlə irəliləyir. Maskalanma üçün ərazinin rənginə uyğun bitki örtüyündən istifadə olunur.",ru:"Способы переползания: по-пластунски, на получетвереньках и на боку. Передвижение короткими перебежками по 3-5 секунд с использованием складок местности. Маскировка под окружающий фон.",en:"Crawling methods: low belly crawl (plastun), hands-and-knees, and side crawl. Advance via 3-5 second short rushes using natural micro-relief. Camouflage blends with natural foliage."},{az:"Səmtləşmə üfüqün cəhətlərinin təyin edilməsidir. Kompasın qırmızı (və ya qaranlıqda fosforlu) əqrəbi daima Şimalı göstərir. Qütb ulduzu Kiçik Ayı bürcünün quyruğunda olub Şimalı dəqiq təyin edir. Ağacların qabığı və mamır şimalda daha rütubətli və sıxdır.",ru:"Ориентирование — определение сторон горизонта. Стрелка компаса указывает на Север. Полярная звезда точно указывает на Север. Мох на деревьях гуще с северной стороны.",en:"Navigation determines cardinal directions. Magnetic compass needle points North. Polaris (North Star) in Ursa Minor points true North. Tree moss grows denser on the shaded northern side."},{az:"Hərbi topoqrafik xəritələr yer səthinin dəqiq qrafik təsviridir. Miqyas xəritədəki xəttin yer səthindəki həqiqi məsafəyə nisbətidir (1:50 000 — 1 sm-də 500 metr). Relyef qapalı əyri xətlər — horizontallarla (izohipslərlə) təsvir olunur.",ru:"Топографическая карта — изображение местности. Масштаб 1:50 000 означает 500 м в 1 см. Рельеф изображается горизонталями (изогипсами). Бергштрихи показывают направление ската.",en:"Topographic maps graphically depict terrain. Scale 1:50,000 equals 500m per 1cm. Relief is shown via elevation contour lines (isohypses). Bergstrichs indicate downhill slope direction."},{az:"Azimut — şimal istiqaməti ilə müşahidə edilən obyekt arasındakı bucaqdır və saat əqrəbi istiqamətində 0°-dən 360°-dək ölçülür. Düz azimut ilə tərs azimut arasındakı fərq 180°-dir (A_tərs = A_düz ± 180°).",ru:"Азимут — угол между направлением на север и на объект, измеряемый по ходу часовой стрелки от 0° до 360°. Обратный азимут отличается от прямого ровно на 180°.",en:"Azimuth is the clockwise angle from North to the target line, ranging 0° to 360°. Back azimuth equals forward azimuth ± 180°."},{az:"Mülki Müdafiə fövqəladə hallarda əhalinin, təsərrüfat obyektlərinin və ətraf mühitin qorunması sistemidir. Azərbaycan Respublikasında Fövqəladə Hallar Nazirliyi (FHN) tərəfindən idarə olunur. Əsas siqnal: 'Bütün diqqət!' sirenasından sonra radio/TV xəbərdarlıqlarıdır.",ru:"Гражданская Оборона защищает население в чрезвычайных ситуациях. Управляется МЧС Азербайджана. Единый предупредительный сигнал: 'Внимание всем!' (вой сирен с последующим речевым сообщением).",en:"Civil Defense protects populations during disasters and wartime. Supervised by the Ministry of Emergency Situations (MES). Universal warning siren is 'Attention to All!'."},{az:"Nüvə silahının 5 əsas zədələyici amili: 1. Zərbə dalğası (dağıntıların 50%-i); 2. İşıq şüalanması (yanıqlar və yanğınlar, 35%); 3. Nüfuzedici radiasiya (qamma və neytron şüaları, 5%); 4. Radioaktiv çirklənmə (uzunmüddətli zəhərlənmə, 10%); 5. Elektromaqnit impulsu (rabitə və elektronikanın sıradan çıxması).",ru:"5 поражающих факторов ядерного взрыва: Ударная волна (50%), Световое излучение (35%), Проникающая радиация (5%), Радиоактивное заражение (10%) и Электромагнитный импульс (ЭМИ).",en:"5 nuclear blast factors: Shockwave (50%), Thermal radiation (35%), Penetrating radiation (5%), Radioactive fallout (10%), and Electromagnetic Pulse (EMP)."},{az:"Kimyəvi silahlar toksik zəhərləyici maddələrlə (ZM) təchiz olunur. Qruplar: Əsəb-iflicedici (zarin, zoman, V-qazlar), Dəri-iltihablandırıcı (iprit, lüizit), Ümumzəhərləyici (sianid turşusu), Boğucu (fosgen). Mühafizə: əleyhqaz və qoruyucu kostyum dərhal geyinilməlidir.",ru:"Химическое оружие: нервно-паралитические (зарин, заман, V-газы), кожно-нарывные (иприт), общеядовитые (синильная кислота), удушающие (фосген). Защита: немедленное надевание противогаза и ОЗК.",en:"Chemical agents: nerve (sarin, VX), blister (mustard gas), blood (hydrogen cyanide), and choking (phosgene). Protection mandates immediate donning of gas mask and chemical gear."},{az:"Bioloji silahlar xəstəliktörədici mikroblar, bakteriyalar, viruslar və toksinlərdən (qarayara, vəba, tulyaremiya, taun) ibarətdir. İnfeksiya ocağında sərt Karantin (tam təcrid və silahlı mühafizə) və ya Observasiya (tibbi nəzarət) rejimi tətbiq edilir.",ru:"Биологическое оружие использует возбудителей опасных инфекций (сибирская язва, чума, холера, токсины). В очаге поражения вводятся карантин (полная изоляция) или обсервация (медицинское наблюдение).",en:"Biological weapons deploy deadly pathogens (anthrax, plague, cholera). Responses include strict Quarantine (cordon sanitaire) or Observation (medical monitoring)."},{az:"Fərdi mühafizə vasitələri (FMV): Tənəffüs orqanları üçün süzücü əleyhqazlar (GP-5, GP-7) və respiratorlar; Dəri üçün Ümumqoşun Qoruyucu Komplekti (ÜQK/OZK) və L-1 yüngül kostyumu. Əleyhqaz qutusu aktivləşdirilmiş kömür və aerozol süzgəcindən ibarətdir.",ru:"Средства индивидуальной защиты: фильтрующие противогазы (ГП-5, ГП-7) защищают дыхание, глаза и лицо; ОЗК (плащ, чулки, перчатки) и костюм Л-1 защищают кожу от капель ОВ и радиоактивной пыли.",en:"Personal protective equipment (PPE): filtering gas masks (GP-7) shield respiratory tracts and eyes; OZK cloak and L-1 suits shield skin from chemical splashes and radioactive dust."},{az:"Kollektiv mühafizə qurğuları: Sığınacaqlar (tam hermetik, hava təmizləyici süzgəc-ventilyasiya qurğulu, nüvə zərbəsinə və kimyəvi qazlara dözümlü) və Radiasiya əleyhinə daldalanacaqlar (PXR). Şəhər metropoliteni güclü kütləvi sığınacaq rolunu oynayır.",ru:"Убежища — герметичные защитные сооружения с фильтровентиляцией, выдерживающие ударную волну ядерного взрыва. Противорадиационные укрытия (ПРУ) защищают от ионизирующего излучения. Метрополитен служит укрытием.",en:"Bomb shelters provide airtight survival with filtration-ventilation systems shielding from shockwaves and fallout. Radiation shelters attenuate gamma rays. Metro subway stations serve as mass bunkers."},{az:"Mina təhlükəsizliyi: Piyada əleyhinə minalar (PMN basma tipli, OZM qəlpəli sıçrayan) və Tank əleyhinə minalar (TM-62). Qızıl qayda: Partlamamış sursat və ya mina gördükdə toxunmamaq, ətrafına xəbərdarlıq nişanı qoymaq, geri çəkilmək və dərhal 112 (FHN) və ya polisə məlumat vermək!",ru:"Минная безопасность: противопехотные (ПМН, ОЗМ-72) и противотанковые (ТМ-62). Правило трех 'НЕ': НЕ подходить, НЕ трогать, НЕ обезвреживать самостоятельно. Обозначить место и звонить 112.",en:"Mine safety: antipersonnel (PMN pressure, OZM bounding) and antitank mines (TM-62). Golden rule: Never touch or move ordnance; mark the perimeter, retreat via entry tracks, and report to 112."},{az:"Arterial qanaxmada qan fışqırır və al-qırmızı rəngdə olur; jqut yaranın YUXARISINA (ürəyə yaxın) qoyulur və altına vaxt yazılmış qeyd qoyulur (yayda maks. 1 saat, qışda 30-40 dəqiqə). Venoz qanaxmada qan tünd albalı rəngdə aramla axır; sıxıcı steril sarğı kifayətdir.",ru:"Артериальное кровотечение: алая кровь бьет пульсирующей струей. Жгут накладывается ВЫШЕ раны с запиской о времени (лето до 1 часа, зима 30-40 мин). Венозное кровотечение: темная кровь течет плавно, накладывается давящая повязка.",en:"Arterial bleeding: bright red blood spurting pulsatile; tourniquet placed ABOVE wound with timestamp note (max 1h summer, 30-40m winter). Venous bleeding: dark crimson oozing steadily; pressure dressing applied."},{az:"Sümük sınıqlarında əsas məqsəd daşıma zamanı zədələnmiş nahiyəni hərəkətsizləşdirməkdir (immobilizasiya). Qayda: sınıq nahiyəsinə qonşu olan ƏN AZI İKİ OYNAQ hərəkətsizləşdirilməlidir (bud sınığında 3 oynaq: çanaq-bud, diz, aşıq-baldır). Krammer və ya əlaltı vasitələrdən istifadə olunur.",ru:"Транспортная иммобилизация при переломах: фиксируются минимум ДВА смежных сустава (при переломе бедра — три сустава: тазобедренный, коленный, голеностопный). Применяются шины Крамера или подручный материал.",en:"Fracture immobilization mandates immobilizing AT LEAST TWO adjacent joints (femur fracture requires three: hip, knee, ankle) using Cramer wire splints or improvised rigid boards."},{az:"Ürək-ağciyər reanimasiyası (ÜAR): Zərərçəkən sərt yerə arxası üstə uzadılır, tənəffüs yolları təmizlənir. Nisbət: 30 döş qəfəsi sıxması : 2 süni nəfəs. Sıxma dərinliyi böyüklərdə 5-6 sm, sıxma tezliyi dəqiqədə 100-120 dəfə olmalıdır.",ru:"Сердечно-легочная реанимация (СЛР): жесткая поверхность, освобождение дыхательных путей. Универсальное соотношение: 30 компрессий грудной клетки к 2 вдохам. Частота 100-120 в минуту, глубина 5-6 см.",en:"Cardiopulmonary Resuscitation (CPR): firm flat surface, open airway. Standard ratio: 30 chest compressions to 2 rescue breaths. Rate 100-120 per minute, compression depth 5-6 cm."},{az:"Termik yanıqda dərhal soyuq axar su altında 15 dəqiqə soyudulmalıdır. Qovuqları deşmək, yağ və ya maz sürtmək qəti qadağandır! Quru steril sarğı qoyulur. Kimyəvi yanıqlarda reagent 20 dəqiqə bol axar su ilə yuyulur (yanmamış əhəng istisna olmaqla).",ru:"При термических ожогах: охлаждать холодной водой 15 минут. Пузыри не вскрывать, мази и масло не наносить! Наложить сухую стерильную повязку. При химических ожогах смывать водой не менее 20 минут.",en:"Thermal burns: cool under running tap water for 15 minutes. Never pop blisters or apply oil! Dress with dry sterile gauze. Chemical burns: irrigate with running water for 20 minutes."},{az:"Səhra şəraitində şəxsi gigiyena epidemiyaların qarşısını alır. Su yalnız yoxlanılmış mənbələrdən, qaynadılaraq və ya xlorid həbləri (pantotsid) ilə təmizlənərək içilməlidir. Ayaq baxımı və quru corablar ordu marşlarında döyüş qabiliyyətinin qorunması üçün mütləqdir.",ru:"Полевая гигиена: воду обеззараживают кипячением или таблетками пантоцида. Ежедневный уход за ногами и сухие портянки/носки предотвращают потерю боеспособности на марше.",en:"Field sanitation: decontaminate water by boiling or purification tablets (pantocid). Daily foot hygiene and dry socks prevent trench foot and maintain march combat readiness."},{az:"27 sentyabr 2020-ci ildə başlanan 44 günlük Vətən müharibəsi Azərbaycanın parlaq Qələbəsi ilə başa çatdı. Cəbrayıl, Füzuli, Zəngilan, Qubadlı və 8 noyabrda strateji Şuşa şəhəri azad edildi. 10 noyabr bəyanatı ilə Ermənistan kapitulyasiya etdi və Ağdam, Kəlbəcər, Laçın dinc yolla qaytarıldı.",ru:"44-дневная Отечественная война (27 сентября – 10 ноября 2020 г.) завершилась исторической Победой Азербайджана. Освобождены Джебраил, Физули, Зангилан, Губадлы и Шуша (8 ноября). Агдам, Кельбаджар и Лачин возвращены мирным путем по заявлению от 10 ноября.",en:"The 44-Day Patriotic War (Sep 27 – Nov 10, 2020) restored Azerbaijan's territorial integrity. Liberation of Jabrayil, Fuzuli, Zangilan, Gubadli, and Shusha (Nov 8) forced Armenia's capitulation."}],rules:[["Ali Baş Komandan: AR Prezidenti","3 Qoşun növü: Quru, Hərbi Hava, Hərbi Dəniz","Hərbi Doktrina: müdafiə xarakterli"],["Hərbi and bir dəfə ömürlük qəbul edilir","Dövlət Bayrağı önündə təntənəli mərasim","Komandirin əmrinə sözsüz tabeçilik"],["Zabit heyəti: Kiçik, Baş və Ali zabitlər","Gizirlər və Çavuşlar","Rütbələr poqonlarda ulduz və zolaqlarla əks olunur"],["Cəbhə: sıranın ön tərəfi","Cinah: sağ və sol uclar","İnterval: cəbhə boyu məsafə; Distansiya: dərinlik məsafəsi"],["Kalibr: 5.45 × 39 mm","Daraq: 30 patron","Nişangah məsafəsi: 1000 m","Güllənin başlanğıc sürəti: 900 m/s"],["1. Darağı ayır, patronun olmadığını yoxla","2. Qələm qutusunu və şompulu çıxar","3. Qapağı, qaytarıcı mexanizmi, çaxmaq çərçivəsini ayır"],["Arpacıq kəsiyin mərkəzində","Tətiyi nəfəs verərkən aramla sıxmaq","Hədəfin alt mərkəz kənarına tuşlama"],["F-1: müdafiə, 200 m qəlpə radiusu (səngərdən)","RQD-5: hücum, 25 m radius (hərəkətdə)","Partlama ləngiməsi: 3.2 - 4.2 san"],["Plastun üsulu ilə sürünmə (ən təhlükəsiz)","3-5 saniyəlik qısa tirelər","Ərazinin fonuna uyğun maskalanma"],["Kompasın əqrəbi Şimala istiqamətlənir","Qütb ulduzu daima Şimaldadır","Ağac mamırı şimal tərəfdə daha sıxdır"],["Xəritə miqyası: 1:50 000 (1 sm = 500 m)","Relyef horizontallarla göstərilir","Berqştrix: eniş istiqamətini göstərir"],["Azimut: Şimaldan saat əqrəbi üzrə 0°-360° bucaq","A_tərs = A_düz ± 180°","Maneələri keçmə: kompas və addım sayımı"],["Mülki Müdafiə: FHN-in rəhbərliyi altında","Həyəcan siqnalı: 'Bütün diqqət!'","Təxliyə planı və sığınacaqlara toplanma"],["Nüvə partlayışının 5 amili","Zərbə dalğası (50%) və İşıq şüalanması (35%)","Radiasiya, Çirklənmə və Elektromaqnit impulsu"],["Zarin, soman, VX (əsəb-iflicedici)","İprit, lüizit (dəri-iltihablandırıcı)","Əleyhqaz dərhal geyinilməlidir"],["Bioloji təhlükə: vəba, qarayara, botulizm","Karantin: tam təcrid rejimi","Observasiya: gücləndirilmiş tibbi müşahidə"],["GP-7: tənəffüs və gözləri qoruyur","OZK: plaş, çəkmə və əlcəklər","Qoruyucu süzgəcin hermetikliyi"],["Sığınacaq: hava süzücü qurğulu hermetik bunker","PXR: radiasiya əleyhinə daldalanacaq","Metropoliten stansiyaları"],["Piyada əleyhinə: PMN, OZM-72","Tank əleyhinə: TM-62","Toxunma, yerini nişanla, 112-yə xəbər ver"],["Arterial: al-qırmızı fontan → Jqut yuxarıya qoyulur","Venoz: tünd qan axır → Sıxıcı sarğı","Jqut vaxtı: yayda 1 saat, qışda 30-40 dəqiqə"],["Sınıqda ən azı 2 qonşu oynaq hərəkətsizləşdirilir","Bud sınığında 3 oynaq bağlanır","Kramer şini bədən relyefinə uyğun bükülür"],["ÜAR nisbəti: 30 sıxma : 2 nəfəs","Sıxma tezliyi: 100-120 dəqiqədə","Dərinlik: böyüklərdə 5-6 sm"],["Yanıqda: 15 dəqiqə soyuq su axını","Qovuqları deşmək qəti qadağandır","Quru steril sarğı sarınır"],["Səhra gigiyenası: su qaynadılır və ya pantotsidlə təmizlənir","Ayaqların gündəlik baxımı","Dezinfeksiya qaydaları"],["27 sentyabr - 10 noyabr 2020: 44 günlük Zəfər","8 Noyabr: Şuşanın azadlığı və Zəfər Günü","Ərazi bütövlüyü tam bərpa edildi"]]},uy={minTopicIndices:[0,2,4,6,8,10,13,16,18,20,23,24],titles:[{az:"1. İbtidai icma quruluşu və qədim insan düşərgələri (Azıx mağarası)",ru:"1. Первобытнообщинный строй и древнейшие стоянки (Азыхская пещера)",en:"1. Primitive Communal System and Ancient Camps (Azykh Cave)"},{az:"2. Qədim dövlət qurumları və Manna dövləti (İranzu, Ullusunu)",ru:"2. Древнейшие государственные образования и государство Манна",en:"2. Early State Formations and the Kingdom of Manna"},{az:"3. Midiya, Əhəmənilər və Makedoniyalı İsgəndərin yürüşü",ru:"3. Мидия, держава Ахеменидов и походы Александра Македонского",en:"3. Media, Achaemenid Empire and Alexander the Great"},{az:"4. Qədim Atropatena dövləti (Atropat, Antoninin yürüşü, Fraaspa)",ru:"4. Древнее государство Атропатена (Атропат, Антоний, Фрааспа)",en:"4. Ancient Atropatene State (Atropates, Antony's campaign)"},{az:"5. Qafqaz Albaniyası (Urmayr, Cavanşir və Dərbənd səddi)",ru:"5. Кавказская Албания (Урнайр, Джаваншир и Дербентская стена)",en:"5. Caucasian Albania (Urnayr, Javanshir and Derbent wall)"},{az:"6. Ərəb xilafəti dövründə Azərbaycan və Xürrəmilər hərəkatı (Babək)",ru:"6. Азербайджан в составе Арабского халифата и движение Хуррамитов (Бабек)",en:"6. Azerbaijan under Arab Caliphate and the Khurramite Movement (Babak)"},{az:"7. Feodal dövlətləri: Şirvanşahlar, Sacilər, Salarilər, Şəddadilər, Rəvvadilər",ru:"7. Феодальные государства: Государство Ширваншахов, Саджиды, Салариды, Шеддадиды, Раввадиды",en:"7. Feudal States: Shirvanshahs, Sajids, Salarids, Shaddadids, Rawwadids"},{az:"8. Böyük Səlcuq imperiyası və Eldəgizlər (Atabəylər) dövləti",ru:"8. Государство Сельджуков и государство Ильдегизидов (Атабеков)",en:"8. Great Seljuk Empire and the Eldiguzids (Atabegs) State"},{az:"9. Monqol yürüşləri və Hülakülər (Elxanilər) dövrü",ru:"9. Монгольские нашествия и государство Хулагуидов (Ильханов)",en:"9. Mongol Invasions and the Hulegu (Ilkhanate) Period"},{az:"10. Qaraqoyunlu və Ağqoyunlu dövlətləri (Uzun Həsən, Qanunnamə)",ru:"10. Государства Каракоюнлу и Аккоюнлу (Узун Хасан, 'Гануннаме')",en:"10. Qara Qoyunlu and Aq Qoyunlu States (Uzun Hasan, Code of Laws)"},{az:"11. Səfəvilər dövlətinin yaranması: Şah İsmayıl Xətai",ru:"11. Образование государства Сефевидов: Шах Исмаил Хатаи",en:"11. Establishment of the Safavid Empire: Shah Ismail Khatai"},{az:"12. Səfəvilər dövləti XVI-XVII əsrlərdə (Şah I Abbasın islahatları)",ru:"12. Государство Сефевидов в XVI-XVII веках (Реформы Шаха Аббаса I)",en:"12. Safavid Empire in the 16th-17th Centuries (Reforms of Shah Abbas I)"},{az:"13. Nadir şah Əfşar və Əfşarlar imperiyası",ru:"13. Надир-шах Афшар и Афшарская империя",en:"13. Nader Shah Afshar and the Afsharid Empire"},{az:"14. Azərbaycan xanlıqları dövrü (Qarabağ, Quba, Şəki, Bakı xanlıqları)",ru:"14. Период азербайджанских ханств (Карабахское, Губинское, Шекинское, Бакинское)",en:"14. Period of Azerbaijani Khanates (Karabakh, Guba, Shaki, Baku)"},{az:"15. Rusiya-Qacar müharibələri: Gülüstan (1813) və Türkmənçay (1828) müqavilələri",ru:"15. Русско-иранские войны: Гюлистанский (1813) и Туркманчайский (1828) договоры",en:"15. Russo-Persian Wars: Gulistan (1813) and Turkmenchay (1828) Treaties"},{az:"16. Çar Rusiyası dövründə Şimali Azərbaycan: Komendantlıq rejimi və üsyanlar",ru:"16. Северный Азербайджан под властью Российской империи: комендантский режим",en:"16. Northern Azerbaijan under Imperial Russia: Commandant Rule"},{az:"17. XIX əsrin II yarısında neft sənayesi və kapitalizmin inkişafı",ru:"17. Нефтяной бум и развитие капитализма во второй половине XIX века",en:"17. Oil Industry and Capitalist Development in Late 19th Century"},{az:"18. Maarifçilik hərəkatı: M.F.Axundzadə, H.Zərdabi və 'Əkinçi' qəzeti",ru:"18. Просветительское движение: М.Ф.Ахундов, Г.Зардаби и газета 'Экинчи'",en:"18. Enlightenment Movement: M.F. Akhundzade, H. Zardabi, 'Ekinchi'"},{az:"19. XX əsrin əvvəllərində milli oyanış və partiyaların yaranması",ru:"19. Национальное возрождение в начале XX века и создание партий",en:"19. National Revival and Political Parties in Early 20th Century"},{az:"20. Azərbaycan Xalq Cümhuriyyəti (1918-1920): M.Ə.Rəsulzadə və İstiqlal Bəyannaməsi",ru:"20. Азербайджанская Демократическая Республика (1918-1920): М.Э.Расулзаде",en:"20. Azerbaijan Democratic Republic (1918-1920): Independence Declaration"},{az:"21. Aprel işğalı (1920) və Sovet hakimiyyətinin qurulması",ru:"21. Апрельская оккупация (1920) и установление советской власти",en:"21. April Occupation (1920) and Establishment of Soviet Rule"},{az:"22. Azərbaycan II Dünya müharibəsi illərində (Bakı neftinin rolu)",ru:"22. Азербайджан в годы Второй мировой войны (Роль бакинской нефти)",en:"22. Azerbaijan in World War II (Crucial Role of Baku Oil)"},{az:"23. Heydər Əliyevin birinci rəhbərliyi dövrü (1969-1982)",ru:"23. Первый период руководства Гейдара Алиева (1969-1982)",en:"23. First Leadership Period of Heydar Aliyev (1969-1982)"},{az:"24. Dövlət müstəqilliyinin bərpası (1991), 20 Yanvar və 'Əsrin Müqaviləsi' (1994)",ru:"24. Восстановление независимости (1991), 20 Января и 'Контракт века' (1994)",en:"24. Restoration of Independence (1991) and 'Contract of the Century' (1994)"},{az:"25. 44 günlük Vətən müharibəsi (2020) və 2023-cü il antiterror tədbirləri",ru:"25. 44-дневная Отечественная война (2020) и антитеррористические мероприятия 2023 г.",en:"25. 44-Day Patriotic War (2020) and the 2023 Anti-Terror Measures"}],theories:[{az:"Azərbaycan ərazisində ən qədim insan düşərgəsi Füzuli rayonundakı Azıx mağarasıdır (Quruçay mədəniyyəti, 1.2 milyon il əvvəl). 1968-ci ildə arxeoloq Məmmədəli Hüseynov qədim insana ('Azıxantrop') məxsus alt çənə sümüyü aşkar etmişdir. Mezolit dövründə ox və kaman ixtira edilmiş, Qobustan qayaüstü təsvirləri yaranmışdır. Neolitdə istehsal təsərrüfatına keçid baş vermişdir ('neolit inqilabı').",ru:"Азыхская пещера в Физулинском районе — древнейшая стоянка человека (Куручайская культура, 1,2 млн лет назад). В 1968 г. М.Гусейнов нашел нижнюю челюсть азыхантропа. В мезолите изобретены лук и стрелы (наскальные рисунки Гобустана). В неолите произошел переход к производящему хозяйству ('неолитическая революция').",en:"Azykh Cave in Fuzuli is one of the earliest human settlements in Eurasia (Guruchay culture, 1.2 million years old). Discovered by M. Huseynov in 1968 with ancient jawbone ('Azykhanthropus'). Mesolithic saw bow and arrow invention and Gobustan petroglyphs; Neolithic brought farming transition."},{az:"E.ə. IX əsrdə Urmiya gölü hövzəsində Manna dövləti yarandı (paytaxtı İzirtu). Hökmdar İranzunun dövründə mərkəzləşdirilmiş dövlətə çevrildi, canişinlik sistemi yaradıldı. Manna Assuriya ilə müttəfiqlik edər )","Притяжательные (чей? мамин)"],["Количественные (пять, сорок)","Порядковые (пятый, сороковой)","Склонение: 50-80 и 500-900 склоняются обе части"],["Суффиксы -то, -либо, -нибудь и приставка кое- пишутся через дефис"],["I спряжение: -е-, -ут/-ют (брить, стелить)","II спряжение: -и-, -ат/-ят (все на -ить, кроме 2 исключений + 11 глаголов)"],["Причастие: суффиксы -ущ-/-ющ-, -ащ-/-ящ-, -вш-, -нн-","Деепричастие: суффиксы -а/-я, -в, -вши, -вшись"],["Наречия с приставкой по- и суффиксами -ому/-ему/-и пишутся через дефис"],["Предлоги: в течение, в продолжение (на конце е)","Союзы: тоже, также, чтобы (слитно)"],["НЕ с глаголами раздельно (кроме невзлюбить)","НЕ с причастиями раздельно при наличии зависимых слов"],["Согласование: главное и зависимое в одном роде, числе, падеже","Управление: зависимое в определенном падеже","Примыкание: неизменяемое зависимое"],["Тире между подлежащим и сказуемым при нулевой связке, если оба выражены сущ. в им. п."],["Определение (какой? чей?)","Дополнение (вопросы косвенных падежей)","Обстоятельство (где? когда? как?)"],["Определенно-личное (1, 2 лицо)","Неопределенно-личное (3 лицо мн.ч.)","Безличное (нет подлежащего)"],["Запятая между однородными членами при бессоюзии и противительных союзах (а, но)"],["Обращения и вводные слова (конечно, кажется, во-первых) всегда выделяются запятыми"],["Причастный оборот ПОСЛЕ определяемого слова выделяется запятыми"],["ССП: запятая перед и, а, но, однако, да (=но)"],["СПП: придаточное присоединяется союзами что, чтобы, когда, где, который"],["БСП: двоеточие (причина, пояснение), тире (противопоставление, время, условие)"],["Прямая речь: А: 'П'. или 'П', — а."],["Стили: научный, официально-деловой, публицистический, художественный, разговорный"]]},py={minTopicIndices:[0,1,3,5,8,10,13,16,18,20,22,24],titles:[{az:"1. Artikllər: Müəyyən, qeyri-müəyyən və hissə artiklləri (Articles)",ru:"1. Артикли: определенные, неопределенные и частичные",en:"1. Articles: Definite, Indefinite, Partitive"},{az:"2. İsimlər n and Exam Strategies"}],theories:[{az:"Fransız dilində artikllər ismin cinsini (kişi - masculin, qadın - féminin) və kəmiyyətini göstərir. Qeyri-müəyyən: un (kişi), une (qadın), des (cəm). Müəyyən: le, la, l', les. Hissə artikli (du, de la, de l', des) sayılmayan maddə və ərzaqlarla işlədilir (du pain, de l'eau).",ru:"Артикли выражают род и число существительного. Неопределенные: un, une, des. Определенные: le, la, l', les. Частичный артикль (du, de la, de l') употребляется с неисчисляемыми существительными (du lait, de l'eau).",en:"Articles indicate noun gender and number. Indefinite: un, une, des. Definite: le, la, l', les. Partitive articles (du, de la, de l') denote uncounted mass nouns or foods."}],rules:[["Un / Une / Des (qeyri-müəyyən)","Le / La / L' / Les (müəyyən)","Du / De la / De l' (hissə artikli)"],["Qadın cinsi adətən -e sonluğu ilə düzəlir","Cəm adətən -s əlavə edilməklə yaranır (-al → -aux)"],["70 = soixante-dix","80 = quatre-vingts","90 = quatre-vingt-dix"],["Ce, cet, cette, ces (göstərici)","Mon, ton, son, notre, votre, leur (mənsubiyyət)"],["1-ci qrup: -er (-e, -es, -e, -ons, -ez, -ent)","Parler, habiter, aimer"],["Être (suis, es, est, sommes, êtes, sont)","Avoir (ai, as, a, avons, avez, ont)","Aller (vais, vas, va, allons, allez, vont)"],["Je me lave, tu te laves, il se lave, nous nous lavons, vous vous lavez, ils se lavent"],["Ne ... pas (inkar)","Ne ... jamais (heç vaxt)","Ne ... rien (heç nə)","Ne ... personne (heç kəs)"],["Est-ce que tu viens?","Inversiya: Viens-tu?","Où, quand, comment, pourquoi"],["À la maison, en France, au Japon, chez le médecin"],["Passé composé = avoir / être + participe passé","14 hərəkət feli être ilə işlənir (aller, venir, partir)"],["Imparfait: nous formasının kökü + -ais, -ais, -ait, -ions, -iez, -aient"],["Futur simple: infinitiv + -ai, -as, -a, -ons, -ez, -ont","Futur proche: aller + infinitiv"],["COD: me, te, le, la, nous, vous, les","COI: me, te, lui, nous, vous, leur"],["Y: məkan və à + cansız isim","EN: miqdar və de + isim"],["Conditionnel: futur kökü + imparfait sonluqları (-ais, -ait)","Si + imparfait → conditionnel"],["Impératif: Tu, Nous, Vous formaları (-s düşür: Parle!)"],["Plus ... que (daha çox)","Moins ... que (daha az)","Aussi ... que (eyni dərəcədə)"],["Voix passive: être + participe passé (+ par)"],["Qui (mübtəda)","Que (tamamlıq)","Où (yer/vaxt)","Dont (de ilə idarə olunan)"],["Subjonctif: il faut que tu viennes, je veux que..."],["Présent → Imparfait","Passé composé → Plus-que-parfait","Futur → Conditionnel"],["Gérondif: en + participe présent (en parlant)"],["Mais (amma), Donc (buna görə), Parce que (çünki)"],["Mətn suallarında açar sözləri tapmaq və sinonimlərə diqqət yetirmək"]]},by={minTopicIndices:[0,1,3,5,8,10,13,16,18,20,22,24],titles:[{az:"1. Artikllər və Hallanma (Artikel und Kasus: Nominativ, Akkusativ, Dativ, Genitiv)",ru:"1. Артикли и падежи: Nominativ, Akkusativ, Dativ, Genitiv",en:"1. Articles and Cases in German"},{az:"2. İsimlərin cinsi və cəmlənməsi (Geschlecht und Pluralbildung)",ru:"2. Род и образование множественного числа существительных",en:"2. Gender and Plural Formation of Nouns"},{az:"3. Saylar və vaxt anlayışı (Zahlen und Uhrzeit)",ru:"3. Числительные и время в немецком языке",en:"3. Numbers, Quantities and Time Telling"},{az:"4. Əvəzliklər: Şəxs, mənsubiyyət və göstərici (Personal-, Possessivpronomen)",ru:"4. Местоимения всех типов: личные, притяжательные",en:"4. Pronouns: Personal, Possessive, Demonstrative"},{az:"5. İndiki zaman: Zəif və qüvvətli feillərin təsriflənməsi (Präsens)",ru:"5. Настоящее время (Präsens): сильные и слабые глаголы",en:"5. Present Tense (Präsens): Weak and Strong Verbs"},{az:"6. Köməkçi feillər: Sein, Haben, Werden",ru:"6. Вспомогательные глаголы sein, haben, werden",en:"6. Auxiliary Verbs: Sein, Haben, Werden"},{az:"7. Ayrılan və ayrılmayan önşəkilçili feillər (Trennbare und untrennbare Verben)",ru:"7. Глаголы с отделяемыми и неотделяемыми приставками",en:"7. Separable and Inseparable Verbs"},{az:"8. M , -en, -s və umlaut"],["21 = einundzwanzig (təklik əvvəl deyilir)","Uhrzeit: Wie spät ist es?"],["Ich, du, er, sie, es, wir, ihr, sie, Sie","Mein, dein, sein, ihr, unser, euer, ihr"],["Präsens sonluqları: -e, -st, -t, -en, -t, -en","Kök saitinin dəyişməsi: a → ä, e → i/ie"],["sein: bin, bist, ist, sind, seid, sind","haben: habe, hast, hat, haben, habt, haben"],["Ayrılan: ab-, an-, auf-, aus-, ein-, mit-, vor-, zu- (cümlənin sonuna gedir)","Ayrılmayan: be-, ge-, er-, ver-, zer-"],["können (bacarmaq), müssen (məcbur olmaq), dürfen (icazə olmaq), wollen (istəmək)","Əsas feil cümlənin SONUNA infinitivdə gedir"],["sich waschen (yuyunmaq)","Ich wasche mich (Akk), ich wasche mir die Hände (Dat)"],["kein: qeyri-müəyyən və ya artiklsiz isimlərin inkarı","nicht: feil, sifət və müəyyən artiklli isimlər"],["W-Fragen: Was, Wer, Wo, Wohin, Woher, Wann, Warum","Feil 2-ci yerdə durur"],["Dativ tələb edənlər: aus, bei, mit, nach, seit, von, zu","Akkusativ tələb edənlər: durch, für, gegen, ohne, um"],["Wechselpräpositionen: an, auf, hinter, in, neben, über, unter, vor, zwischen","Wohin? (hara?) → Akkusativ | Wo? (harada?) → Dativ"],["Perfekt = haben/sein + Partizip II (ge-...-t / ge-...-en)","sein: hərəkət və hal dəyişməsi (gehen, fahren, aufstehen)"],["Präteritum: war, hatte, konnte, musste, wollte"],["Futur I = werden + Infinitiv (Ich werde lernen)"],["Zəif hallanma: müəyyən artikldən sonra (-e və ya -en)","Qüvvətli hallanma: artikl olmadıqda"],["gut - besser - am besten","viel - mehr - am meisten","gern - lieber - am liebsten"],["Passiv: Das Haus wird gebaut (ev tikilir)","von + Dativ (icraçı tərəfindən)"],["Imperativ: Geh! (du), Geht! (ihr), Gehen Sie! (Sie)"],["weil, dass, wenn, ob, da: FEİL CÜMLƏNİN ƏN SONUNA GEDİR!"],["Relativsätze: der Mann, der dort steht..."],["um ... zu + Infinitiv: məqsəd bildirir (öyrənmək üçün)"],["Konjunktiv II: Wenn ich reich wäre... Ich würde gern reisen"],["DİM mətnlərində sualın kökünü və açar sözlərini düzgün müəyyənləşdirmək"]]},Li=[];function wa onsuz həndəsi silsilə",ru:"11. Геометрическая прогрессия",en:"11. Geometric Progression"},{az:"12. Triqonometriyanın əsas eynilikləri",ru:"12. Основные тригонометрические тождества",en:"12. Trigonometric Identities"},{az:"13. Triqonometrik tənliklər",ru:"13. Тригонометрические уравнения",en:"13. Trigonometric Equations"},{az:"14. Törəmə və tətbiqləri (toxunanın tənliyi)",ru:"14. Производная и её применение",en:"14. Derivatives and Tangent Lines"},{az:"15. İnteqral və əyrixətli trapesiyanın sahəsi",ru:"15. Интеграл и площадь криволинейной трапеции",en:"15. Integrals and Area under Curves"},{az:"16. Üçbucaqlar: tərəf və bucaq münasibətləri",ru:"16. Треугольники: соотношения сторон и углов",en:"16. Triangles: Angle and Side Relations"},{az:"17. Sinuslar və kosinuslar teoremi",ru:"17. Теоремы синусов и косинусов",en:"17. Law of Sines and Cosines"},{az:"18. Dördbucaqlılar və paraleloqram növləri",ru:"18. Четырёхугольники и параллелограммы",en:"18. Quadrilaterals and Parallelograms"},{az:"19. Trapesiyanın xassələri və orta xətti",ru:"19. Трапеция и её средняя линия",en:"19. Trapezoids and Midsegments"},{az:"20. Çevrə, qövs və vətər münasibətləri",ru:"20. Окружность, хорды и касательные",en:"20. Circle, Chords and Tangents"},{az:"21. Həndəsi fiqurların sahələri",ru:"21. Площади плоских фигур",en:"21. Areas of Geometric Figures"},{az:"22. Müstəvidə və fəzada vektorlar",ru:"22. Векторы на плоскости и в пространстве",en:"22. Vectors in 2D and 3D"},{az:"23. Fəza fiqurları: prizma və piramida",ru:"23. Многогранники: призма и пирамида",en:"23. Polyhedra: Prisms and Pyramids"},{az:"24. Fırlanma cisimləri: silindr, konus, kürə",ru:"24. Тела вращения: цилиндр, конус, шар",en:"24. Solids of Revolution: Cylinder, Cone, Sphere"},{az:"25. Kombinatorika və ehtimal nəzəriyyəsi",ru:"25. Комбинаторика и теория вероятностей",en:"25. Combinatorics and Probability"}],theories:[{az:"Faiz ədədin yüzdə bir hissəsidir. Ədədin p faizini tapmaq üçün ədədi p/100-ə vurmaq lazımdır. Ədəd p% artıbsa N·(1 + p/100), azalıbsa N·(1 - p/100) düsturu tətbiq olunur. Nisbət iki kəmiyyətin qismətidir. Tənasübün əsas xassəsi: kənar hədlərin hasili orta hədlərin hasilinə bərabərdir (a/b = c/d ⇒ a·d = b·c).",ru:"Процент — это одна сотая часть числа. Чтобы найти p% от числа N, умножьте N на p/100. При увеличении на p% число умножается на (1 + p/100), при уменьшении — на (1 - p/100). Основное свойство пропорции: произведение крайних членов равно произведению средних (a/b = c/d ⇒ a·d = b·c).",en:"A percentage is one-hundredth of a number. To find p% of N, calculate N · (p/100). An increase of p% multiplies by (1 + p/100), while a decrease multiplies by (1 - p/100). In a proportion a/b = c/d, the product of the extremes equals the product of the means: a · d = b · c."},{az:"Kvadrat tənlik ax² + bx + c = 0 (a ≠ 0) şəklindədir. Diskriminant D = b² - 4ac hesablanır. D > 0 olduqda iki fərqli həqiqi kök var: x = (-b ± √D) / 2a. D = 0 olduqda bir kök (iki bərabər kök): x = -b / 2a. D < 0 olduqda həqiqi kökü yoxdur. Viyet teoreminə görə: x₁ + x₂ = -b/a və x₁ · x₂ = c/a.",ru:"Квадратное уравнение ax² + bx + c = 0 (a ≠ 0). Дискриминант D = b² - 4ac. При D > 0 два корня x = (-b ± √D)/2a. При D = 0 один корень x = -b/2a. При D < 0 действительных корней нет. По теореме Виета сумма корней x₁ + x₂ = -b/a, произведение x₁ · x₂ = c/a.",en:"Quadratic equation ax² + bx + c = 0 (a ≠ 0). Discriminant D = b² - 4ac. If D > 0: two real roots x = (-b ± √D)/(2a). If D = 0: one real root x = -b/(2a). If D < 0: no real roots. By Vieta's Theorem: x₁ + x₂ = -b/a and x₁ · x₂ = c/a."},{az:"Arifmetik silsilədə hər növbəti hədd əvvəlki həddə eyni d (silsilə fərqi) ədədini əlavə etməklə alınır: aₙ = a₁ + (n - 1)d. İstənilən hədd özünə qonşu olan hədlərin ədədi ortasıdır: aₙ = (aₙ₋₁ + aₙ₊₁) / 2. İlk n həddin cəmi: Sₙ = ((a₁ + aₙ) / 2) · n və ya Sₙ = ((2a₁ + (n - 1)d) / 2) · n.",ru:"Арифметическая прогрессия: каждый член равен предыдущему плюс разность d: aₙ = a₁ + (n - 1)d. Любой член является средним арифметическим соседей: aₙ = (aₙ₋₁ + aₙ₊₁)/2. Сумма первых n членов: Sₙ = ((a₁ + aₙ)/2) · n.",en:"Arithmetic progression: each term equals previous plus common difference d: aₙ = a₁ + (n - 1)d. Any term is the arithmetic mean of its neighbors. Sum of first n terms: Sₙ = ((a₁ + aₙ)/2) · n."}],rules:[["p% · N = N · (p / 100)","+p% → N · (1 + p/100)","-p% → N · (1 - p/100)","a/b = c/d ⇒ a · d = b · c"],["D = b² - 4ac","x = (-b ± √D) / 2a","x₁ + x₂ = -b / a","x₁ · x₂ = c / a"],["aₙ = a₁ + (n - 1)d","d = (aₙ - aₖ) / (n - k)","Sₙ = ((a₁ + aₙ) / 2) · n","aₙ = (aₙ₋₁ + aₙ₊₁) / 2"],["ax + b = 0 ⇒ x = -b/a (a ≠ 0)","a₁x + b₁y = c₁ & a₂x + b₂y = c₂","a₁/a₂ ≠ b₁/b₂ ⇒ 1 həll","a₁/a₂ = b₁/b₂ = c₁/c₂ ⇒ sonsuz sayda"],["a > b, c < 0 ⇒ ac < bc","f(x)·g(x) ≥ 0 intervallar üsulu","ax² + bx + c < 0 (a > 0, D > 0) ⇒ x₁ < x < x₂"],["|x| = a (a ≥ 0) ⇒ x = a və ya x = -a","|x| < a ⇒ -a < x < a","|x| > a ⇒ x < -a və ya x > a","√(x²) = |x|"],["aᵐ · aⁿ = aᵐ⁺ⁿ","(aᵐ)ⁿ = aᵐⁿ","a⁻ⁿ = 1 / aⁿ","ⁿ√(aᵐ) = a^(m/n)"],["logₐ(xy) = logₐx + logₐy","logₐ(x/y) = logₐx - logₐy","logₐ(xᵖ) = p · logₐx","a^(logₐb) = b"],["aᶠ(ˣ) = aᵍ(ˣ) ⇔ f(x) = g(x) (a > 0, a ≠ 1)","a > 1: aˣ artandır","0 < a < 1: aˣ azalandır"],["Təyin oblastı: məxrəc ≠ 0, cüt dərəcədən kökaltı ≥ 0","Parabolanın təpə nöqtəsi: x₀ = -b / 2a","f(-x) = f(x) cüt, f(-x) = -f(x) tək"],["bₙ = b₁ · qⁿ⁻¹","bₙ² = bₙ₋₁ · bₙ₊₁","Sₙ = b₁(qⁿ - 1) / (q - 1)","S_sonsuz = b₁ / (1 - q) (|q| < 1)"],["sin²α + cos²α = 1","tg α · ctg α = 1","sin 2α = 2 sin α cos α","cos 2α = cos²α - sin²α = 2cos²α - 1"],["sin x = a (|a| ≤ 1) ⇒ x = (-1)ⁿ arcsin a + πn","cos x = a ⇒ x = ± arccos a + 2πn","tg x = a ⇒ x = arctg a + πn"],["(xⁿ)' = n · xⁿ⁻¹","(u · v)' = u'v + uv'","(u / v)' = (u'v - uv') / v²","Toxunan: y = f(x₀) + f'(x₀)(x - x₀)"],["∫ xⁿ dx = xⁿ⁺¹/(n+1) + C","Nyuton-Leybnis: ∫ₐᵇ f(x)dx = F(b) - F(a)","S = ∫ₐᵇ (f(x) - g(x)) dx"],["Bucaqların cəmi = 180°","Xarici bucaq = qonşu olmayan iki daxili bucağın cəmi","Üçbucaq bərabərsizliyi: |a-b| < c < a+b"],["a / sin A = b / sin B = c / sin C = 2R","c² = a² + b² - 2ab · cos C","S = (1/2) ab · sin C"],["Paraleloqram: S = a · h_a = ab · sin α","Romb: d₁ ⊥ d₂, S = (d₁ · d₂) / 2","Düzbucaqlı: d₁ = d₂, S = a · b"],["Trapesiyanın orta xətti: l = (a + b) / 2","Sahəsi: S = ((a + b) / 2) · h = l · h","Bərabəryanlı trapesiyada oturacağa çəkilən hündürlük"],["Daxilə çəkilmiş bucaq = qövs / 2","Mərkəzi bucaq = qövs","Vətərlər kəsişdikdə: AM · MB = CM · MD","Toxunan və kəsən: AK² = AM · AB"],["Heron düsturu: S = √(p(p-a)(p-b)(p-c))","S = p · r (daxilə çəkilmiş çevrə)","S = abc / (4R) (xaricə çəkilmiş çevrə)"],["|a| = √(x² + y² + z²)","Skalyar hasil: a · b = x₁x₂ + y₁y₂ + z₁z₂","a ⊥ b ⇔ a · b = 0","Kollinar vektorlar: x₁/x₂ = y₁/y₂ = z₁/z₂"],["Prizmanın həcmi: V = S_oturacaq · h","Piramidanın həcmi: V = (1/3) · S_oturacaq · h","Düzgün piramidanın yan səthi: S_yan = (1/2) P · h_apofem"],["Silindr: V = πR²h, S_yan = 2πRh","Konus: V = (1/3)πR²h, S_yan = πRl","Kürə: V = (4/3)πR³, S = 4πR²"],["Pₙ = n!","Aₙᵏ = n! / (n - k)!","Cₙᵏ = n! / (k!(n - k)!)","Klassik ehtimal: P(A) = m / n (əlverişli / ümumi)"]]}),wa("dht",sy),wa("aze",{minTopicIndices:[0,1,3,5,8,12,15,17,20,23],titles:[{az:"1. Fonetika: sait və samit səslər",ru:"1. Фонетика: гласные и согласные звуки",en:"1. Phonetics: Vowels and Consonants"},{az:"2. Ahəng qanunu, heca və vurğu",ru:"2. Закон сингармонизма, слог и ударение",en:"2. Vowel Harmony, Syllables and Stress"},{az:"3. Sözün leksik və qrammatik mənası",ru:"3. Лексическое и грамматическое значение",en:"3. Lexical and Grammatical Meaning"},{az:"4. Sinonimlər, antonimlər və omonimlər",ru:"4. Синонимы, антонимы и омонимы",en:"4. Synonyms, Antonyms and Homonyms"},{az:"5. Frazeoloji birləşmələr (idiomlar)",ru:"5. Фразеологические обороты (идиомы)",en:"5. Phraseological Units (Idioms)"},{az:"6. Sözün tərkibi: kök və şəkilçi növləri",ru:"6. Морфемика: корень и аффиксы",en:"6. Word Structure: Roots and Affixes"},{az:"7. Söz yaradıcılığı üsulları",ru:"7. Способы словообразования",en:"7. Word Formation Methods"},{az ositives"},{az:"24. Mürəkkəb cümlə: tabesiz və tabeli mürəkkəb cümlələr",ru:"24. Сложные предложения: сложносочиненные и сложноподчиненные",en:"24. Compound and Complex Sentences"},{az:"25. Durğu işarələri və nitq üslubları",ru:"25. Пунктуация и стили речи",en:"25. Punctuation and Speech Styles"}],theories:[{az:"Azərbaycan əlifbasında 32 hərf, 34 səs var. 9 sait (qalın: a, ı, o, u; incə: e, ə, i, ö, ü; dodaqlanan: o, u, ö, ü; dodaqlanmayan: a, ı, e, ə, i; açıq və qapalı) və 23 samit hərf vardır. Samitlər cingiltili və kar olmaqla iki qrupa bölünür.",ru:"В азербайджанском алфавите 32 буквы и 34 звука. 9 гласных (твердые, мягкие, огубленные и неогубленные) и 23 согласных (звонкие и глухие).",en:"Azerbaijani alphabet has 32 letters and 34 sounds. 9 vowels (back/front, rounded/unrounded) and 23 consonants (voiced/voiceless)."},{az:"Ahəng qanunu sözdə qalın və ya incə saitlərin bir-birini izləməsidir. Türk mənşəli sözlərin əksəriyyəti ahəng qanununa tabedir. Şəkilçilər iki və ya dörd variantlı olur (-lar/-lər, -çı/-çi/-çu/-çü). Vurğu əksər hallarda sözün son hecasına düşür.",ru:"Закон сингармонизма: гласные в слове гармонируют по ряду (твердые с твердыми, мягкие с мягкими). Аффиксы имеют 2 или 4 варианта. Ударение чаще падает на последний слог.",en:"Vowel harmony: vowels within a word agree in backness/frontness. Suffixes come in 2 or 4 variants (-lar/-lər, -çı/-çi/-çu/-çü). Stress typically falls on the last syllable."}],rules:[["9 sait, 23 samit hərf","Qalın: a, ı, o, u | İncə: e, ə, i, ö, ü","Kar samitlər: p, f, x, t, ş, k, k', ç, h, s, c"],["Ahəng qanunu morfoloji dəyişməni idarə edir","2 cür şəkilçilər: -a / -ə","4 cür şəkilçilər: -ı / -i / -u / -ü"],["Leksik məna: sözün ifadə etdiyi anlayış","Qrammatik məna: aid olduğu nitq hissəsi və forması"],["Sinonimlər: yaxın mənalı sözlər","Antonimlər: əks mənalı sözlər","Omonimlər: yazılışı eyni, mənası tam fərqli"],["Frazeologizmlər bütöv bir cümlə üzvü olur","Tərkib hissələrinə ayrılmır, məcazi mənadadır"]]}),wa("eng",{minTopicIndices:[0,3,4,9,10,11,12,13,17,21],titles:[{az:"1. İndiki Sadə və Davamedici zamanlar (Present Simple & Continuous)",ru:"1. Present Simple и Present Continuous",en:"1. Present Simple & Continuous"},{az:"2. Keçmiş Sadə və Davamedici zamanlar (Past Simple & Continuous)",ru:"2. Past Simple и Past Continuous",en:"2. Past Simple & Continuous"},{az:"3. Gələcək zamanlar və 'be going to' forması",ru:"3. Future Simple и конструкция be going to",en:"3. Future Simple and 'be going to'"},{az:"4. İndiki Bitmiş zaman (Present Perfect & Perfect Continuous)",ru:"4. Present Perfect и Perfect Continuous",en:"4. Present Perfect & Perfect Continuous"},{az:"5. Artikllər: Qeyri-müəyyən (a/an) və Müəyyən (the)",ru:"5. Артикли: a/an и the",en:"5. Articles: a/an and the"},{az:"6. İsimlər, cəmlənmə və kəmiyyət bildirənlər (Countable/Uncountable)",ru:"6. Существительные и слова количества",en:"6. Nouns and Quantifiers"},{az:"7. Əvəzliklər: Şəxs, obyekt, mənsubiyyət və qayıdış əvəzlikləri",ru:"7. Местоимения всех типов",en:"7. Pronouns: Personal, Possessive, Reflexive"},{az:"8. Sifət və Zərf: Müqayisə dərəcələri",ru:"8. Прилагательные и наречия: степени сравнения",en:"8. Adjectives and Adverbs: Comparison"},{az:"9. Zaman və məkan sözönləri (in, on, at, by)",ru:"9. Предлоги времени и места (in, on, at)",en:"9. Prepositions of Time and Place"},{az:"10. Modal feillər (can, could, must, should, have to)",ru:"10. Модальные глаголы (can, must, should)",en:"10. Modal Verbs"},{az:"11. Məchul növ (Passive Voice)",ru:"11. Пассивный залог (Passive Voice)",en:"11. Passive Voice"},{az:"12. Şərt budaq cümlələri (Conditionals: 0, 1, 2, 3)",ru:"12. Условные предложения (Conditionals 0-3)",en:"12. Conditionals (Types 0, 1, 2, 3)"},{az:"13. Vasitəli nitq (Reported Speech) və zamanların uzlaşması",ru:"13. Косвенная речь (Reported Speech)",en:"13. Reported Speech and Backshift"},{az:"14. Cerund və İnfinitiv (Gerund vs Infinitive)",ru:"14. Герундий и инфинитив (Gerund vs Infinitive)",en:"14. Gerund and Infinitive"},{az:"15. Feli sifətlər (Participle I & II)",ru:"15. Причастия (Participle I & II)",en:"15. Participles (V-ing and V3)"},{az:"16. Təyin budaq cümlələri (Relative Clauses: who, which, that)",ru:"16. Определительные придаточные (Relative Clauses)",en:"16. Relative Clauses"},{az:"17. İngilis dilində cümlə və sual quruluşu (Word Order)",ru:"17. Порядок слов и типы вопросов",en:"17. Word Order and Question Formation"},{az:"18. Frazeoloji feillər (Phrasal Verbs)",ru:"18. Фразовые глаголы (Phrasal Verbs)",en:"18. Phrasal Verbs"},{az:"19. Söz yaradıcılığı: prefiks və suffikslər",ru:"19. Словообразование: приставки и суффиксы",en:"19. Word Formation: Prefixes and Suffixes"},{az:"20. Əsas bağlayıcılar və bağlayıcı sözlər (Linking Words)",ru:"20. Соединительные слова (Linking Words)",en:"20. Conjunctions and Discourse Markers"},{az:"21. Qısa cavablar və təsdiq/inkar uzlaşması (So do I / Neither do I)",ru:"21. Краткие ответы (So do I / Neither do I)",en:"21. Agreement: So do I / Neither do I"},{az:"22. Mətni oxuyub-anlama strategiyaları (Reading Comprehension)",ru:"22. Стратегии чтения текста (Reading Comprehension)",en:"22. Reading Comprehension Strategies"},{az:"23. Qapalı və açıq tipli test texnikaları",ru:"23. Техники выполнения тестовых заданий DİM",en:"23. Test-taking Techniques for DIM"},{az:"24. Yazı qaydaları: Esse və Məktub tərtibatı",ru:"24. Правила письма: эссе и письмо",en:"24. Writing Skills: Essay and Letter"},{az:"25. İdiomlar və situativ lüğət ehtiyatı",ru:"25. Идиомы и тематический вокабуляр",en:"25. Idioms and Essential Vocabulary"}],theories:[{az:"Present Simple təkrarlanan vərdişlər və həqiqətlər üçün istifadə olunur (He works every day). Üçüncü şəxsdə feilə -s/-es əlavə olunur. Present Continuous isə danışıq anında baş verən prosesləri bildirir (am/is/are + V-ing). Hissiyyat bildirən stativ feillər (love, know, understand, believe) Continuous zamanlarda işlədilmir.",ru:"Present Simple используется для регулярных действий и фактов (He works every day). В 3-м лице ед. ч. глагол получает -s/-es. Present Continuous выражает действие прямо сейчас (am/is/are + V-ing). Глаголы состояния (know, love, understand) в Continuous не употребляются.",en:"Present Simple expresses habitual actions and facts (He works every day), adding -s/-es for 3rd person singular. Present Continuous describes ongoing actions at speech time (am/is/are + V-ing). Stative verbs (know, want, remember) do not take continuous aspect."}],rules:[["Present Simple: S + V / V-s | Do/Does + S + V?","Present Continuous: am/is/are + V-ing","Stative verbs do NOT take -ing (know, believe, love)"],["Past Simple: S + V-ed / V2 | Did + S + V?","Past Continuous: was/were + V-ing","while + Past Continuous | when + Past Simple"],["will + V (spontaneous decision/prediction)","be going to + V (prior plan/evidence)","Present Continuous for fixed arrangements"],["Present Perfect: have/has + V3","since + point in time | for + duration","already, yet, just, ever, never"],["a/an with singular countable nouns first mentioned","the with unique or specific nouns","No article with plural generalizations & most countries"]]}),wa("his",uy),wa("whi",fy),wa("geo",vy),wa("phy",oy),wa("che",dy),wa("bio",cy),wa("inf",my),wa("lit",hy),wa("rus",yy),wa("fra",py),wa("deu",by);var Ao=[{id:"mat_q1",subjectId:"mat",topicId:"mat_1",question:{az:"350 ədədinin 20%-ni tapın.",ru:"Найдите 20% от числа 350.",en:"Find 20% of 350."},options:[{text:"60",correct:!1},{text:"70",correct:!0},{text:"75",correct:!1},{text:"80",correct:!1}],explanation:{az:"350 · (20 / 100) = 350 · 0.2 = 70.",ru:"350 · (20 / 100) = 350 · 0,2 = 70.",en:"350 · (20 / 100) = 350 · 0.2 = 70."}},{id:"mat_q2",subjectId:"mat",topicId:"mat_1",question:{az:"Malın qiyməti 80 manatdan 25% artırıldı. Yeni qiymət neçə manat oldu?",ru:"Цена товара 80 манатов повысилась на 25%. Какова новая цена?",en:"The price of an 80 AZN item increased by 25%. What is the new price?"},options:[{text:"95",correct:!1},{text:"100",correct:!0},{text:"10
