t:"23",correct:!1},{text:"15",correct:!1}],explanation:{az:"a₅ = a₁ + 4d = 3 + 4 · 4 = 19.",ru:"a₅ = a₁ + 4d = 3 + 4 · 4 = 19.",en:"a₅ = a₁ + 4d = 3 + 16 = 19."}},{id:"mat_q7",subjectId:"mat",topicId:"mat_4",question:{az:"3x - 7 = 11 tənliyini həll edin.",ru:"Решите уравнение 3x - 7 = 11.",en:"Solve the equation 3x - 7 = 11."},options:[{text:"6",correct:!0},{text:"4",correct:!1},{text:"8",correct:!1},{text:"18",correct:!1}],explanation:{az:"3x = 11 + 7 = 18 ⇒ x = 6.",ru:"3x = 18 ⇒ x = 6.",en:"3x = 18 ⇒ x = 6."}},{id:"mat_q8",subjectId:"mat",topicId:"mat_8",question:{az:"log₂ 32 ifadəsinin qiymətini hesablayın.",ru:"Вычислите значение log₂ 32.",en:"Evaluate log₂ 32."},options:[{text:"5",correct:!0},{text:"4",correct:!1},{text:"6",correct:!1},{text:"16",correct:!1}],explanation:{az:"2⁵ = 32 olduğuna görə log₂ 32 = 5.",ru:"Поскольку 2⁵ = 32, log₂ 32 = 5.",en:"Since 2⁵ = 32, log₂ 32 = 5."}},{id:"mat_q9",subjectId:"mat",topicId:"mat_16",question:{az:"Düzbucaqlı üçbucağın katetləri 6 sm və 8 sm-dir. Hipotenuzun uzunluğunu tapın.",ru:"Катеты прямоугольного треугольника равны 6 см и 8 см. Найдите гипотенузу.",en:"The legs of a right triangle are 6 cm and 8 cm. Find the hypotenuse."},options:[{text:"10 cm",correct:!0},{text:"12 cm",correct:!1},{text:"14 cm",correct:!1},{text:"9 cm",correct:!1}],explanation:{az:"Pifaqor teoremi: c = √(6² + 8²) = √(36 + 64) = √100 = 10 sm.",ru:"Теорема Пифагора: c = √(36 + 64) = 10 см.",en:"Pythagorean theorem: c = √(36 + 64) = 10 cm."}},{id:"mat_q10",subjectId:"mat",topicId:"mat_25",question:{az:"Qutuda 3 ağ və 7 qara kürəcik var. Təsadüfən çıxarılan bir kürəciyin ağ olması ehtimalını tapın.",ru:"В коробке 3 белых и 7 черных шаров. Найдите вероятность того, что наугад вынутый шар окажется белым.",en:"A box contains 3 white and 7 black balls. Find the probability of randomly drawing a white ball."},options:[{text:"0.3",correct:!0},{text:"0.7",correct:!1},{text:"0.35",correct:!1},{text:"0.5",correct:!1}],explanation:{az:"P = əlverişli hallar / bütün hallar = 3 / (3 + 7) = 3/10 = 0.3.",ru:"P = m / n = 3 / (3 + 7) = 3/10 = 0,3.",en:"P = favorable / total = 3 / 10 = 0.3."}},{id:"dht_q1",subjectId:"dht",topicId:"dht_1",question:{az:"Azərbaycan Respublikası Silahlı Qüvvələrinin Ali Baş Komandanı kimdir?",ru:"Кто является Верховным Главнокомандующим Вооруженными Силами Азербайджанской Республики?",en:"Who is the Supreme Commander-in-Chief of the Armed Forces of Azerbaijan?"},options:[{text:"Azərbaycan Respublikasının Prezidenti",correct:!0},{text:"Müdafiə Naziri",correct:!1},{text:"Baş Qərargah Rəisi",correct:!1},{text:"Milli Məclisin Sədri",correct:!1}],explanation:{az:"Azərbaycan Respublikası Konstitusiyasına əsasən AR Prezidenti Silahlı Qüvvələrin Ali Baş Komandanıdır.",ru:"Согласно Конституции АР, Президент является Верховным Главнокомандующим Вооруженными Силами.",en:"According to the Constitution of Azerbaijan, the President is the Supreme Commander-in-Chief."}},{id:"dht_q2",subjectId:"dht",topicId:"dht_5",question:{az:"Kalaşnikov avtomatının (AK-74) darağının tutumu neçə patrondur?",ru:"Какова емкость магазина автомата АК-74?",en:"What is the magazine capacity of the AK-74 assault rifle?"},options:[{text:"30",correct:!0},{text:"20",correct:!1},{text:"45",correct:!1},{text:"25",correct:!1}],explanation:{az:"AK-74 avtomatının standart darağının tutumu 30 ədəd 5.45×39 mm-lik patrondur.",ru:"Стандартный секторный магазин АК-74 вмещает 30 патронов калибра 5,45×39 мм.",en:"Standard magazine capacity for the 5.45x39mm AK-74 is 30 rounds."}},{id:"dht_q3",subjectId:"dht",topicId:"dht_8",question:{az:"F-1 əl qumbarası hansı növ qumbaradır və qəlpələrinin yayılma radiusu nə qədərdir?",ru:"К какому типу относится ручная граната Ф-1 и каков радиус разлета ее осколков?",en:"What type is the F-1 hand grenade and what is its fragment dispersion radius?"},options:[{text:"Müdafiə qumbarası, 200 metrədək",correct:!0},{text:"Hücum qumbarası, 25 metrədək",correct:!1},{text:"Tank əleyhinə, 50 metrədək",correct:!1},{text:"İşıq-səs qumbarası, 15 metrədək",correct:!1}],explanation:{az:"F-1 müdafiə tipli qumbaradır, çünki qəlpələrinin dağılma radiusu (200 m) atış məsafəsindən çoxdur və sığınacaqdan atılmalıdır.",ru:"Ф-1 — оборонительная граната с радиусом убойного действия осколков до 200 м.",en:"F-1 is a defensive grenade with an effective fragment lethal radius of up to 200 meters."}},{id:"dht_q4",subjectId:"dht",topicId:"dht_20",question:{az:"Arterial qanaxma zamanı rezin turniket (jqut) necə və hara tətbiq edilir?",ru:"Куда и как накладывается кровоостанавливающий жгут при артериальном кровотечении?",en:"Where and how is a tourniquet applied during arterial bleeding?"},options:[{text:"Yaranın yuxarı tərəfinə (ürəyə yaxın), vaxt qeyd olunmaqla",correct:!0},{text:"Birbaşa yaranın üzərinə",correct:!1},{text:"Yaranın aşağı tərəfinə",correct:!1},{text:"Bütün bədənə sarğı çəkməklə",correct:!1}],explanation:{az:"Arterial qanda təzyiq yüksək olduğu üçün jqut yaranın 3-5 sm yuxarısına qoyulur və altına vaxt kağızı yazılır (yayda 1 saatdan, qışda 30 dəqiqədən çox saxlanmaz).",ru:"Жгут накладывается выше места ранения (ближе к сердцу) с обязательной запиской со временем наложения.",en:"A tourniquet is placed 3-5 cm above the wound (towards heart) with exact application time recorded."}},{id:"dht_q5",subjectId:"dht",topicId:"dht_14",question:{az:"Nüvə partlayışının hansı zədələyici amili elektron cihazları və rabitəni sıradan çıxarır?",ru:"Какой поражающий фактор ядерного взрыва выводит из строя электронику и связь?",en:"Which damaging factor of a nuclear explosion disables electronics and communication?"},options:[{text:"Elektromaqnit impulsu (EMİ)",correct:!0},{text:"Zərbə dalğası",correct:!1},{text:"İşıq şüalanması",correct:!1},{text:"Nüfuzedici radiasiya",correct:!1}],explanation:{az:"Elektromaqnit impulsu yüksək gərginlik dalğası yaradaraq elektrik şəbəkələrini və rabitə qurğularını yandırır.",ru:"Электромагнитный импульс (ЭМИ) генерирует сильные наведенные токи, сжигающие электронику.",en:"Electromagnetic pulse (EMP) creates high-voltage surges that destroy electrical and radio infrastructure."}},{id:"dht_q6",subjectId:"dht",topicId:"dht_22",question:{az:"Ürək-ağciyər reanimasiyası zamanı döş qəfəsinin sıxılması ilə süni nəfəs nisbəti neçədir?",ru:"Каково стандартное соотношение компрессий грудной клетки и искусственных вдохов при СЛР?",en:"What is the standard ratio of chest compressions to rescue breaths in CPR?"},options:[{text:"30 : 2",correct:!0},{text:"15 : 1",correct:!1},{text:"50 : 5",correct:!1},{text:"10 : 2",correct:!1}],explanation:{az:"Müasir beynəlxalq və hərbi ilkin yardım standartına görə nisbət 30:2-dir (dəqiqədə 100-120 sıxma tempi ilə).",ru:"Стандарт сердечно-легочной реанимации для взрослых — 30 нажатий на грудину к 2 вдохам.",en:"The standard CPR protocol for adults is 30 chest compressions followed by 2 rescue breaths."}},{id:"aze_q1",subjectId:"aze",topicId:"aze_1",question:{az:"Hansı bənddəki bütün saitlər incə və dodaqlanmayandır?",ru:"В каком варианте все гласные являются мягкими (переднего ряда) и неогубленными?",en:"In which option are all vowels front and unrounded?"},options:[{text:"e, ə, i",correct:!0},{text:"a, ı, o",correct:!1},{text:"ö, ü, e",correct:!1},{text:"u, ü, i",correct:!1}],explanation:{az:"İncə saitlər: e, ə, i, ö, ü. Onlardan dodaqlanmayanlar: e, ə, i.",ru:"Мягкие неогубленные гласные в азербайджанском языке — это e, ə, i.",en:"Front unrounded vowels in Azerbaijani are e, ə, i."}},{id:"aze_q2",subjectId:"aze",topicId:"aze_2",question:{az:"Hansı sözdə ahəng qanunu pozulmuşdur?",ru:"В каком слове нарушен закон сингармонизма?",en:"In which word is the vowel harmony broken?"},options:[{text:"kitabxana",correct:!0},{text:"məktəblilər",correct:!1},{text:"odunçular",correct:!1},{text:"gözəllik",correct:!1}],explanation:{az:"'kitabxana' sözündə həm incə (i), həm qalın (a) saitlər bir yerdə işləndiyi üçün ahəng qanunu pozulub.",ru:'В слове "kitabxana" соседствуют мягкая "i" и твердая "a", нарушая закон гармонии гласных.',en:'In "kitabxana", both front (i) and back (a) vowels co-occur, violating vowel harmony.'}},{id:"aze_q3",subjectId:"aze",topicId:"aze_9",question:{az:"'Məktəbə' sözü ismin hansı halındadır və hansı suala cavab verir?",ru:'В каком падеже стоит слово "Məktəbə" и на какой вопрос отвечает?',en:'In which case is "Məktəbə" and what question does it answer?'},options:[{text:"Yönlük hal (haraya? nəyə?)",correct:!0},{text:"Təsirlik hal (haranı? nəyi?)",correct:!1},{text:"Yerlik hal (harada? nədə?)",correct:!1},{text:"Çıxışlıq hal (haradan? nədən?)",correct:!1}],explanation:{az:"-ə yönlük halın şəkilçisidir (haraya? məktəbə).",ru:"Окончание -ə выражает дательный (направительный) падеж: haraya? (куда?).",en:'-ə indicates dative case, answering "haraya?" (where to?).'}},{id:"eng_q1",subjectId:"eng",topicId:"eng_1",question:{az:"Cümləni tamamlayın: She usually ___ to the gym on Mondays, but today she ___ at home.",ru:"Заполните пропуски: She usually ___ to the gym on Mondays, but today she ___ at home.",en:"Complete the sentence: She usually ___ to the gym on Mondays, but today she ___ at home."},options:[{text:"goes / is staying",correct:!0},{text:"is going / stays",correct:!1},{text:"go / stay",correct:!1},{text:"went / stayed",correct:!1}],explanation:{az:"'usually' Present Simple (goes), 'today' isə hal-hazırdakı müvəqqəti vəziyyət olduğu üçün Present Continuous (is staying) tələb edir.",ru:"'usually' указывает на регулярность (Present Simple: goes), а 'today' — на временное действие (Present Continuous: is staying).",en:"'usually' signals routine (Present Simple: goes), whereas 'today' indicates a temporary state (Present Continuous: is staying)."}},{id:"eng_q2",subjectId:"eng",topicId:"eng_11",question:{az:'Məchul növə (Passive Voice) çevirin: "Alexander Graham Bell invented the telephone in 1876."',ru:'Преобразуйте в пассивный залог: "Alexander Graham Bell invented the telephone in 1876."',en:'Convert to Passive Voice: "Alexander Graham Bell invented the telephone in 1876."'},options:[{text:"The telephone was invented by Alexander Graham Bell in 1876.",correct:!0},{text:"The telephone is invented in 1876.",correct:!1},{text:"The telephone had been invented by Bell.",correct:!1},{text:"The telephone was being invented in 1876.",correct:!1}],explanation:{az:"Past Simple məchul növü: was/were + V3 (was invented).",ru:"Past Simple в пассиве образуется с помощью was/were + V3 (was invented).",en:"Past Simple Passive form is was/were + V3 (was invented)."}},{id:"eng_q3",subjectId:"eng",topicId:"eng_12",question:{az:"Cümləni tamamlayın: If I ___ enough time tomorrow, I ___ you with your project.",ru:"Вставьте верные формы: If I ___ enough time tomorrow, I ___ you with your project.",en:"Complete the sentence: If I ___ enough time tomorrow, I ___ you with your project."},options:[{text:"have / will help",correct:!0},{text:"will have / help",correct:!1},{text:"had / would help",correct:!1},{text:"have / helped",correct:!1}],explanation:{az:"First Conditional: If + Present Simple, will + V1.",ru:"Первый тип условных предложений: в придаточном с if ставится Present Simple (have), в главном — will + глагол.",en:"First Conditional structure: If + Present Simple (have), main clause with will + V1 (will help)."}},{id:"his_q1",subjectId:"his",topicId:"his_19",question:{az:"Azərbaycan Xalq Cümhuriyyəti (AXC) nə vaxt və harada elan edilmişdir?",ru:"Когда и где была провозглашена Азербайджанская Демократическая Республика (АДР)?",en:"When and where was the Azerbaijan Democratic Republic (ADR) proclaimed?"},options:[{text:"28 may 1918-ci il, Tiflisdə",correct:!0},{text:"18 oktyabr 1991-ci il, Bakıda",correct:!1},{text:"15 sentyabr 1918-ci il, Gəncədə",correct:!1},{text:"28 aprel 1920-ci il, Bakıda",correct:!1}],explanation:{az:'AXC 1918-ci il mayın 28-də Tiflisdə Milli Şura tərəfindən "İstiqlal Bəyannaməsi" ilə elan olunmuşdur.',ru:"АДР была провозглашена 28 мая 1918 года в Тифлисе Национальным советом Азербайджана принятием Декларации независимости.",en:"The ADR was proclaimed on May 28, 1918, in Tiflis by the National Council through the Declaration of Independence."}},{id:"his_q2",subjectId:"his",topicId:"his_24",question:{az:"Şuşa şəhəri hansı tarixdə işğaldan azad edildi və həmin gün Zəfər Günü elan olundu?",ru:"В какую дату город Шуша был освобожден от оккупации, объявленную Днем Победы?",en:"On which date was the city of Shusha liberated, declared as Victory Day?"},options:[{text:"8 noyabr 2020",correct:!0},{text:"27 sentyabr 2020",correct:!1},{text:"10 noyabr 2020",correct:!1},{text:"20 noyabr 2020",correct:!1}],explanation:{az:"Müzəffər Azərbaycan Ordusu 2020-ci il 8 noyabrda Şuşa şəhərini azad etdi. Prezidentin sərəncamı ilə 8 Noyabr Zəfər Günü kimi təsis edildi.",ru:"8 ноября 2020 года город Шуша был освобожден от оккупации. Эта дата установлена как День Победы.",en:"On November 8, 2020, Shusha was liberated. This date is officially celebrated as Victory Day."}},{id:"phy_q1",subjectId:"phy",topicId:"phy_15",question:{az:"Dövrə hissəsində gərginlik 24 V, müqavimət 6 Om olarsa, cərəyan şiddətini hesablayın.",ru:"Напряжение на участке цепи 24 В, сопротивление 6 Ом. Найдите силу тока.",en:"The voltage across a circuit section is 24 V, resistance is 6 Ω. Calculate the current."},options:[{text:"4 A",correct:!0},{text:"144 A",correct:!1},{text:"0.25 A",correct:!1},{text:"18 A",correct:!1}],explanation:{az:"Om qanununa görə: I = U / R = 24 / 6 = 4 A.",ru:"По закону Ома для участка цепи: I = U / R = 24 / 6 = 4 А.",en:"According to Ohm's law: I = U / R = 24 / 6 = 4 A."}},{id:"che_q1",subjectId:"che",topicId:"che_8",question:{az:"Hansı reaksiya zamanı hidrogen qazı (H₂) ayrılır?",ru:"В какой из следующих реакций выделяется газообразный водород (H₂)?",en:"In which reaction is hydrogen gas (H₂) released?"},options:[{text:"Zn + 2HCl → ZnCl₂ + H₂↑",correct:!0},{text:"CuO + 2HCl → CuCl₂ + H₂O",correct:!1},{text:"NaOH + HCl → NaCl + H₂O",correct:!1},{text:"CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O",correct:!1}],explanation:{az:"Aktiv və orta aktiv metallar (Zn) turşularla qarşılıqlı təsirdə olduqda hidrogeni sıxışdırıb çıxarır.",ru:"Цинк вытесняет водород из соляной кислоты: Zn + 2HCl → ZnCl₂ + H₂↑.",en:"Zinc displaces hydrogen from hydrochloric acid: Zn + 2HCl → ZnCl₂ + H₂↑."}},{id:"bio_q1",subjectId:"bio",topicId:"bio_5",question:{az:"Bitki hüceyrəsində fotosintez prosesi hansı orqanoiddə baş verir?",ru:"В каком органоиде растительной клетки протекает процесс фотосинтеза?",en:"In which organelle of a plant cell does photosynthesis take place?"},options:[{text:"Xloroplastlarda",correct:!0},{text:"Mitoxondrilərdə",correct:!1},{text:"Ribosomlarda",correct:!1},{text:"Lizosomlarda",correct:!1}],explanation:{az:"Fotosintez xlorofil piqmentinə malik olan xloroplastlarda işıq enerjisinin kimyəvi rabitə enerjisinə çevrilməsi ilə gedir.",ru:"Фотосинтез происходит в хлоропластах благодаря наличию хлорофилла.",en:"Photosynthesis occurs in chloroplasts containing the green pigment chlorophyll."}},{id:"inf_q1",subjectId:"inf",topicId:"inf_1",question:{az:"İkilik say sistemindəki 1101₂ ədədini onluq say sisteminə çevirin.",ru:"Переведите двоичное число 1101₂ в десятичную систему счисления.",en:"Convert the binary number 1101₂ to decimal."},options:[{text:"13",correct:!0},{text:"11",correct:!1},{text:"15",correct:!1},{text:"9",correct:!1}],explanation:{az:"1101₂ = 1·2³ + 1·2² + 0·2¹ + 1·2⁰ = 8 + 4 + 0 + 1 = 13.",ru:"1·8 + 1·4 + 0·2 + 1·1 = 13.",en:"1·8 + 1·4 + 0·2 + 1·1 = 13."}},{id:"dht_q7",subjectId:"dht",topicId:"dht_5",question:{az:"5.45 mm-lik Kalaşnikov avtomatının (AK-74) nişangah məsafəsi nə qədərdir?",ru:"Какова прицельная дальность стрельбы автомата АК-74 калибра 5,45 мм?",en:"What is the sighting range of the 5.45mm AK-74 assault rifle?"},options:[{text:"1000 m",correct:!0},{text:"500 m",correct:!1},{text:"1500 m",correct:!1},{text:"800 m",correct:!1}],explanation:{az:"AK-74 avtomatının tənzimlənən sektorlu nişangah cədvəli 1000 metr məsafəyə qədər nişan almağa imkan verir.",ru:"Прицельная планка автомата АК-74 нарезана на дальность до 1000 метров.",en:"The sighting range of the AK-74 is graduated up to 1000 meters."}},{id:"dht_q8",subjectId:"dht",topicId:"dht_8",question:{az:"F-1 əl qumbarasının qəlpələrinin təhlükəli dağılma radiusu neçə metrdir?",ru:"Каков радиус убойного действия осколков оборонительной гранаты Ф-1?",en:"What is the lethal fragmentation radius of the F-1 hand grenade?"},options:[{text:"≤ 200 m",correct:!0},{text:"≤ 25 m",correct:!1},{text:"≤ 50 m",correct:!1},{text:"≤ 500 m",correct:!1}],explanation:{az:"F-1 müdafiə qumbarasıdır, qəlpələri 200 metrə qədər uça bildiyi üçün yalnız səngər və ya sığınacaqdan atılmalıdır.",ru:"Ф-1 — оборонительная граната, радиус разлета убойных осколков достигает 200 м, поэтому бросать ее разрешено только из укрытия.",en:"F-1 is a defensive grenade with fragmentation radius up to 200m; it must be thrown strictly from cover."}},{id:"dht_q9",subjectId:"dht",topicId:"dht_20",question:{az:"Arterial qanaxma zamanı qankəsici jqut yaranın harasına qoyulur və yay aylarında maksimum neçə saat qala bilər?",ru:"Куда накладывается кровоостанавливающий жгут при артериальном кровотечении и на какое время летом?",en:"Where is a tourniquet applied during arterial bleeding and for how long in summer?"},options:[{text:"Yaranın yuxarısına (ürəyə tərəf), maksimum 1 saat",correct:!0},{text:"Yaranın aşağısına, maksimum 2 saat",correct:!1},{text:"Birbaşa yaranın üstünə, 30 dəqiqə",correct:!1},{text:"Yaranın yuxarısına, 3 saat",correct:!1}],explanation:{az:"Arterial qanaxmada qan ürəkdən toxumalara getdiyi üçün jqut yaranın yuxarısına qoyulur, toxuma ölməsin deyə yayda maksimum 1 saat, qışda 30-40 dəqiqə saxlanılır.",ru:"При артериальном кровотечении жгут накладывается выше раны. Максимальное время наложения летом — не более 1 часа, зимой — 30-40 минут.",en:"In arterial bleeding, tourniquet is placed proximal (above) the wound for a maximum of 1 hour in summer and 30-40 minutes in winter."}},{id:"dht_q10",subjectId:"dht",topicId:"dht_22",question:{az:"Böyüklərdə ürək-ağciyər reanimasiyası (ÜAR) apararkən döş qəfəsinin sıxılması ilə süni nəfəs vermə nisbəti necədir?",ru:"Каково соотношение компрессий грудной клетки и вдохов при сердечно-легочной реанимации (СЛР) у взрослых?",en:"What is the ratio of chest compressions to rescue breaths during adult CPR?"},options:[{text:"30 : 2",correct:!0},{text:"15 : 1",correct:!1},{text:"5 : 1",correct:!1},{text:"50 : 5",correct:!1}],explanation:{az:"Müasir beynəlxalq və hərbi ilk yardım standartlarına görə tək və ya cüt xilasedici üçün universal nisbət 30:2-dir.",ru:"Согласно современному стандарту СЛР, соотношение составляет 30 надавливаний на грудину к 2 искусственным вдохам.",en:"Standard resuscitation protocol specifies 30 chest compressions followed by 2 breaths."}},{id:"geo_q1",subjectId:"geo",topicId:"geo_18",question:{az:"Azərbaycan Respublikasının ən yüksək zirvəsi hansıdır və hündürlüyü neçə metrdir?",ru:"Какая вершина является наивысшей точкой Азербайджанской Республики и какова ее высота?",en:"What is the highest peak in the Republic of Azerbaijan and what is its elevation?"},options:[{text:"Bazardüzü zirvəsi (4466 m)",correct:!0},{text:"Şahdağ zirvəsi (4243 m)",correct:!1},{text:"Tufandağ zirvəsi (4191 m)",correct:!1},{text:"Qapıcıq zirvəsi (3904 m)",correct:!1}],explanation:{az:"Azərbaycanın ən yüksək nöqtəsi Baş Qafqaz silsiləsində yerləşən Bazardüzü dağıdır (4466 m).",ru:"Высочайшей вершиной Азербайджана является гора Базардюзю (4466 м) на Главном Кавказском хребте.",en:"Mount Bazarduzu (4466 m) on the Greater Caucasus range is the highest peak of Azerbaijan."}},{id:"geo_q2",subjectId:"geo",topicId:"geo_1",question:{az:"1:200 000 miqyaslı xəritədə iki məntəqə arasındakı məsafə 4 sm-dir. Həqiqi məsafə neçə kilometrdir?",ru:"На карте масштаба 1:200 000 расстояние между городами 4 см. Каково реальное расстояние на местности?",en:"On a 1:200,000 scale map, distance between two points is 4 cm. What is the actual distance in km?"},options:[{text:"8 km",correct:!0},{text:"80 km",correct:!1},{text:"0.8 km",correct:!1},{text:"50 km",correct:!1}],explanation:{az:"1:200 000 miqyasında 1 sm = 2 km deməkdir. 4 sm · 2 km = 8 km.",ru:"В масштабе 1:200 000 в 1 см содержится 2 км. 4 · 2 = 8 км.",en:"1:200,000 means 1 cm = 2 km. 4 cm · 2 km = 8 km."}},{id:"geo_q3",subjectId:"geo",topicId:"geo_21",question:{az:"Azərbaycanın ən böyük su anbarı hansıdır və hansı çay üzərində inşa edilmişdir?",ru:"Какое водохранилище является крупнейшим в Азербайджане и на какой реке оно построено?",en:"Which is the largest reservoir in Azerbaijan and on which river is it constructed?"},options:[{text:"Mingəçevir su anbarı, Kür çayı",correct:!0},{text:"Şəmkir su anbarı, Kür çayı",correct:!1},{text:"Araz su anbarı, Araz çayı",correct:!1},{text:"Sərsəng su anbarı, Tərtərçay",correct:!1}],explanation:{az:'Mingəçevir su anbarı ("Qafqaz dənizi") Kür çayı üzərində yerləşir və sahəsi 605 km²-dir.',ru:"Мингечевирское водохранилище построено на реке Кура и является крупнейшим в Закавказье.",en:"Mingachevir reservoir is situated on the Kura River, spanning 605 km²."}},{id:"lit_q1",subjectId:"lit",topicId:"lit_4",question:{az:'Nizami Gəncəvinin "Xəmsə"sinə daxil olan ilk əsər hansıdır?',ru:'Какое произведение является первой поэмой в "Хамсе" ("Пятерице") Низами Гянджеви?',en:`Which work is the first poem in Nizami Ganjavi's "Khamsa" (Quintet)?`},options:[{text:"Sirlər xəzinəsi (Məxzənül-əsrar)",correct:!0},{text:"Xosrov və Şirin",correct:!1},{text:"Leyli və Məcnun",correct:!1},{text:"Yeddi gözəl",correct:!1}],explanation:{az:'Nizami "Xəmsə"sinin ilk əsəri 1174-1175-ci illərdə yazılmış "Sirlər xəzinəsi" fəlsəfi-didaktik poemasıdır.',ru:'Первой поэмой "Хамсе" является дидактическая поэма "Сокровищница тайн" (ок. 1174 г.).',en:'The opening poem of the Khamsa is the philosophical and didactic "Treasury of Mysteries" (ca. 1174).'}},{id:"lit_q2",subjectId:"lit",topicId:"lit_10",question:{az:"Azərbaycan və Şərq dramaturgiyasının əsasını qoyan dramaturq kimdir?",ru:"Кто является основоположником национальной драматургии в Азербайджане и на всем мусульманском Востоке?",en:"Who founded national dramaturgy in Azerbaijan and the wider Muslim East?"},options:[{text:"Mirzə Fətəli Axundzadə",correct:!0},{text:"Cəlil Məmmədquluzadə",correct:!1},{text:"Nəcəf bəy Vəzirov",correct:!1},{text:"Hüseyn Cavid",correct:!1}],explanation:{az:"M.F.Axundzadə 1850-1855-ci illərdə yazdığı 6 komediya ilə Şərqdə dramaturgiyanın əsasını qoymuşdur.",ru:"М.Ф.Ахундов написал 6 бессмертных комедий в 1850-1855 гг., заложив основы театрального искусства Востока.",en:"M.F. Akhundzade authored six landmark comedies between 1850-1855, establishing dramaturgy across the East."}},{id:"whi_q1",subjectId:"whi",topicId:"whi_10",question:{az:"Konstantinopol şəhəri neçənci ildə Osmanlı sultanı II Mehmed tərəfindən fəth edilmişdir?",ru:"В каком году Константинополь был взят османским султаном Мехмедом II Фатихом?",en:"In which year was Constantinople conquered by Ottoman Sultan Mehmed II?"},options:[{text:"1453-cü il",correct:!0},{text:"1389-cu il",correct:!1},{text:"1517-ci il",correct:!1},{text:"1492-ci il",correct:!1}],explanation:{az:"29 may 1453-cü ildə Konstantinopol fəth edildi, Bizans imperiyası süqut etdi və şəhər İstanbul adlandırıldı.",ru:"29 мая 1453 года пал Константинополь, что ознаменовало конец Византийской империи и Средневековья.",en:"On May 29, 1453, Constantinople fell to Sultan Mehmed II, ending the Byzantine Empire."}},{id:"whi_q2",subjectId:"whi",topicId:"whi_16",question:{az:"Böyük Fransa burjua inqilabı hansı hadisə ilə başlanmışdır?",ru:"С какого события началась Великая французская буржуазная революция?",en:"Which historic event marked the beginning of the French Revolution?"},options:[{text:"14 iyul 1789-cu ildə Bastiliya qalasının alınması ilə",correct:!0},{text:"Napoleon Bonapartın dövlət çevrilişi ilə",correct:!1},{text:"Kral XVI Lüdovikin edam edilməsi ilə",correct:!1},{text:"Vaterloo döyüşü ilə",correct:!1}],explanat     const k = [root.lang, p].map(x => (x || '').slice(0, 2)).find(x => T[x]) || 'ru'; return T[k]; };
  const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k]);

  /* ----- helpers ----- */
  const $ = id => document.getElementById(id);
  const viewSig = () => { const h = document.querySelector('main h1,main h2'); return h ? h.textContent.trim().slice(0, 40) : ''; };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const logAct = (a, l) => { const L = userState.completedActions; const last = L[L.length - 1];
    if (last && last.a === a && last.l === l && Date.now() - last.t < 800) return;
    L.push({ t: Date.now(), a, l, v: viewSig() }); if (L.length > 200) L.splice(0, L.length - 200); };
  function syncApp() {                      // mirror the app's own progress (read-only)
    try {
      const g = userState.progress, p = JSON.parse(localStorage.getItem('dim_user_profile_v2') || 'null'), q = JSON.parse(localStorage.getItem('dim_quiz_attempts_v2') || 'null');
      if (p) { g.completedTopics = (p.completedTopics || []).length; g.bookmarks = (p.bookmarks || []).length; g.streakDays = p.streakDays || 0; }
      if (Array.isArray(q)) g.quizAttempts = q.length;
    } catch (e) {}
  }
  function trackView() {

    if (s && s !== g.lastView) { g.lastView = s; g.views[s] = (g.views[s] || 0) + 1; logAct('view', s); saveState(); }
  }

  /* ----- visit bookkeeping ----- */
  loadState();
  prevVisit = userState.lastVisit;
  let counted = false;
  try { counted = sessionStorage.getItem('dim_sess') === '1'; sessionStorage.setItem('dim_sess', '1'); } catch (e) {}
  if (!counted) userState.visitCount += 1;                     // once per browser session, not per reload
  const now = new Date().toISOString();
  userState.firstVisit = userState.firstVisit || now;
  userState.lastVisit = now;
  saveState();

  /* ----- UI ----- */
  const ui = document.createElement('div');
  ui.className = 'dmx-ui'; ui.id = 'dmx-ui';
  ui.innerHTML = '<button type="button" class="dmx-me" id="dmx-me" aria-haspopup="true" aria-expanded="false"><span class="dmx-av" id="dmx-av"></span><span class="dmx-nm" id="dmx-nm"></span></button>'
    + '<div class="dmx-menu" id="dmx-menu" role="menu" data-lenis-prevent><div class="dmx-mh" id="dmx-mh"></div><div class="dmx-ms" id="dmx-ms"></div><button type="button" class="dmx-mi" id="dmx-edit" role="menuitem"></button><button type="button" class="dmx-mi dmx-danger" id="dmx-reset" role="menuitem"></button></div>'
    + '<div class="dmx-toast" id="dmx-toast" role="status" aria-live="polite"><b id="dmx-t1"></b><span id="dmx-t2"></span></div>'
    + '<div class="dmx-dlg" id="dmx-dlg" role="dialog" aria-modal="true" aria-labelledby="dmx-dt" data-lenis-prevent><form class="dmx-card" id="dmx-form"><h3 id="dmx-dt"></h3><p id="dmx-dx"></p><input id="dmx-in" maxlength="40" autocomplete="given-name"><div class="dmx-row"><button type="button" class="dmx-b2" id="dmx-no"></button><button type="submit" class="dmx-b1" id="dmx-ok"></button></div></form></div>';
  document.body.appendChild(ui);

  const cleanName = s => s.replace(/\s+/g, ' ').trim().slice(0, 40);
  function renderPill() {
    const t = tr(), n = userState.userName;
    $('dmx-av').textContent = n ? n.charAt(0).toUpperCase() : '☺';
    $('dmx-nm').textContent = n || t.guest;
    $('dmx-me').setAttribute('aria-label', n || t.guest);
  }
  function renderMenu() {
    const t = tr(), n = userState.userName, g = userState.progress; syncApp();
    $('dmx-mh').textContent = n || t.guest;
    const d = prevVisit ? new Date(prevVisit).toLocaleString(t.loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
    $('dmx-ms').innerHTML = '';
    [fmt(t.visits, { v: userState.visitCount }) + ' · ' + fmt(t.last, { d }), fmt(t.stats, { t: g.completedTopics, m: Math.round(g.activeSeconds / 60) })]
      .forEach(x => { const r = document.createElement('div'); r.textContent = x; $('dmx-ms').appendChild(r); });
    $('dmx-edit').textContent = n ? t.edit : t.setName; $('dmx-reset').textContent = t.reset;
  }
  const menu = $('dmx-menu'), pill = $('dmx-me');
  const setMenu = on => { if (on) renderMenu(); menu.classList.toggle('on', on); pill.setAttribute('aria-expanded', String(on)); };

  let dlgCb = null, lastFocus = null;
  const dlg = $('dmx-dlg'), inp = $('dmx-in');
  function openDlg(o) {
    const t = tr(); lastFocus = document.activeElement; dlgCb = o;
    $('dmx-dt').textContent = o.title; $('dmx-dx').textContent = o.text;
    inp.hidden = !o.input; inp.value = o.value || ''; inp.placeholder = t.ph;
    $('dmx-no').textContent = o.no; $('dmx-ok').textContent = o.ok; $('dmx-ok').classList.toggle('danger', !!o.danger);
    dlg.classList.add('on'); setMenu(false);
    if (lenis) lenis.stop();
    setTimeout(() => (o.input ? inp : $('dmx-no')).focus(), 60);
  }
  function closeDlg(skip) {
    const cb = dlgCb; dlgCb = null; dlg.classList.remove('on');
    if (lenis && !introOn()) lenis.start();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    if (skip && cb && cb.onNo) cb.onNo();
  }
  $('dmx-form').addEventListener('submit', e => { e.preventDefault(); const cb = dlgCb; if (!cb) return; const v = cleanName(inp.value); closeDlg(false); cb.onOk(v); });
  $('dmx-no').addEventListener('click', () => closeDlg(true));
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(true); });

  function toast(a, b) {
    const el = $('dmx-toast'); $('dmx-t1').textContent = a; $('dmx-t2').textContent = b || '';

  }
  function editName(first) {
    const t = tr();
    openDlg({ input: true, value: userState.userName, title: first ? t.askT : t.editT, text: first ? t.askX : t.editX, ok: t.save, no: first ? t.skip : t.cancel,
      onOk: v => { userState.userName = v; userState.nameAsked = true; logAct('name', v ? 'set' : 'cleared'); saveState(); renderPill(); if (v) toast(fmt(t.met, { n: v })); },
      onNo: () => { if (first) { userState.nameAsked = true; saveState(); } } });

  function resetAll() {

  /* ----- scroll: debounced save (300 ms) + restore after intro/DOM/animations ----- */
  const saveScroll = debounce(() => { if (!canSave) return; userState.scrollPosition = Math.round(window.scrollY); userState.scrollView = viewSig(); saveState(); }, 300);
  window.addEventListener('scroll', saveScroll, { passive: true });
  const flushNow = () => { if (resetting) return; if (canSave) { userState.scrollPosition = Math.round(window.scrollY); userState.scrollView = viewSig(); } syncApp(); saveState(); };

  }

  /* ----- form fields: remember + restore (works with React-controlled inputs) ----- */

  const fKey = el => { const q = el.tagName.toLowerCase() + (el.type && el.tagName === 'INPUT' ? '[type="' + el.type + '"]' : '');
    return [viewSig(), el.tagName, el.type || '', el.id || el.name || el.getAttribute('aria-label') || el.placeholder || '', [...document.querySelectorAll(q)].indexOf(el)].join('|'); };

    const el = e.target; if (!el.matches || !el.matches(FSEL) || el.closest('.dmx-ui')) return;
    const F = userState.fields, k = fKey(el); el.__dmxF = 1;
    F[k] = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : String(el.value).slice(0, 500);

  document.addEventListener('change', onField, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1 || n.closest('.dmx-ui') || n.closest('#dimIntro')) return;

  }))).observe(document.body, { childList: true, subtree: true });

  /* ----- completed actions: clicks + view changes ----- */
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button,a[href],[role=button],summary');
    if (!b || b.closest('.dmx-ui') || b.closest('#dimIntro')) return;
    const l = (b.getAttribute('aria-label') || b.title || b.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!l) return;
    userState.progress.clicks += 1; logAct('click', l); saveState();
    setTimeout(trackView, 450);
  }, true);
  setInterval(() => { if (!document.hidden && canSave) { userState.progress.activeSeconds += 15; syncApp(); saveState(); } }, 15000);

  /* ----- boot: wait for intro + load, let entrance animations settle, then restore ----- */
  const introGone = new Promise(res => { const iv = setInterval(() => { if (!introOn()) { clearInterval(iv); res(); } }, 150); });
  const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => window.addEventListener('load', r, { once: true }));
  Promise.all([introGone, loaded]).then(() => setTimeout(() => {
    document.querySelectorAll(FSEL).forEach(applyField);
    restoreScroll(); trackView();
    setTimeout(() => {
      const t = tr(), n = userState.userName;
      if (!n && !userState.nameAsked) editName(true);
      else if (n) toast(fmt(t.hello, { n }), prevVisit ? fmt(t.last, { d: new Date(prevVisit).toLocaleString(t.loc, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) }) : '');
    }, 500);
  }, 900));
})();

    en:{lv:['Rookie','Student','Practitioner','Expert','Pro','DIM Master'],title:'Progress',level:'Level',xp:'XP',streak:'Streak',days:'d',tests:'Tests',solved:'Questions',best:'Best',next:'{x} XP to “{n}”',max:'Max level reached!',badges:'Achievements',share:'Share',close:'Close',copied:'Copied to clipboard',got:'New achievement!',gain:'+{x} XP',up:'Level up: {n}!',st:'My progress in DIM Exam Prep Pro: {l}, {x} XP, {s}-day streak, {b}/9 badges.',
      b:{first:['First step','Complete 1 test'],t5:['Warm-up','5 tests'],t25:['Marathoner','25 tests'],perfect:['Perfect','100% on a test'],s3:['3 days','3-day streak'],s7:['Week','7-day streak'],q100:['Hundred','100 questions'],exam:['Exam passed','Exam at 70%+'],top:['Master','Reach DIM Master']}}
  };

  var btn=document.createElement('button');btn.type='button';btn.className='dmx-xp';btn.id='dmx-xp';
  var gp=document.createElement('div');gp.className='dmx-gp';gp.setAttribute('role','dialog');gp.setAttribute('aria-modal','true');gp.setAttribute('data-lenis-prevent','');
  var toastEl=document.getElementById('dmx-toast'),tT;
  function toast(a,b){toastEl=document.getElementById('dmx-toast');if(!toastEl)return;
    var t1=document.getElementById('dmx-t1'),t2=document.getElementById('dmx-t2');if(!t1)return;
    t1.textContent=a;t2.textContent=b||'';toastEl.style.opacity='1';toastEl.style.translate='-50% 0';
    clearTimeout(tT);tT=setTimeout(function(){toastEl.style.opacity='';toastEl.style.translate=''},3500)}
  function render(){
    var t=tx(),i=level(G.xp),st=streak();
    btn.innerHTML='<i>⚡</i>'+G.xp+' XP <i>🔥</i>'+st;
    btn.setAttribute('aria-label',t.title);
    var nxt=i<5?LV[i+1]:null,pct=nxt?Math.round((G.xp-LV[i])/(nxt-LV[i])*100):100;
    var bd=ORDER.map(function(k){var on=!!G.badges[k];return '<div class="dmx-bd '+(on?'on':'off')+'"><span>'+ICON[k]+'</span><b>'+t.b[k][0]+'</b><br>'+t.b[k][1]+'</div>'}).join('');
    gp.innerHTML='<div class="dmx-gc"><h3>'+t.title+'</h3><div class="dmx-lv"><span>'+t.level+' '+(i+1)+' · '+t.lv[i]+'</span><span>'+G.xp+' '+t.xp+'</span></div><div class="dmx-bar"><b style="width:'+pct+'%"></b></div><div class="dmx-sub">'+(nxt?f(t.next,{n:t.lv[i+1],x:nxt-G.xp}):t.max)+'</div>'
     +'<div class="dmx-st"><div><b>'+st+'</b>'+t.streak+' ('+t.days+')</div><div><b>'+G.tests+'</b>'+t.tests+'</div><div><b>'+G.solved+'</b>'+t.solved+'</div></div>'
     +'<h3 style="font-size:14px;margin-bottom:8px">'+t.badges+' '+Object.keys(G.badges).length+'/9</h3><div class="dmx-bg9">'+bd+'</div>'
     +'<div class="dmx-ga"><button type="button" class="p" id="dmx-sh">'+t.share+'</button><button type="button" class="s" id="dmx-cl">'+t.close+'</button></div></div>';
  }
  function open(){render();gp.classList.add('on');var c=document.getElementById('dmx-cl');if(c)c.focus()}
  function close(){gp.classList.remove('on');btn.focus()}
  function share(){
    var t=tx(),text=f(t.st,{l:t.lv[level(G.xp)],x:G.xp,s:streak(),b:Object.keys(G.badges).length});
    var data={title:'DIM Exam Prep Pro',text:text};
    try{if(/^https?:/.test(location.href))data.url=location.href}catch(e){}
    function copy(){
      var done=function(){toast(t.copied,text)};
      try{navigator.clipboard.writeText(text).then(done,function(){fallback()})}catch(e){fallback()}
      function fallback(){try{var a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(e){toast(text)}}
    }
    if(navigator.share){navigator.share(data).catch(function(e){if(e&&e.name!=='AbortError')copy()})}else copy();
  }
  gp.addEventListener('click',function(e){if(e.target===gp||e.target.id==='dmx-cl')close();else if(e.target.id==='dmx-sh')share()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&gp.classList.contains('on'))close()});
  btn.addEventListener('click',open);
  function mount(){document.body.appendChild(btn);document.body.appendChild(gp);render();sync(false)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
  /* detect new attempts: patch setItem (same tab) + storage event (other tabs) + safety poll */
  try{var o=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){var r=o.apply(this,arguments);if(k===AT)setTimeout(function(){sync(false)},350);return r}}catch(e){}
  window.addEventListener('storage',function(e){if(e.key===AT||e.key===null)sync(false)});
  setInterval(function(){if(!document.hidden)sync(false)},20000);
  new MutationObserver(function(){render()}).observe(root,{attributes:true,attributeFilter:['lang']});
  window.addEventListener('storage',function(e){if(e.key==='dim_lang_pref')render()});
  window.dimGame={get:function(){return G},sync:sync,open:open};
})();
</script>
<script>
/* ===== DIM v12: Phase 4 — PWA (service worker needs http/https; skipped on file://) ===== */
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('[pwa] sw not registered:',e&&e.message)})});
})();
</script>
