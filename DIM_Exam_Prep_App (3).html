        });

        window.onload = () => {
            if(!prof) { prof = { name: "Tələbə", group: "Выпускной (9-11 класс)", subjects: ["mat","rus","lit","whi","aze","phy","che"] }; localStorage.setItem('dim_p', JSON.stringify(prof)); }
            applyTheme(); setLang(lang); boot();
        };

        function applyTheme() {
            document.documentElement.classList.toggle('light', !dark);
            document.getElementById('th-icon').innerText = dark ? '☀️' : '🌙';
        }
        function toggleTheme(ev) {
            const go = () => { dark = !dark; localStorage.setItem('dim_t', dark ? 'dark' : 'light'); applyTheme(); };
            const root = document.documentElement;
            if(!document.startViewTransition || RM || !ev){ go(); return; }
            const r = ev.currentTarget.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
            const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
            root.classList.add('notrans');
            const vt = document.startViewTransition(go);
            vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`] }, { duration: 750, easing: 'cubic-bezier(.16,1,.3,1)', pseudoElement: '::view-transition-new(root)' }));
            vt.finished.finally(() => root.classList.remove('notrans'));
        }
        
        function setLang(l) {
            lang = l; localStorage.setItem('dim_l', l);
            ['az','ru','en'].forEach(x => { const btn = document.getElementById('l-'+x); if(btn) btn.className = `lang-btn ${x===l?'active':''}`; });
            document.getElementById('l-prof').innerText = i18n[l].prof;
            document.getElementById('m-title').innerText = i18n[l].mTitle;
            document.getElementById('m-sub').innerText = i18n[l].mSub;
            document.getElementById('l-n').innerText = i18n[l].lName;
            document.getElementById('l-g').innerText = i18n[l].lGroup;
            document.getElementById('l-s').innerText = i18n[l].lSubs;
            document.getElementById('b-save').innerText = i18n[l].bSave;
            document.getElementById('l-ch').innerText = i18n[l].lChoice;
            document.getElementById('l-th').innerText = i18n[l].lTh;
            document.getElementById('l-th-d').innerText = i18n[l].lThD;
            document.getElementById('l-ts').innerText = i18n[l].lTs;
            document.getElementById('l-ts-d').innerText = i18n[l].lTsD;
            render(document.body.classList.contains('ready'));
        }

        function updateUI() {
            if(!prof) return;
            document.getElementById('u-name').innerText = prof.name;
            document.getElementById('u-group').innerText = prof.group;
            document.getElementById('avatar').innerText = (prof.name[0] || 'T').toUpperCase();
        }

        function openProfile() {
            updateUI();
            openModal('m-profile');
            document.getElementById('i-name').value = prof.name;
            document.getElementById('i-group').value = prof.group;
            const c = document.getElementById('sub-boxes'); c.innerHTML = '';
            Object.keys(subs).forEach(k => {
                const checked = prof.subjects.includes(k) ? 'checked' : '';
                c.innerHTML += `<label style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;cursor:pointer;"><input type="checkbox" value="${k}" ${checked}> ${subs[k].icon} ${subs[k].name[lang]}</label>`;
            });
        }

        function saveProf(e) {
            e.preventDefault();
            const subsArr = [];
            document.querySelectorAll('#sub-boxes input:checked').forEach(i => subsArr.push(i.value));
            if(!subsArr.length) return alert("Выберите предмет!");
            prof = { name: document.getElementById('i-name').value.trim(), group: document.getElementById('i-group').value, subjects: subsArr };
            localStorage.setItem('dim_p', JSON.stringify(prof));
            closeModal('m-profile');
            updateUI(); if(!subsArr.includes(activeTab)) activeTab = subsArr[0];
            render();
        }

        /* ===== helpers ===== */
        const $ = id => document.getElementById(id);
        const plain = t => t.replace(/^(\d+\.)\s+\S+\s/, '$1 ');
        const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches && !RM;
        L3.ruonly = { ru: '', az: 'Bu mövzunun ətraflı nəzəriyyəsi hələlik rus dilindədir.', en: 'The detailed theory for this topic is currently in Russian only.' };
        L3.empty = { ru: "Здесь пока пусто", az: "Burada hələ heç nə yoxdur", en: "Nothing here yet" };

        function tween(el, from, to, d) {
            if(!el) return;
            if(RM || from === to){ el.textContent = to; return; }
            const t0 = performance.now(), k = el._k = (el._k || 0) + 1;
            (function f(t){ if(el._k !== k) return; const p = Math.min(1, (t - t0) / d); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(f); })(t0);
        }
        const countTo = (el, n, d) => tween(el, 0, n, d);

        const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .1, rootMargin: '0px 0px -5% 0px' });

        /* ===== modals ===== */
        function openModal(id) { $(id).classList.remove('hidden', 'closing'); document.body.classList.add('lock'); }
        function closeModal(id) {
            const m = $(id); if(m.classList.contains('hidden') || m.classList.contains('closing')) return;
            m.classList.add('closing');
            setTimeout(() => { m.classList.add('hidden'); m.classList.remove('closing'); if(!document.querySelector('.modal-overlay:not(.hidden)')) document.body.classList.remove('lock'); }, RM ? 0 : 300);
        }
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('pointerdown', e => { if(e.target === m) closeModal(m.id); }));
        document.querySelectorAll('.choice-btn').forEach(b => { b.tabIndex = 0; b.setAttribute('role', 'button'); });
        document.addEventListener('keydown', e => {
            if(e.key === 'Escape') document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(m => closeModal(m.id));
            if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.topic-row,.mobbin-opt,.tab-chip,.choice-btn')){ e.preventDefault(); e.target.click(); }
        });

        /* ===== smooth scroll (inertia) + scroll effects ===== */
        let sTgt = scrollY, sCur = scrollY, sRaf = 0, lastY = scrollY, fxT = false;
        function jump(y) { sTgt = sCur = y; cancelAnimationFrame(sRaf); sRaf = 0; scrollTo({ top: y, behavior: 'instant' }); }
        function sloop() {
            const d = sTgt - sCur; sCur += d * .11;
            if(Math.abs(sTgt - sCur) < .4) sCur = sTgt;
            scrollTo(0, sCur);
            const m = document.querySelector('.marquee'); if(m) m.style.transform = `skewX(${Math.max(-7, Math.min(7, -d * .035)).toFixed(2)}deg)`;
            if(sCur === sTgt){ sRaf = 0; if(m) m.style.transform = ''; } else sRaf = requestAnimationFrame(sloop);
        }
        if(FINE) {
            addEventListener('wheel', e => {
                if(e.ctrlKey || document.body.classList.contains('lock') || e.target.closest('.tabs-wrapper,#sub-boxes')) return;
                if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
                e.preventDefault();
                if(!sRaf) sTgt = sCur = scrollY;
                const dy = e.deltaMode === 1 ? e.deltaY * 34 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
                sTgt = Math.max(0, Math.min(sTgt + dy, document.documentElement.scrollHeight - innerHeight));
                if(!sRaf) sRaf = requestAnimationFrame(sloop);
            }, { passive: false });
        }
        addEventListener('scroll', () => {
            if(!sRaf){ sTgt = sCur = scrollY; }
            if(fxT) return; fxT = true;
            requestAnimationFrame(() => {
                fxT = false; const y = scrollY, nv = document.querySelector('.top-nav');
                if(y > lastY + 4 && y > 140) nv.classList.add('hide'); else if(y < lastY - 4 || y < 80) nv.classList.remove('hide');
                lastY = y;
                const h = document.querySelector('.hero-banner'); if(h && !RM) h.style.translate = y < 700 ? `0 ${(y * .1).toFixed(1)}px` : '';
            });
        }, { passive: true });

        /* ===== page transition + boot ===== */
        let busy = false;
        function nav(fn) {
            if(RM){ fn(); jump(0); return; }
            if(busy) return; busy = true;
            const c = $('curtain'); c.className = 'in';
            setTimeout(() => { fn(); jump(0); requestAnimationFrame(() => { c.className = 'out'; setTimeout(() => { c.className = ''; busy = false; }, 650); }); }, 500);
        }
        function boot() {
            const pre = $('pre'); let seen = false;
            try { seen = sessionStorage.getItem('dim_seen'); } catch(e) {}
            if(RM || seen){ pre.remove(); requestAnimationFrame(() => document.body.classList.add('ready')); return; }
            try { sessionStorage.setItem('dim_seen', '1'); } catch(e) {}
            tween($('pre-n'), 0, 100, 1000);
            setTimeout(() => { pre.classList.add('out'); setTimeout(() => document.body.classList.add('ready'), 350); setTimeout(() => pre.remove(), 1100); }, 1150);
        }

        /* ===== cursor + magnet (rAF-throttled, sleeps when idle) ===== */
        if(FINE) {
            const cur = $('cur'), HOT = 'button,.topic-row,.mobbin-opt,.tab-chip,.choice-btn,label,input,select', MAG = '.btn-icon,.btn-primary,.choice-btn';
            let x = -100, y = -100, cx = -100, cy = -100, tgt = null, mag = null, run = false, pend = false;
            const frame = () => { cx += (x - cx) * .22; cy += (y - cy) * .22; cur.style.transform = `translate3d(${cx}px,${cy}px,0)`; if(Math.abs(x - cx) > .1 || Math.abs(y - cy) > .1) requestAnimationFrame(frame); else run = false; };
            document.addEventListener('pointermove', e => {
                x = e.clientX; y = e.clientY; tgt = e.target;
                if(!run){ run = true; requestAnimationFrame(frame); }
                if(pend) return; pend = true;
                requestAnimationFrame(() => {
                    pend = false; if(!tgt || !tgt.closest) return;
                    cur.classList.toggle('big', !!tgt.closest(HOT));
                    const m = tgt.closest(MAG);
                    if(mag && mag !== m){ mag.style.setProperty('--mx', '0px'); mag.style.setProperty('--my', '0px'); }
                    mag = m;
                    if(m){ const r = m.getBoundingClientRect(), ox = parseFloat(m.style.getPropertyValue('--mx')) || 0, oy = parseFloat(m.style.getPropertyValue('--my')) || 0;
                        m.style.setProperty('--mx', (x - (r.left - ox) - r.width / 2) * .22 + 'px'); m.style.setProperty('--my', (y - (r.top - oy) - r.height / 2) * .35 + 'px'); }
                });
            }, { passive: true });
            document.addEventListener('pointerdown', () => cur.classList.add('down'));
            document.addEventListener('pointerup', () => cur.classList.remove('down'));
        }

        function afterRender(st) {
            const app = $('app'); st = st || RM;
            app.querySelectorAll('.sp').forEach(el => {
                if(el.dataset.s) return; el.dataset.s = 1;
                el.innerHTML = el.textContent.trim().split(/\s+/).map((w, i) => `<span class="w"><span style="transition-delay:${i * .06}s">${w}</span></span>`).join(' ');
            });
            app.querySelectorAll('.rv,.sp').forEach(el => { if(st){ el.classList.add('in', 'nr'); } else io.observe(el); });
        }

        /* ===== quiz engine ===== */
        let Q = [], ans = [], qSrc = null, qN = 10;
        function shuffle(a) { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
        function makeQs(tp, n) {
            if(tp && tp.real) return shuffle(tp.real).map(([q, o, c, e]) => ({ q, e, opts: shuffle(o.map((t, i) => ({ text: t, correct: i === c }))) }));
            return Array.from({ length: n }, (_, i) => ({
                demo: true, e: null,
                q: tp ? tp.quizzes[i % tp.quizzes.length].q : `DİM`,
                opts: shuffle([1, 2, 3, 4].map((j, k) => ({ text: `Variant ${j}`, correct: k === 0 })))
            }));
        }
        const qText = q => { const v = typeof q.q === 'object' ? q.q[lang] : q.q; return q.demo ? v.replace(/^\d+\.\s*/, '') : v; };
        function startQuiz() { Q = makeQs(qSrc ? findTopic() : null, qN); ans = Q.map(() => null); }
        function paint(qi, oi) {
            const card = $('q' + qi); if(!card) return;
            card.querySelectorAll('.mobbin-opt').forEach((el, i) => {
                el.classList.add('locked'); el.removeAttribute('tabindex');
                if(Q[qi].opts[i].correct) el.classList.add('correct'); else if(i === oi) el.classList.add('wrong');
            });
            card.querySelector('.exp').classList.add('open');
        }
        function pick(qi, oi) { if(ans[qi] !== null) return; ans[qi] = oi; paint(qi, oi); score(); }
        function score() {
            const done = ans.filter(a => a !== null).length, ok = ans.filter((a, i) => a !== null && Q[i].opts[a].correct).length;
            const b = $('qb'); if(b) b.style.width = (done / Q.length * 100) + '%';
            const r = $('res'); if(!r || done < Q.length) return;
            r.classList.add('show'); tween($('rn'), 0, ok, 1000); $('rt').textContent = ' / ' + Q.length;
            setTimeout(() => r.scrollIntoView({ behavior: 'smooth', block: 'center' }), 600);
        }
        function retry() { nav(() => { startQuiz(); render(); }); }

        /* ===== navigation ===== */
        function openChoice(id) { selId = id; $('c-title').innerText = findTopic().title[lang]; openModal('m-choice'); }
        function goTheory() { closeModal('m-choice'); nav(() => { view = 'theory'; render(); }); }
        function goTest() { closeModal('m-choice'); nav(() => { view = 'test'; qSrc = selId; qN = 10; startQuiz(); render(); }); }
        function goSub() { nav(() => { view = 'sub_test'; qSrc = null; qN = 20; startQuiz(); render(); }); }
        function goHome() { nav(() => { view = 'roadmap'; render(); }); }
        function findTopic() {
            let res = null;
            Object.keys(topics).forEach(s => { const t = topics[s].find(x => x.id === selId); if(t) res = t; });
            return res;
        }

        /* ===== progress / list (updated in place, no full re-render) ===== */
        function stats() {
            const sl = prof ? prof.subjects : Object.keys(subs); let total = 0, done = 0;
            sl.forEach(s => topics[s].forEach(x => { total++; if(prog[x.id]) done++; }));
            return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
        }
        let shown = { done: 0, pct: 0 };
        function updateProgress() {
            const { total, done, pct } = stats();
            const f = document.querySelector('.progress-fill'); if(f) f.style.width = pct + '%';
            tween($('p-done'), shown.done, done, 700); tween($('p-pct'), shown.pct, pct, 700);
            const tt = $('p-total'); if(tt) tt.textContent = total;
            shown = { done, pct };
        }
        function toggleProgress(id) {
            prog[id] = !prog[id]; localStorage.setItem('dim_prog', JSON.stringify(prog));
            const row = document.querySelector(`.topic-row[data-id="${id}"]`);
            if(row){ row.classList.toggle('completed', !!prog[id]); if(filter === 'done' && !prog[id]){ row.classList.add('leaving'); setTimeout(() => renderList(), 380); } }
            updateProgress();
        }
        function listHTML() {
            const rows = topics[activeTab].map((tp, idx) => {
                const isDone = !!prog[tp.id];
                if(filter === 'min' && !tp.min) return '';
                if(filter === 'done' && !isDone) return '';
                return `
                    <div class="topic-row ${isDone ? 'completed' : ''} rv" data-id="${tp.id}" tabindex="0" role="button" style="--d:${Math.min(idx, 8) * .05}s" onclick="openChoice('${tp.id}')">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <input type="checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleProgress('${tp.id}');" style="width:20px;height:20px;accent-color:var(--accent);">
                            <div>
                                ${tp.min ? '<span class="topic-badge">★ MİNİMUM</span><br>' : ''}
                                <h4 style="font-size:13px;font-weight:700;">${tp.title[lang]}</h4>
                            </div>
                        </div>
                        <span style="color:var(--text-tertiary);font-size:11px;font-weight:600;white-space:nowrap;">${L3.open[lang]} <i class="go" style="font-style:normal">→</i></span>
                    </div>`;
            }).join('');
            return rows || `<p class="note rv" style="padding:28px 6px;text-align:center">${L3.empty[lang]}</p>`;
        }
        function renderList(st) {
            const l = $('list'); if(!l) return;
            l.innerHTML = listHTML();
            l.querySelectorAll('.rv').forEach(el => { if(st || RM) el.classList.add('in', 'nr'); else io.observe(el); });
        }
        function setTab(s) {
            activeTab = s;
            const wrap = $('tabs');
            wrap.querySelectorAll('.tab-chip').forEach(c => { const on = c.dataset.s === s; c.classList.toggle('active', on); if(on) wrap.scrollTo({ left: c.offsetLeft - wrap.clientWidth / 2 + c.clientWidth / 2, behavior: RM ? 'auto' : 'smooth' }); });
            renderList();
        }
        function setFilter(f) { filter = f; ['all', 'min', 'done'].forEach(x => $('f-' + x).classList.toggle('active', x === f)); renderList(); }

        function show(html, st) { const app = $('app'); app.innerHTML = html; afterRender(st); }

        function render(st) {
            const t = i18n[lang];
            updateUI();
            $('qbar').classList.toggle('hidden', !(view === 'test' || view === 'sub_test'));
            const back = `<button onclick="goHome()" class="btn-icon" style="margin-bottom:18px;">${t.back}</button>`;

            if(view === 'theory' && selId) {
                const top = findTopic(), real = !!top.real;
                show(`${back}
                    <div class="artifact-card">
                        <h2 class="page-title sp">${plain(top.title[lang])}</h2>
                        <div style="height:14px"></div>
                        <div class="quiz-card rv"><h4 style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;">${t.secTh}</h4>
                            <p style="font-size:14px;color:var(--text-secondary);line-height:1.7;user-select:text;">${top.theory[lang]}</p>${top.ruOnly && lang !== 'ru' ? `<p class="note" style="margin-top:10px">${L3.ruonly[lang]}</p>` : ''}</div>
                        <div class="quiz-card rv" style="--d:.08s"><h4 style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;">${t.secRl}</h4>
                            ${top.rule ? top.rule.split('~').map(x => `<code class="formula">${x}</code>`).join('') : `<p class="note">${L3.na[lang]}</p>`}</div>
                        <button onclick="goTest()" class="btn-primary rv" style="margin-top:12px;--d:.16s">${t.toQuiz}</button>
                    </div>`, st);
                return;
            }

            if((view === 'test' && selId) || view === 'sub_test') {
                const isSub = view === 'sub_test', top = isSub ? null : findTopic();
                if(!Q.length) startQuiz();
                show(`${back}
                    <div class="artifact-card">
                        <h2 class="page-title sp">${isSub ? `${t.stest} (${subs[activeTab].name[lang]})` : plain(top.title[lang])}</h2>
                        <p style="font-size:12px;color:var(--text-tertiary);margin-bottom:18px;">${isSub ? '' : t.ttest}</p>
                        ${Q.map((q, qi) => `
                            <div class="quiz-card rv" id="q${qi}" style="--d:${Math.min(qi, 3) * .06}s">
                                <div class="q-text">${qi + 1}. ${qText(q)}</div>
                                ${q.opts.map((o, oi) => `<div class="mobbin-opt" tabindex="0" role="button" onclick="pick(${qi},${oi})"><span class="k">${'ABCD'[oi]}</span><span>${o.text}</span></div>`).join('')}
                                <div class="exp"><div><div class="exp-in"><b>${L3.exp[lang]}:</b> ${q.e || L3.demo[lang]}</div></div></div>
                            </div>`).join('')}
                        <div class="quiz-card res" id="res"><div class="note">${L3.res[lang]}</div>
                            <div class="res-n"><span id="rn">0</span><small id="rt"></small></div>
                            <button class="btn-primary" onclick="retry()">${L3.again[lang]}</button></div>
                    </div>`, st);
                ans.forEach((a, i) => { if(a !== null) paint(i, a); });
                score();
                return;
            }

            const subsList = prof ? prof.subjects : Object.keys(subs);
            if(!subsList.includes(activeTab)) activeTab = subsList[0];
            const { total, done, pct } = stats();
            shown = st ? { done, pct } : { done: 0, pct: 0 };
            const names = subsList.map(s => `<span>${subs[s].icon} ${subs[s].name[lang]}</span>`).join('');

            show(`
                <div class="hero-banner rv">
                    <h1 class="hero-title sp">${t.title}</h1>
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">${t.sub}</p>
                    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:6px;">
                        <span>${L3.prog[lang]}</span><span><span id="p-done">${shown.done}</span> / <span id="p-total">${total}</span> (<span id="p-pct">${shown.pct}</span>%)</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width:${shown.pct}%"></div></div>
                </div>

                <div class="marquee"><div class="mq">${names}${names}${names}${names}</div></div>

                <div class="tabs-wrapper" id="tabs">
                    ${subsList.map(s => `<div data-s="${s}" tabindex="0" role="button" onclick="setTab('${s}')" class="tab-chip ${activeTab === s ? 'active' : ''}"><span>${subs[s].icon}</span><span>${subs[s].name[lang]}</span></div>`).join('')}
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;">
                    <div style="display:flex;gap:6px;">
                        <button id="f-all" onclick="setFilter('all')" class="btn-icon ${filter === 'all' ? 'active' : ''}">${t.all}</button>
                        <button id="f-min" onclick="setFilter('min')" class="btn-icon ${filter === 'min' ? 'active' : ''}">${t.min}</button>
                        <button id="f-done" onclick="setFilter('done')" class="btn-icon ${filter === 'done' ? 'active' : ''}">${t.done}</button>
                    </div>
                    <button onclick="goSub()" class="btn-icon" style="background:var(--accent);color:#fff;border:none;box-shadow:0 6px 18px var(--accent-glow);">${t.stest}</button>
                </div>

                <div id="list"></div>`, st);
            renderList(st);
            if(!st) requestAnimationFrame(() => requestAnimationFrame(updateProgress));
        }
    </script>
</body>
</html>
